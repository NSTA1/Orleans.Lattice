      out_of_scope:
        - statement: "A snapshot is not an external backup sink artifact."
          source: "docs/lattice/snapshots.md"
    operational_envelope:
      limits:
        - name: "default-max-snapshot-replay-entries"
          value: 10000000
          unit: "entries"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
        - name: "default-snapshot-baseline-ttl"
          value: 6
          unit: "hours"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/snapshots.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: storage-provider
    name: "Storage provider"
    category: storage
    definition: "A storage provider fills a replaceable durability or cache backend seam."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Storage backends are substitutable implementations behind public seams."
          source: "README.md"
      out_of_scope:
        - statement: "Storage providers do not change merge semantics."
          source: "README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/wal-storage-providers.md"
      - "README.md"
  - id: storage-seam
    name: "Storage seam"
    category: seam
    definition: "The storage seam separates WAL, grain state, backup artifact, and cache backend choices from core semantics."
    packages:
      - "Orleans.Lattice.Backup.AzureBlob"
      - "Orleans.Lattice.Storage.AzureTable"
      - "Orleans.Lattice.Storage.File"
    capability_boundary:
      in_scope:
        - statement: "Storage backends include Azure Table WAL, File WAL, Azure Blob backup sink, and Azure Blob distributed cache."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not perform identity or schema governance."
          source: "PACKAGES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/wal-storage-providers.md"
      - "PACKAGES.md"
  - id: tag-index
    name: "Tag index"
    category: index
    definition: "A tag index associates tags with tree keys and queries keys by tag union or intersection."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Supports WithAllTags and WithAnyTags queries."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Membership is eventually reconciled unless using combined atomic write paths."
          source: "docs/lattice/api.md"
    operational_envelope:
      limits:
        - name: "default-reconcile-interval"
          value: 1
          unit: "hour"
          source: "src/lattice/BPlusTree/LatticeTagIndexReconciliationOptions.cs"
        - name: "default-reconcile-chunk-size"
          value: 16
          unit: "entries"
          source: "src/lattice/BPlusTree/LatticeTagIndexReconciliationOptions.cs"
    sources:
      - "docs/lattice/api.md"
      - "src/lattice/BPlusTree/LatticeTagIndexReconciliationOptions.cs"
  - id: tenant
    name: "Tenant"
    category: governance
    definition: "A tenant is a keyspace-partitioned logical owner under a t/{tenant}/ prefix with lifecycle and policy state."
    packages:
      - "Orleans.Lattice.Tenancy"
    capability_boundary:
      in_scope:
        - statement: "Tenancy partitions keyspace under t/{tenant}/ prefixes."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "A tenant is not a physical Orleans cluster boundary."
          source: "docs/lattice.tenancy/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.tenancy/README.md"
      - "PACKAGES.md"
  - id: tenant-admission
    name: "Tenant admission"
    category: governance
    definition: "Tenant admission evaluates tenant quotas, usage, rate limits, and residency before admitting tenant operations."
    packages:
      - "Orleans.Lattice.Tenancy"
    capability_boundary:
      in_scope:
        - statement: "Tenancy supports per-tenant quotas, usage metering, rate limiting, and optional region residency."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Rate limiting is enforced per cluster."
          source: "PACKAGES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.tenancy/README.md"
      - "PACKAGES.md"
  - id: tombstone
    name: "Tombstone"
    category: core
    definition: "A tombstone is an LWW entry state representing a logical delete or expired value until compaction reaps it."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Deletes are represented as tombstones with timestamps."
          source: "docs/lattice/state-primitives.md"
      out_of_scope:
        - statement: "Physical deletion is deferred to compaction rather than immediate at logical delete time."
          source: "docs/lattice/tombstone-compaction.md"
    operational_envelope:
      limits:
        - name: "default-tombstone-grace-period"
          value: 24
          unit: "hours"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/state-primitives.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: tree
    name: "Tree"
    category: core
    definition: "A tree is a sorted durable key-value namespace whose string keys map to byte-array values or CRDT state."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "The core supports point reads, writes, deletes, TTL, ordered scans, atomic writes, bulk load, cursors, resize, reshard, snapshots, soft delete, events, diagnostics, and metrics."
          source: "README.md"
      out_of_scope:
        - statement: "The core is not an external database tier outside the Orleans cluster."
          source: "README.md"
    operational_envelope:
      limits:
        - name: "default-shard-count"
          value: 64
          unit: "shards"
          source: "src/lattice/BPlusTree/LatticeConstants.cs"
        - name: "default-max-leaf-keys"
          value: 128
          unit: "keys"
          source: "src/lattice/BPlusTree/LatticeConstants.cs"
    sources:
      - "docs/lattice/api.md"
      - "README.md"
      - "src/lattice/BPlusTree/LatticeConstants.cs"
  - id: tree-alias
    name: "Tree alias"
    category: core
    definition: "A tree alias maps a logical tree name to a physical tree id for resize or restore cutover."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Tree alias is stored in the registry entry as optional indirection."
          source: "docs/lattice/architecture.md"
      out_of_scope:
        - statement: "Alias indirection does not change the virtual shard count."
          source: "docs/lattice/architecture.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/architecture.md"
      - "docs/lattice.api.treeadmin/README.md"
  - id: ttl
    name: "Time-to-live"
    category: core
    definition: "TTL is an absolute server-side expiry attached to a value or CRDT write and preserved across topology operations."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Per-entry TTL is available on LWW SetAsync writes and typed CRDT writes."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "TTL expiry does not immediately purge storage without compaction."
          source: "docs/lattice/ttl.md"
    operational_envelope:
      limits:
        - name: "default-tombstone-grace-period"
          value: 24
          unit: "hours"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/ttl.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: value-codec-envelope
    name: "Value codec and envelope"
    category: durability
    definition: "A value codec or envelope carries serialized value bytes, merge metadata, compression framing, or API wire fields."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Typed payload helpers layer automatic serialization over opaque byte values."
          source: "README.md"
      out_of_scope:
        - statement: "The core tree cannot infer which CRDT a key holds from raw bytes alone."
          source: "docs/crdt/readme.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/api.md"
      - "README.md"
  - id: vector-index
    name: "Vector index"
    category: index
    definition: "A vector index is a persisted approximate nearest-neighbour index over Lattice-held vectors."
    packages:
      - "Orleans.Lattice.Vector"
    capability_boundary:
      in_scope:
        - statement: "Query cost is sub-linear in the corpus."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Approximate search does not promise exact nearest-neighbour recall unless exact mode answers."
          source: "docs/lattice.vector/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.vector/README.md"
      - "FEATURES.md"
  - id: version-vector
    name: "Version vector"
    category: primitive
    definition: "A version vector maps replica ids to highest observed HLC values and merges by pointwise maximum."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Leaf version vectors enable delta extraction."
          source: "docs/lattice/state-primitives.md"
      out_of_scope:
        - statement: "It is internal machinery rather than the recommended external projection API."
          source: "docs/lattice/state-primitives.md"
    operational_envelope:
      limits:
        - name: "default-min-version-vector-retention"
          value: 1
          unit: "hour"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/state-primitives.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: virtual-slot
    name: "Virtual slot"
    category: core
    definition: "A virtual slot is a fixed hash-space bucket that the shard map assigns to a physical shard."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Keys hash into one of 4096 virtual slots."
          source: "docs/lattice/architecture.md"
      out_of_scope:
        - statement: "Changing the virtual slot count would invalidate every stored shard map."
          source: "docs/lattice/architecture.md"
    operational_envelope:
      limits:
        - name: "default-virtual-shard-count"
          value: 4096
          unit: "slots"
          source: "src/lattice/BPlusTree/LatticeConstants.cs"
    sources:
      - "docs/lattice/architecture.md"
      - "src/lattice/BPlusTree/LatticeConstants.cs"
  - id: wal
    name: "Write-ahead log"
    category: durability
    definition: "The write-ahead log is the canonical commit boundary for tree mutations and the source for replay and derived projections."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "A successful SetAsync or DeleteAsync returns after the per-shard WAL append durability point."
          source: "docs/lattice/architecture.md"
      out_of_scope:
        - statement: "A WAL failure surfaces before in-memory mutation happens."
          source: "docs/lattice/architecture.md"
    operational_envelope:
      limits:
        - name: "default-wal-partitions"
          value: 8
          unit: "partitions"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
        - name: "default-wal-max-batch-entries"
          value: 100
          unit: "entries"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/wal.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: wal-cursor
    name: "WAL cursor"
    category: durability
    definition: "A WAL cursor records consumer progress through WAL records for replay, views, replication, backup, or retention."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Cursor lineage identifies the cluster that authored backup capture."
          source: "docs/lattice.api.backup/api.md"
      out_of_scope:
        - statement: "A cursor does not itself retain records unless pinned by a consumer policy."
          source: "docs/lattice/wal.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/wal.md"
      - "docs/lattice.api.backup/api.md"
  - id: wal-gc
    name: "WAL garbage collection"
    category: durability
    definition: "WAL garbage collection trims records no retained consumer still needs."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "WAL GC uses trim floors derived from materialiser pins and consumers."
          source: "docs/lattice/wal.md"
      out_of_scope:
        - statement: "A leaf without durable snapshot coverage can keep the tree WAL untrimmable."
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    operational_envelope:
      limits:
        - name: "default-wal-gc-interval"
          value: 1
          unit: "hour"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/wal.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: wal-move-placement
    name: "WAL placement and move"
    category: durability
    definition: "WAL placement and move operations inspect, plan, copy, quiesce, and reclaim WAL provider placement for partitions."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Tree administration includes WAL placement audit and movement."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Default max concurrent partition moves is one."
          source: "src/lattice/WalMoveOptions.cs"
    operational_envelope:
      limits:
        - name: "default-copy-page-size"
          value: 256
          unit: "records"
          source: "src/lattice/WalMoveOptions.cs"
        - name: "default-max-concurrent-partition-moves"
          value: 1
          unit: "move"
          source: "src/lattice/WalMoveOptions.cs"
    sources:
      - "docs/lattice.api.treeadmin/README.md"
      - "src/lattice/WalMoveOptions.cs"
  - id: wal-partition
    name: "WAL partition"
    category: durability
    definition: "A WAL partition is the stable per-tree append stream chosen for a key by hash modulo WalPartitions."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "WalShardGrain is keyed by tree id and partition."
          source: "docs/lattice/architecture.md"
      out_of_scope:
        - statement: "The WAL partition hash is stable and non-cryptographic."
          source: "docs/lattice/architecture.md"
    operational_envelope:
      limits:
        - name: "default-wal-partitions"
          value: 8
          unit: "partitions"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/architecture.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: wal-saturation-signal
    name: "WAL saturation signal"
    category: durability
    definition: "The WAL saturation signal reports healthy, throttled, or saturated state so callers can apply back-pressure."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Publishes a per-tree three-state back-pressure signal."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Callers must observe the signal to throttle offered load."
          source: "FEATURES.md"
    operational_envelope:
      limits:
        - name: "default-sample-interval"
          value: 200
          unit: "milliseconds"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
        - name: "default-throttled-ratio"
          value: 0.75
          unit: "ratio"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/wal-saturation-signal.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: wal-shard
    name: "WAL shard"
    category: durability
    definition: "A WAL shard grain appends and reads records for one tree partition against the configured WAL storage provider."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "WalShardGrain appends directly to IWalStorageProvider and recovers its next offset from the provider on activation."
          source: "docs/lattice/architecture.md"
      out_of_scope:
        - statement: "WalShardGrain has no Orleans grain state of its own."
          source: "docs/lattice/architecture.md"
    operational_envelope:
      limits:
        - name: "default-wal-max-pending-batches"
          value: 16
          unit: "batches"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/architecture.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: wal-storage-provider
    name: "WAL storage provider"
    category: storage
    definition: "A WAL storage provider implements durable append and read semantics behind the IWalStorageProvider seam."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "AddLattice registers an in-memory provider by default."
          source: "docs/lattice/api.md"
      out_of_scope:
        - statement: "Hosts needing restart durability must replace the in-memory WAL with a persistent provider."
          source: "docs/lattice/api.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/wal-storage-providers.md"
      - "docs/lattice/api.md"
  - id: write-interceptor
    name: "Write interceptor"
    category: governance
    definition: "A write interceptor is a governance seam that inspects or rejects writes before core mutation proceeds."
    packages:
      - "Orleans.Lattice.Schema"
    capability_boundary:
      in_scope:
        - statement: "Schema enforcement validates every local write against per-tree policy."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Strict ingest dead-letters replicated or restored items instead of applying them."
          source: "FEATURES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.schema/README.md"
      - "FEATURES.md"
