schema: lattice.agents/concepts/v1
concepts:
  - id: access-gate
    name: "Access gate"
    category: identity
    definition: "An access gate is the fail-closed authorization seam consulted before data and control operations mutate or reveal protected state."
    packages:
      - "Orleans.Lattice.Auth"
    capability_boundary:
      in_scope:
        - statement: "Authorizes data-plane and facade operations before the implementation touches engine state."
          source: "docs/lattice.api.replication/README.md"
      out_of_scope:
        - statement: "Does not authenticate credentials by itself."
          source: "docs/lattice.membership/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/security.md"
      - "docs/lattice.auth/README.md"
  - id: administration-seam
    name: "Administration seam"
    category: seam
    definition: "The administration seam groups operator control surfaces around tree, tenant, schema, backup, and restore operations."
    packages:
      - "Orleans.Lattice.Api.Backup"
      - "Orleans.Lattice.Api.TenantAdmin"
      - "Orleans.Lattice.Api.TreeAdmin"
    capability_boundary:
      in_scope:
        - statement: "Exposes control facades for tree administration, tenant administration, and backup operations."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not replace the ILattice data path for normal reads and writes."
          source: "README.md"
    operational_envelope:
      limits: []
    sources:
      - "PACKAGES.md"
      - "docs/lattice.api.treeadmin/README.md"
  - id: api-auth-facade
    name: "Auth API facade"
    category: api
    definition: "The auth facade administers membership and authorization policy and explains access decisions."
    packages:
      - "Orleans.Lattice.Api.Auth"
    capability_boundary:
      in_scope:
        - statement: "ExplainAsync consults the same access gate the data plane consults."
          source: "docs/lattice.api.auth/README.md"
      out_of_scope:
        - statement: "Ships no transport of its own."
          source: "docs/lattice.api.auth/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.auth/README.md"
  - id: api-backup-facade
    name: "Backup API facade"
    category: api
    definition: "The backup facade drives backup capture, catalog listing, restore, revert, and health operations through a transport-agnostic contract."
    packages:
      - "Orleans.Lattice.Api.Backup"
    capability_boundary:
      in_scope:
        - statement: "Catalog listing is cursor-resumable and page-bounded."
          source: "docs/lattice.api.backup/README.md"
      out_of_scope:
        - statement: "Capability probes are advisory and do not replace per-operation authorization."
          source: "docs/lattice.api.backup/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.backup/README.md"
  - id: api-data-facade
    name: "Data API facade"
    category: api
    definition: "The data facade exposes external write-capable point, range, CRDT, and atomic batch operations."
    packages:
      - "Orleans.Lattice.Api.Data"
    capability_boundary:
      in_scope:
        - statement: "Every operation routes through the gated ILattice surface."
          source: "docs/lattice.api.data/configuration.md"
      out_of_scope:
        - statement: "Does not add an authorization posture of its own."
          source: "docs/lattice.api.data/configuration.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.data/README.md"
  - id: api-facade
    name: "API facade"
    category: api
    definition: "An API facade is a transport-neutral service contract projected by gRPC, MCP, or Explorer heads."
    packages:
      - "Orleans.Lattice.Api.Abstractions"
    capability_boundary:
      in_scope:
        - statement: "Shared DTOs and interfaces are referenced by facade implementations and bindings."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not by itself host a network listener."
          source: "docs/lattice.api.auth/README.md"
    operational_envelope:
      limits: []
    sources:
      - "PACKAGES.md"
      - "docs/lattice.api.abstractions/README.md"
  - id: api-replication-facade
    name: "Replication API facade"
    category: api
    definition: "The replication facade enables, disables, and inspects per-tree replication configuration at runtime."
    packages:
      - "Orleans.Lattice.Api.Replication"
    capability_boundary:
      in_scope:
        - statement: "Enable and disable authorize the target tree through the access gate before touching engine state."
          source: "docs/lattice.api.replication/README.md"
      out_of_scope:
        - statement: "A conflicting concurrent enable can leave the mode ambiguous until disable and re-enable."
          source: "FEATURES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.replication/README.md"
  - id: api-schema-facade
    name: "Schema API facade"
    category: api
    definition: "The schema facade manages schema policy, dead letters, versioning, remediation, and compliance audits."
    packages:
      - "Orleans.Lattice.Api.Schema"
    capability_boundary:
      in_scope:
        - statement: "Capability probes report allowed operation sets and remain advisory."
          source: "docs/lattice.api.schema/api.md"
      out_of_scope:
        - statement: "Does not replace per-operation fail-closed authorization."
          source: "docs/lattice.api.schema/api.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.schema/README.md"
  - id: api-state-facade
    name: "State API facade"
    category: api
    definition: "The state facade exposes read-only cluster state, tree, entry, change-feed, and metrics queries."
    packages:
      - "Orleans.Lattice.Api.State"
    capability_boundary:
      in_scope:
        - statement: "Provides read-only state-API facade operations."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not expose mutating data-plane verbs."
          source: "PACKAGES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.state/README.md"
  - id: api-telemetry-facade
    name: "Telemetry API facade"
    category: api
    definition: "The telemetry facade answers named backend-neutral metric queries while deriving tenant scope server-side."
    packages:
      - "Orleans.Lattice.Api.Telemetry"
    capability_boundary:
      in_scope:
        - statement: "Callers name a query id and never supply PromQL."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not derive tenant scope in the gRPC binding."
          source: "PACKAGES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.telemetry/README.md"
  - id: api-tenantadmin-facade
    name: "Tenant admin API facade"
    category: api
    definition: "The tenant-admin facade exposes tenant lifecycle, quota, region, admin-subject, and grant control operations."
    packages:
      - "Orleans.Lattice.Api.TenantAdmin"
    capability_boundary:
      in_scope:
        - statement: "Operator control includes create, suspend, resume, delete, quota, grants, and residency."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Tenant administrators cannot change their own quota."
          source: "FEATURES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.tenantadmin/README.md"
  - id: api-treeadmin-facade
    name: "Tree admin API facade"
    category: api
    definition: "The tree-admin facade composes whole-tree lifecycle, topology, history, WAL, view, tag-index, and schema administration."
    packages:
      - "Orleans.Lattice.Api.TreeAdmin"
    capability_boundary:
      in_scope:
        - statement: "Exposes an advisory per-operation capability probe."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "The server still authorizes each real operation fail-closed."
          source: "FEATURES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.treeadmin/README.md"
  - id: atomic-action-saga
    name: "Atomic action saga"
    category: coordination
    definition: "An atomic action is a generic saga keyed by operation id with ordered forward steps and reverse-order compensation."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Compensates completed steps in strict reverse order when a later step faults."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Does not make irreversible side effects safe without a compensating effect."
          source: "docs/lattice/atomic-action.md"
    operational_envelope:
      limits:
        - name: "default-retention"
          value: 48
          unit: "hours"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
        - name: "default-max-steps"
          value: 64
          unit: "steps"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/atomic-action.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: atomic-batch
    name: "Atomic batch"
    category: coordination
    definition: "An atomic batch is a SetManyAtomicAsync operation with all-or-nothing visibility across multiple keys in one tree."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "No reader observes a partial-set state."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Does not coordinate non-tree side effects."
          source: "docs/lattice/atomic-writes.md"
    operational_envelope:
      limits:
        - name: "default-retention"
          value: 48
          unit: "hours"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/atomic-writes.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: auth-group
    name: "Auth group"
    category: identity
    definition: "An auth group is a durable membership grouping used by the authorization control plane."
    packages:
      - "Orleans.Lattice.Api.Auth"
      - "Orleans.Lattice.Auth"
    capability_boundary:
      in_scope:
        - statement: "AuthGroup records are serializable facade DTOs."
          source: "docs/lattice.api.auth/README.md"
      out_of_scope:
        - statement: "Group membership list endpoints are not paged."
          source: "docs/lattice.api.auth/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.auth/README.md"
  - id: auth-rule
    name: "Auth rule"
    category: identity
    definition: "An auth rule is a durable LatticeAuthorizationRule policy entry surfaced through the auth facade."
    packages:
      - "Orleans.Lattice.Api.Auth"
      - "Orleans.Lattice.Auth"
    capability_boundary:
      in_scope:
        - statement: "Rules are surfaced as the durable LatticeAuthorizationRule policy model."
          source: "docs/lattice.api.auth/README.md"
      out_of_scope:
        - statement: "Matched rules in explanations are advisory debugging detail."
          source: "docs/lattice.api.auth/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.auth/README.md"
  - id: autoscaling-signal
    name: "Autoscaling signal"
    category: observability
    definition: "The autoscaling signal reports compute demand and advisory storage-axis WAL rebalance recommendations for external autoscalers."
    packages:
      - "Orleans.Lattice.Scaling"
    capability_boundary:
      in_scope:
        - statement: "Serves an HTTP endpoint and ASP.NET Core health check."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "The storage-axis recommendation is advisory and signal-only."
          source: "FEATURES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.scaling/README.md"
      - "FEATURES.md"
  - id: azure-table-storage-provider
    name: "Azure Table storage provider"
    category: storage
    definition: "The Azure Table storage provider is a durable WAL backend for production clusters."
    packages:
      - "Orleans.Lattice.Storage.AzureTable"
    capability_boundary:
      in_scope:
        - statement: "Replaces the default in-memory WAL with a durable Azure Table-backed provider."
          source: "docs/lattice/api.md"
      out_of_scope:
        - statement: "Does not configure Orleans grain storage by itself."
          source: "docs/lattice/api.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.storage.azuretable/README.md"
      - "docs/lattice/wal-storage-providers.md"
  - id: backup
    name: "Backup"
    category: operation
    definition: "A backup captures tree state into a backup sink as full, incremental, or backup-set artifacts."
    packages:
      - "Orleans.Lattice.Backup"
    capability_boundary:
      in_scope:
        - statement: "Capture operations authorize their target scope before touching backup data."
          source: "docs/lattice.api.backup/README.md"
      out_of_scope:
        - statement: "A backup id is already an effective id and is not tenant-composed again."
          source: "docs/lattice.api.backup/api.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.backup/README.md"
  - id: bplus-internal-node
    name: "B+ internal node"
    category: core
    definition: "A B+ internal node stores separator keys and child references for non-leaf levels of a shard subtree."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Routes a key to the correct child and accepts promoted splits from below."
          source: "docs/lattice/architecture.md"
      out_of_scope:
        - statement: "Is only allocated once shard depth exceeds one."
          source: "docs/lattice/architecture.md"
    operational_envelope:
      limits:
        - name: "default-max-internal-children"
          value: 128
          unit: "children"
          source: "src/lattice/BPlusTree/LatticeConstants.cs"
    sources:
      - "docs/lattice/architecture.md"
      - "src/lattice/BPlusTree/LatticeConstants.cs"
  - id: bplus-leaf-node
    name: "B+ leaf node"
    category: core
    definition: "A B+ leaf node owns live key entries for a key range and commits each mutation through the WAL before applying it."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "The persisted leaf state row carries topology and checkpoint metadata, never per-key entries."
          source: "docs/lattice/architecture.md"
      out_of_scope:
        - statement: "Cannot split a single entry into smaller pieces when one entry exceeds the byte bound."
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    operational_envelope:
      limits:
        - name: "default-max-leaf-keys"
          value: 128
          unit: "keys"
          source: "src/lattice/BPlusTree/LatticeConstants.cs"
        - name: "default-max-leaf-bytes"
          value: 67108864
          unit: "bytes"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/architecture.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: bplus-tree
    name: "B+ tree"
    category: core
    definition: "A B+ tree is the sorted per-tree data structure composed of shard roots, internal nodes, leaves, and sibling leaf links."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Each shard owns an independent sub-tree."
          source: "docs/lattice/architecture.md"
      out_of_scope:
        - statement: "Keys in different shards have no ordering relationship until scatter-gather scan merge."
          source: "docs/lattice/architecture.md"
    operational_envelope:
      limits:
        - name: "default-max-leaf-keys"
          value: 128
          unit: "keys"
          source: "src/lattice/BPlusTree/LatticeConstants.cs"
        - name: "default-max-internal-children"
          value: 128
          unit: "children"
          source: "src/lattice/BPlusTree/LatticeConstants.cs"
    sources:
      - "docs/lattice/architecture.md"
      - "src/lattice/BPlusTree/LatticeConstants.cs"
  - id: caching
    name: "Caching"
    category: observability
    definition: "Caching covers the per-silo read-through leaf cache and companion distributed cache backends."
    packages:
      - "Orleans.Lattice"
      - "Orleans.Lattice.Caching.AzureBlob"
    capability_boundary:
      in_scope:
        - statement: "Leaf cache pulls deltas from the primary leaf and merges LWW entries."
          source: "docs/lattice/architecture.md"
      out_of_scope:
        - statement: "Distributed cache backend does not provide tree WAL durability."
          source: "PACKAGES.md"
    operational_envelope:
      limits:
        - name: "default-cache-ttl"
          value: 0
          unit: "seconds"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
        - name: "default-leaf-cache-prewarm-count"
          value: 8
          unit: "leaves"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/caching.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: compaction
    name: "Compaction"
    category: core
    definition: "Compaction reaps expired tombstones and rewrites storage structures that are safe to reclaim."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Tombstone compaction permanently removes tombstones older than the configured grace period."
          source: "docs/lattice/tombstone-compaction.md"
      out_of_scope:
        - statement: "Compaction does not change live values."
          source: "docs/lattice/tombstone-compaction.md"
    operational_envelope:
      limits:
        - name: "default-tombstone-grace-period"
          value: 24
          unit: "hours"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
        - name: "default-compaction-leaf-batch-size"
          value: 64
          unit: "leaves"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/tombstone-compaction.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: compression-dictionary
    name: "Compression dictionary"
    category: durability
    definition: "A compression dictionary is optional shared state used by the pluggable compression subsystem to reduce framed payload size."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Auto-training samples payloads under bounded reservoir and sample counts."
          source: "src/lattice/CompressionDictionaryTrainingOptions.cs"
      out_of_scope:
        - statement: "Dictionary compression is opt-in beyond dictionary-less Zstandard framing."
          source: "docs/lattice/compression.md"
    operational_envelope:
      limits:
        - name: "default-max-sample-count"
          value: 1024
          unit: "samples"
          source: "src/lattice/CompressionDictionaryTrainingOptions.cs"
        - name: "default-max-reservoir-bytes"
          value: 8388608
          unit: "bytes"
          source: "src/lattice/CompressionDictionaryTrainingOptions.cs"
    sources:
      - "docs/lattice/compression.md"
      - "src/lattice/CompressionDictionaryTrainingOptions.cs"
  - id: conflict-resolution-merge
    name: "Conflict resolution merge"
    category: crdt
    definition: "Conflict resolution merge is the algebraic merge rule that converges LWW entries and CRDT states without consensus."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "CRDT merge functions are commutative, associative, and idempotent."
          source: "docs/crdt/readme.md"
      out_of_scope:
        - statement: "Plain SetAsync last-writer-wins can silently discard one concurrent write."
          source: "docs/crdt/readme.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/crdt/readme.md"
      - "docs/lattice/state-primitives.md"
  - id: cross-tree-atomic
    name: "Cross-tree atomic"
    category: coordination
    definition: "Cross-tree atomic writes extend all-or-nothing visibility to a batch spanning multiple trees."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "IGrainFactory.SetManyAtomicAsync extends atomic visibility to a batch spanning multiple trees."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Does not cover arbitrary non-Lattice side effects."
          source: "docs/lattice/atomic-writes.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/atomic-writes.md"
      - "FEATURES.md"
  - id: cursor
    name: "Cursor"
    category: core
    definition: "A cursor is a server-checkpointed iterator over keys or entries with persisted scan position."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Durable cursors resume after failovers, client restarts, and topology changes."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Durable cursors are not snapshot-isolated unless opened through snapshot cursor APIs."
          source: "docs/lattice/snapshot-cursors.md"
    operational_envelope:
      limits:
        - name: "default-cursor-idle-ttl"
          value: 48
          unit: "hours"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/durable-cursors.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: dashboards
    name: "Dashboards"
    category: observability
    definition: "Dashboards are bundled Grafana panels and provisioning templates for Lattice meters."
    packages:
      - "Orleans.Lattice.Dashboards"
    capability_boundary:
      in_scope:
        - statement: "Dashboard package covers the core, replication, auth, membership, backup, scaling, and tenancy meters."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not collect metrics by itself."
          source: "docs/lattice.dashboards/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.dashboards/README.md"
      - "PACKAGES.md"
  - id: dead-letter
    name: "Dead letter"
    category: governance
    definition: "A dead letter is a strict-ingest schema rejection diverted for inspection instead of being applied."
    packages:
      - "Orleans.Lattice.Schema"
    capability_boundary:
      in_scope:
        - statement: "Strict ingest dead-letters a non-compliant replicated or restored item."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Dead-letter listing is a bounded read surface, not a mutating remediation by itself."
          source: "docs/lattice.api.schema/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.schema/README.md"
      - "docs/lattice.api.schema/README.md"
  - id: distributed-lock-lease
    name: "Distributed lock lease"
    category: coordination
    definition: "A distributed lock lease grants bounded exclusive ownership and expires so a crashed holder cannot wedge progress."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "The lock is FIFO-fair and cluster-wide."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "A protected resource must validate fencing tokens to reject stale holders."
          source: "docs/lattice/distributed-lock.md"
    operational_envelope:
      limits:
        - name: "default-lease-duration"
          value: 30
          unit: "seconds"
          source: "src/lattice/BPlusTree/LatticeOptions.cs"
    sources:
      - "docs/lattice/distributed-lock.md"
      - "src/lattice/BPlusTree/LatticeOptions.cs"
  - id: explorer
    name: "Explorer"
    category: administration
    definition: "The Explorer is an opt-in auth-aware web console that uses gRPC APIs to browse and administer a cluster."
    packages:
      - "Orleans.Lattice.Explorer.Web"
    capability_boundary:
      in_scope:
        - statement: "The Explorer never joins cluster membership."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "Its surface area and navigation are documented as in progress."
          source: "FEATURES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.explorer/README.md"
      - "FEATURES.md"
  - id: fencing-token
    name: "Fencing token"
    category: coordination
    definition: "A fencing token is a monotonic value issued by a lock and checked by the guarded resource to reject stale holders."
    packages:
      - "Orleans.Lattice"
    capability_boundary:
      in_scope:
        - statement: "Distributed lock admission decisions include monotonic fencing tokens."
          source: "FEATURES.md"
      out_of_scope:
        - statement: "A token alone does not protect a resource that ignores it."
          source: "docs/lattice/distributed-lock.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/distributed-lock.md"
      - "FEATURES.md"
  - id: file-storage-provider
    name: "File WAL storage provider"
    category: storage
    definition: "The file WAL storage provider is a durable local-disk append-and-fsync log per shard."
    packages:
      - "Orleans.Lattice.Storage.File"
    capability_boundary:
      in_scope:
        - statement: "It provides crash-safe reconciliation and background compaction."
          source: "PACKAGES.md"
      out_of_scope:
