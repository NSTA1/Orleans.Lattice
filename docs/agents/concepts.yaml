schema: lattice.agents/concepts/v1
concepts:
  - id: access-gate
    name: "Access gate"
    category: identity
    definition: "An access gate is the fail-closed authorization seam consulted before data and control operations mutate or reveal protected state."
    packages:
      - "Orleans.Lattice.Auth"
    capability_boundary:
      in_scope:
        - statement: "Authorizes data-plane and facade operations before the implementation touches engine state."
          source: "docs/lattice.api.replication/README.md"
      out_of_scope:
        - statement: "Does not authenticate credentials by itself."
          source: "docs/lattice.membership/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice/security.md"
      - "docs/lattice.auth/README.md"
  - id: administration-seam
    name: "Administration seam"
    category: seam
    definition: "The administration seam groups operator control surfaces around tree, tenant, schema, backup, and restore operations."
    packages:
      - "Orleans.Lattice.Api.Backup"
      - "Orleans.Lattice.Api.TenantAdmin"
      - "Orleans.Lattice.Api.TreeAdmin"
    capability_boundary:
      in_scope:
        - statement: "Exposes control facades for tree administration, tenant administration, and backup operations."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not replace the ILattice data path for normal reads and writes."
          source: "README.md"
    operational_envelope:
      limits: []
    sources:
      - "PACKAGES.md"
      - "docs/lattice.api.treeadmin/README.md"
  - id: api-auth-facade
    name: "Auth API facade"
    category: api
    definition: "The auth facade administers membership and authorization policy and explains access decisions."
    packages:
      - "Orleans.Lattice.Api.Auth"
    capability_boundary:
      in_scope:
        - statement: "ExplainAsync consults the same access gate the data plane consults."
          source: "docs/lattice.api.auth/README.md"
      out_of_scope:
        - statement: "Ships no transport of its own."
          source: "docs/lattice.api.auth/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.auth/README.md"
  - id: api-backup-facade
    name: "Backup API facade"
    category: api
    definition: "The backup facade drives backup capture, catalog listing, accept-then-poll operation tracking, restore, revert, and health operations through a transport-agnostic contract."
    packages:
      - "Orleans.Lattice.Api.Backup"
    capability_boundary:
      in_scope:
        - statement: "Catalog listing is cursor-resumable and page-bounded."
          source: "docs/lattice.api.backup/README.md"
        - statement: "Backup and restore start verbs return operation handles and expose status, list, and cancel through ILatticeBackupOperations."
          source: "docs/lattice.api.backup/operations.md"
      out_of_scope:
        - statement: "Capability probes are advisory and do not replace per-operation authorization."
          source: "docs/lattice.api.backup/README.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.backup/README.md"
      - "docs/lattice.api.backup/operations.md"
  - id: api-data-facade
    name: "Data API facade"
    category: api
    definition: "The data facade exposes external write-capable point, range, CRDT, and atomic batch operations."
    packages:
      - "Orleans.Lattice.Api.Data"
    capability_boundary:
      in_scope:
        - statement: "Every operation routes through the gated ILattice surface."
          source: "docs/lattice.api.data/configuration.md"
      out_of_scope:
        - statement: "Does not add an authorization posture of its own."
          source: "docs/lattice.api.data/configuration.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.data/README.md"
  - id: api-facade
    name: "API facade"
    category: api
    definition: "An API facade is a transport-neutral service contract projected by gRPC, MCP, or Explorer heads."
    packages:
      - "Orleans.Lattice.Api.Abstractions"
    capability_boundary:
      in_scope:
        - statement: "Shared DTOs and interfaces are referenced by facade implementations and bindings."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not by itself host a network listener."
          source: "docs/lattice.api.auth/README.md"
    operational_envelope:
      limits: []
    sources:
      - "PACKAGES.md"
      - "docs/lattice.api.abstractions/README.md"
  - id: api-replication-facade
    name: "Replication API facade"
    category: api
    definition: "The replication facade enables, disables, and inspects per-tree replication configuration at runtime."
    packages:
      - "Orleans.Lattice.Api.Replication"
    capability_boundary:
      in_scope:
        - statement: "Enable and disable authorize the target tree through the access gate before touching engine state."
          source: "docs/lattice.api.replication/README.md"
      out_of_scope:
        - statement: "A concurrent enable under a different merge mode can leave the mode ambiguous until disable and re-enable."
          source: "FEATURES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.replication/README.md"
  - id: api-schema-facade
    name: "Schema API facade"
    category: api
    definition: "The schema facade manages schema policy, dead letters, versioning, remediation, and compliance audits."
    packages:
      - "Orleans.Lattice.Api.Schema"
    capability_boundary:
      in_scope:
        - statement: "Capability probes report allowed operation sets and remain advisory."
          source: "docs/lattice.api.schema/api.md"
      out_of_scope:
        - statement: "Does not replace per-operation fail-closed authorization."
          source: "docs/lattice.api.schema/api.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.schema/README.md"
  - id: api-state-facade
    name: "State API facade"
    category: api
    definition: "The state facade exposes read-only cluster state, tree, entry, change-feed, and metrics queries."
    packages:
      - "Orleans.Lattice.Api.State"
    capability_boundary:
      in_scope:
        - statement: "Provides read-only state-API facade operations."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not expose mutating data-plane verbs."
          source: "PACKAGES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.state/README.md"
  - id: api-telemetry-facade
    name: "Telemetry API facade"
    category: api
    definition: "The telemetry facade answers named backend-neutral metric queries while deriving tenant scope server-side."
    packages:
      - "Orleans.Lattice.Api.Telemetry"
    capability_boundary:
      in_scope:
        - statement: "Callers name a query id and never supply PromQL."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Does not derive tenant scope in the gRPC binding."
          source: "PACKAGES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.telemetry/README.md"
  - id: api-tenantadmin-facade
    name: "Tenant admin API facade"
    category: api
    definition: "The tenant-admin facade exposes tenant lifecycle, quota, region, admin-subject, and grant control operations."
    packages:
      - "Orleans.Lattice.Api.TenantAdmin"
    capability_boundary:
      in_scope:
        - statement: "Operator control includes create, suspend, resume, delete, quota, grants, and residency."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "Tenant administrators cannot change their own quota."
          source: "FEATURES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.tenantadmin/README.md"
  - id: api-treeadmin-facade
    name: "Tree admin API facade"
    category: api
    definition: "The tree-admin facade composes whole-tree lifecycle, topology, history, WAL, view, tag-index, and schema administration."
    packages:
      - "Orleans.Lattice.Api.TreeAdmin"
    capability_boundary:
      in_scope:
        - statement: "Exposes an advisory per-operation capability probe."
          source: "PACKAGES.md"
      out_of_scope:
        - statement: "The server still authorizes each real operation fail-closed."
          source: "FEATURES.md"
    operational_envelope:
      limits: []
    sources:
      - "docs/lattice.api.treeadmin/README.md"
  - id: app-bridge
    name: "App bridge"
    category: apps
    definition: "The app bridge is the cluster-side facade that enforces an installed app UI's logical-tree data access for a caller and then executes the core data path under that caller's identity."
    packages:
      - "Orleans.Lattice.Api.Apps"
    capability_boundary:
      in_scope:
        - statement: "The bridge target is an app slug, install revision and app-local tree name."
          source: "src/lattice.api.abstractions/Apps/ILatticeAppBridge.cs#ILatticeAppBridge"
        - statement: "The bridge resolves the effective tree id server-side after checking install revision, bridge consent and app-owned grants."
          source: "src/lattice.api.apps/LatticeAppBridge.cs#LatticeAppBridge.AuthorizeAsync"
      out_of_scope:
        - statement: "The bridge exposes no overload that accepts a physical tree id."
          source: "src/lattice.api.abstractions/Apps/ILatticeAppBridge.cs#ILatticeAppBridge"
    operational_envelope:
      limits:
        - name: "max-value-bytes"
          value: 65536
          unit: "bytes"
          source: "src/lattice.api.apps/AppBridgeLimits.cs#AppBridgeLimits.MaxValueBytes"
        - name: "max-scan-page-size"
          value: 200
          unit: "entries"
          source: "src/lattice.api.apps/AppBridgeLimits.cs#AppBridgeLimits.MaxPageSize"
    sources:
      - "src/lattice.api.abstractions/Apps/ILatticeAppBridge.cs#ILatticeAppBridge"
      - "src/lattice.api.apps/LatticeAppBridge.cs#LatticeAppBridge"
  - id: app-capability-ceiling
    name: "App capability ceiling"
    category: apps
    definition: "An app capability ceiling is the install-time operation mask and approved exception-scope list every compiled app grant must fit within."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "AllowedOperations is the maximum operation set available to compiled rules."
          source: "src/lattice.apps/Install/AppCapabilityCeiling.cs#AppCapabilityCeiling.AllowedOperations"
        - statement: "ApprovedExceptionScopes names tenant-local scopes outside the app's structural namespace."
          source: "src/lattice.apps/Install/AppCapabilityCeiling.cs#AppCapabilityCeiling.ApprovedExceptionScopes"
      out_of_scope:
        - statement: "The ceiling records approval and does not itself authorize or compile rules."
          source: "src/lattice.apps/Install/AppCapabilityCeiling.cs#AppCapabilityCeiling"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Install/AppCapabilityCeiling.cs"
      - "docs/lattice.apps/README.md"
  - id: app-catalog
    name: "App catalog"
    category: apps
    definition: "The app catalog is the administrative source browser that lists configured app sources and source-offered app versions before installation."
    packages:
      - "Orleans.Lattice.Api.Apps"
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "The catalog lists source summaries and source-offered apps after authorizing AppInstall."
          source: "src/lattice.api.apps/LatticeAppCatalog.cs#LatticeAppCatalog.ListSourcesAsync"
        - statement: "The catalog joins source-offered rows with the active tenant's installs only when the install came from that row's source."
          source: "src/lattice.api.apps/LatticeAppCatalog.Listing.cs#LatticeAppCatalog.ToSummaryAsync"
      out_of_scope:
        - statement: "The catalog does not load or activate app code while describing a source app or reading its icon."
          source: "src/lattice.api.apps/LatticeAppCatalog.cs#LatticeAppCatalog"
    operational_envelope:
      limits:
        - name: "max-concurrent-source-fetches"
          value: 4
          unit: "source-pages"
          source: "src/lattice.api.apps/LatticeAppCatalog.Listing.cs#LatticeAppCatalog.MaxConcurrentFetches"
        - name: "max-source-fetches-per-call"
          value: 64
          unit: "source-pages"
          source: "src/lattice.api.apps/LatticeAppCatalog.Listing.cs#LatticeAppCatalog.MaxFetchesPerCall"
    sources:
      - "src/lattice.api.abstractions/Apps/ILatticeAppCatalog.cs#ILatticeAppCatalog"
      - "src/lattice.api.apps/LatticeAppCatalog.cs#LatticeAppCatalog"
  - id: app-catalog-source
    name: "App catalog source"
    category: apps
    definition: "An app catalog source is a named app source that can list app entries and open digest-verified bundle assets without activating app code."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "A catalog source describes itself with a stable key, display name, kind and capabilities."
          source: "src/lattice.apps/Sources/IAppCatalogSource.cs#IAppCatalogSource.Descriptor"
        - statement: "A catalog source opens an asset only as a structured result verified against the expected SHA-256 digest."
          source: "src/lattice.apps/Sources/IAppCatalogSource.cs#IAppCatalogSource.OpenAssetAsync"
      out_of_scope:
        - statement: "A catalog source reports missing, unavailable or mismatched assets as structured outcomes rather than startup failures."
          source: "src/lattice.apps/Sources/IAppCatalogSource.cs#IAppCatalogSource.OpenAssetAsync"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Sources/IAppCatalogSource.cs#IAppCatalogSource"
  - id: app-change-feed-subscription
    name: "App change-feed subscription"
    category: apps
    definition: "An app change-feed subscription observes committed mutations on an app tree through the mutation observer seam and dispatches them to a registered handler."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "Subscriptions to another app tree or adopted tree must be covered by an approved exception scope."
          source: "src/lattice.apps/Subscriptions/AppSubscriptionCompiler.cs#AppSubscriptionCompiler.Compile"
        - statement: "A handler exception is logged and does not fail the write that produced the mutation."
          source: "src/lattice.apps/Subscriptions/AppSubscriptionRouter.cs#AppSubscriptionRouter.OnMutationAsync"
      out_of_scope:
        - statement: "Subscriptions are not delivered for maintenance mutations."
          source: "src/lattice.apps/Subscriptions/AppSubscriptionRouter.cs#AppSubscriptionRouter.OnMutationAsync"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Subscriptions/AppSubscriptionCompiler.cs"
      - "src/lattice.apps/Subscriptions/AppSubscriptionRouter.cs"
      - "docs/lattice.apps/README.md"
  - id: app-install-capability
    name: "AppInstall capability"
    category: identity
    definition: "AppInstall is the scopeless cluster-wide capability required for app lifecycle, consent, and app-control read verbs."
    packages:
      - "Orleans.Lattice.Apps"
      - "Orleans.Lattice.Api.Apps"
    capability_boundary:
      in_scope:
        - statement: "Every app lifecycle transition authorizes AppInstall over the cluster-wide scope before storage access."
          source: "src/lattice.apps/Registry/AppInstallAuthorizer.cs#AppInstallAuthorizer.AuthorizeAsync"
        - statement: "The app-control facade gates read verbs as well as lifecycle mutations before registry or source metadata is read."
          source: "src/lattice.api.apps/LatticeAppsControl.cs#LatticeAppsControl.AuthorizeAsync"
      out_of_scope:
        - statement: "AppInstall is excluded from role compilation and cannot be granted by an app role."
          source: "src/lattice.apps/Compiler/AppRoleCompiler.cs#AppRoleCompiler.Compile"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Registry/AppInstallAuthorizer.cs"
      - "src/lattice.api.apps/LatticeAppsControl.cs"
  - id: app-install-record
    name: "App install record"
    category: apps
    definition: "An app install record is the durable per-tenant registry record for one app install, including version, ceiling, role bindings, and lifecycle state."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "The record is keyed by tenant id and app slug in the reserved sys-app-registry tree."
          source: "src/lattice.apps/Registry/AppRegistryRecord.cs#AppRegistryRecord"
        - statement: "CeilingVersion pins the consented ceiling to the installed app version."
          source: "src/lattice.apps/Registry/AppRegistryRecord.cs#AppRegistryRecord.CeilingVersion"
      out_of_scope:
        - statement: "Uninstall retains the record in the Uninstalled state rather than deleting app data."
          source: "src/lattice.apps/Registry/IAppRegistry.cs#IAppRegistry.UninstallAsync"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Registry/AppRegistryRecord.cs"
      - "src/lattice.apps/Registry/IAppRegistry.cs"
  - id: app-manifest
    name: "App manifest"
    category: apps
    definition: "An app manifest is the embedded JSON declaration of an app's identity, trees, roles, replication intent, schema bindings, subscriptions, and MCP tools."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "The manifest contains inspectable declarations and no executable types, handlers, or assembly names to load."
          source: "src/lattice.apps/Manifest/AppManifest.cs#AppManifest"
        - statement: "Validation returns AppManifestError diagnostics for invalid declarations."
          source: "src/lattice.apps/Manifest/AppManifestValidator.cs#AppManifestValidator.Validate"
      out_of_scope:
        - statement: "Runtime acquisition and signature verification are future IAppSource responsibilities, not manifest fields."
          source: "src/lattice.apps/Sources/IAppSource.cs#IAppSource"
    operational_envelope:
      limits:
        - statement: "Runtime manifest text or stream input larger than 1 MiB is refused before deserialization."
          source: "src/lattice.apps/Manifest/AppManifestParser.cs#AppManifestParser.Parse"
        - statement: "Each manifest section is bounded to 256 entries."
          source: "src/lattice.apps/Manifest/AppManifestLimits.cs#AppManifestLimits.MaxSectionItems"
    sources:
      - "src/lattice.apps/Manifest/AppManifest.cs"
      - "src/lattice.apps/Manifest/AppManifestValidator.cs"
  - id: app-mcp-tool
    name: "App MCP tool"
    category: mcp
    definition: "An app MCP tool is a manifest-declared app-local tool implementation advertised as a namespaced MCP tool only for enabled apps whose declared role the caller holds by binding and is not denied."
    packages:
      - "Orleans.Lattice.Api.Mcp.Apps"
    capability_boundary:
      in_scope:
        - statement: "Tool names are composed as slug, underscore, and app-local tool name."
          source: "src/lattice.api.mcp.apps/AppMcpToolName.cs#AppMcpToolName.Compose"
        - statement: "Advertisement and invocation both re-check that the caller holds the declared role by binding; the shared access gate is consulted only after the binding holds, and only to refuse."
          source: "src/lattice.api.mcp.apps/AppMcpToolSource.cs#AppMcpToolSource.IsInvocationPermittedAsync"
      out_of_scope:
        - statement: "App MCP tools do not appear in the lattice_capabilities report."
          source: "docs/lattice.api.mcp.apps/README.md"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.api.mcp.apps/AppMcpToolName.cs"
      - "src/lattice.api.mcp.apps/AppMcpToolSource.cs"
      - "docs/lattice.api.mcp.apps/README.md"
  - id: app-owned-rule
    name: "App-owned authorization rule"
    category: identity
    definition: "An app-owned authorization rule is a compiled authorization rule whose id starts with app: and is replaced as part of the app's owned rule set."
    packages:
      - "Orleans.Lattice.Apps"
      - "Orleans.Lattice.Auth"
    capability_boundary:
      in_scope:
        - statement: "Every rule id emitted by the app role compiler starts with the app-owned prefix for its slug."
          source: "src/lattice.apps/Compiler/AppRoleCompiler.cs#AppRoleCompiler.GetOwnedRuleIdPrefix"
        - statement: "Operator writes and deletes of app-owned rule ids are rejected by the policy store outside system origin."
          source: "src/lattice.auth/ILatticeAuthorizationPolicyStore.cs#ILatticeAuthorizationPolicyStore.PutRuleAsync"
      out_of_scope:
        - statement: "Operators can author separate rules outside the app-owned prefix."
          source: "src/lattice.auth/LatticeAppRuleIds.cs#LatticeAppRuleIds.Prefix"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Compiler/AppRoleCompiler.cs"
      - "src/lattice.auth/ILatticeAuthorizationPolicyStore.cs"
  - id: app-owned-tree
    name: "App-owned tree"
    category: apps
    definition: "An app-owned tree is a manifest tree resolved to the structural a/{app}/{tree} namespace and then composed through tenancy as the outer axis."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "Structural app trees are composed as a/{slug}/{tree} before tenant composition."
          source: "src/lattice.apps/Activation/AppActivationTreeNames.cs#AppActivationTreeNames.LocalStructuralTree"
        - statement: "Uninstall soft-deletes structural app trees and never touches adopted trees."
          source: "src/lattice.apps/Activation/AppActivationEngine.cs#AppActivationEngine.UninstallAsync"
      out_of_scope:
        - statement: "Physical purge is not part of the uninstall transition; an immediate purge remains a separate TreeLifecycle operation, while the core deferred purge removes soft-deleted structural app trees after their soft-delete windows elapse."
          source: "docs/lattice.apps/README.md"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Activation/AppActivationTreeNames.cs"
      - "src/lattice.apps/Activation/AppActivationEngine.cs"
  - id: app-role-binding
    name: "App role binding"
    category: identity
    definition: "An app role binding maps one manifest role name to one membership group id at install or consent time."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "A registry install request rejects duplicate role bindings and empty group ids."
          source: "src/lattice.apps/Registry/AppRegistry.cs#AppRegistry.ValidateRequest"
        - statement: "The role compiler emits group subject selectors from bindings, never user subject selectors."
          source: "src/lattice.apps/Compiler/AppRoleCompiler.cs#AppRoleCompiler.Compile"
        - statement: "UpdateRoleBindingsAsync replaces every role-to-group binding of an installed app while keeping consent, bridge consent and lifecycle state."
          source: "src/lattice.api.apps/LatticeAppsControl.RoleBindings.cs#LatticeAppsControl.UpdateRoleBindingsAsync"
      out_of_scope:
        - statement: "The manifest has no role inheritance construct; group nesting is a membership concern."
          source: "docs/lattice.apps/README.md"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Registry/AppRegistry.cs"
      - "src/lattice.apps/Compiler/AppRoleCompiler.cs"
  - id: app-role-compiler
    name: "App role compiler"
    category: apps
    definition: "The app role compiler is the pure function that resolves manifest roles and bindings into ordinary authorization rules under the installed ceiling."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "Every role operation must be a subset of the installed ceiling; excess fails the whole compilation and emits no rules."
          source: "src/lattice.apps/Compiler/AppRoleCompiler.cs#AppRoleCompiler.Compile"
        - statement: "The compiler computes a diff that replaces only rules under the app's owned prefix."
          source: "src/lattice.apps/Compiler/AppRoleCompiler.cs#AppRoleCompiler.ComputeDiff"
      out_of_scope:
        - statement: "Persisting compiled rules is the activation pipeline's responsibility."
          source: "src/lattice.apps/Compiler/AppRoleCompiler.cs#AppRoleCompiler"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Compiler/AppRoleCompiler.cs"
      - "docs/lattice.apps/README.md"
  - id: app-role-grant-evaluator
    name: "App role grant evaluator"
    category: identity
    definition: "The app role grant evaluator is the shared evaluator that decides which roles of an enabled install a caller holds in the current registry snapshot."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "A binding grants the role only when the caller's group closure contains a group the install binds to that role."
          source: "src/lattice.apps/Registry/AppRoleGate.cs#AppRoleGate.IsHeld"
        - statement: "The shared access gate is asked only after the binding holds and can only remove the role."
          source: "src/lattice.apps/Registry/AppRoleGate.cs#AppRoleGate.IsHeldAsync"
      out_of_scope:
        - statement: "Rights granted through any non-app-owned rule never make a caller hold an app role."
          source: "src/lattice.apps/Registry/AppRoleGrantEvaluator.cs#AppRoleGrantEvaluator"
    operational_envelope:
      limits: []
    sources:
      - "src/lattice.apps/Registry/AppRoleGate.cs#AppRoleGate"
      - "src/lattice.apps/Registry/AppRoleGrantEvaluator.cs#AppRoleGrantEvaluator"
  - id: app-source
    name: "App source"
    category: apps
    definition: "An app source is a named catalogue source that lists apps, resolves a slug and optional version to a manifest, provenance and deferred activation handle, and opens digest-verified UI bundle assets without activating app code."
    packages:
      - "Orleans.Lattice.Apps"
    capability_boundary:
      in_scope:
        - statement: "ResolveAsync returns structured source results for unknown slugs, version mismatches, invalid manifests, and identity mismatches."
          source: "src/lattice.apps/Sources/IAppSource.cs#IAppSource.ResolveAsync"
        - statement: "AppSourceSet composes named catalogue sources in registration order; without a source key, resolution succeeds only when exactly one source offers the slug."
          source: "src/lattice.apps/Sources/AppSourceSet.cs#AppSourceSet.ResolveAsync"
