schema: lattice.agents/deployment/v1
topologies:
  - id: global
    silos: "One or more silo replicas per region; reference architecture defaults to min 1 and max 3 on Azure Container Apps."
    regions: "Multiple active-active regions."
    packages:
      - "Orleans.Lattice"
      - "Orleans.Lattice.Replication"
      - "Orleans.Lattice.Replication.Grpc"
      - "Orleans.Lattice.Backup"
      - "Orleans.Lattice.Backup.AzureBlob"
      - "Orleans.Lattice.Storage.AzureTable"
      - "Orleans.Lattice.Api.Mcp"
      - "Orleans.Lattice.Explorer.Web"
      - "Orleans.Lattice.Scaling"
      - "Orleans.Lattice.Dashboards"
    trees: "Application trees plus replicated auth/config and backup catalog system trees as registered by the enabled packages."
    replication_mode: "Active-active across enrolled peers; per-key HLC/LWW or CRDT convergence, with atomic multi-key writes all-or-nothing on every peer."
    storage: "Per-region Azure Table WAL and clustering, plus shared Azure Blob backup sink."
    sources:
      - "README.md"
      - "PACKAGES.md"
      - "reference-architecture.md"
      - "reference-architecture/README.md"
  - id: local
    silos: "One local silo or containerized local cluster."
    regions: "One local region."
    packages:
      - "Orleans.Lattice"
      - "Orleans.Lattice.Storage.File"
      - "Orleans.Lattice.Api.Mcp"
      - "Orleans.Lattice.Explorer.Web"
    trees: "Application trees created by the host; in-memory WAL is the default when durable WAL is not registered."
    replication_mode: "None documented for the local stage."
    storage: "File WAL for durable local deployment, or in-memory WAL when durability is not required."
    sources:
      - "README.md"
      - "PACKAGES.md"
      - "docs/lattice.storage.file/README.md"
  - id: private-active-active
    silos: "Same silo profile as the reference architecture, with internal-only Container Apps ingress."
    regions: "Multiple peered regions with customer-managed private DNS."
    packages:
      - "Orleans.Lattice"
      - "Orleans.Lattice.Replication"
      - "Orleans.Lattice.Replication.Grpc"
      - "Orleans.Lattice.Storage.AzureTable"
      - "Orleans.Lattice.Backup.AzureBlob"
      - "Orleans.Lattice.Api.Mcp"
    trees: "Replicated trees named by deployment configuration and runtime replication control."
    replication_mode: "Active-active replication over private address space, still authenticated by the per-cluster replication key."
    storage: "Azure Table WAL and clustering; Azure Blob backup sink remains a shared source of truth."
    sources:
      - "reference-architecture.md"
      - "reference-architecture/README.md"
  - id: team
    silos: "Shared Orleans cluster with real users."
    regions: "One region unless global replication is added."
    packages:
      - "Orleans.Lattice"
      - "Orleans.Lattice.Auth"
      - "Orleans.Lattice.Membership"
      - "Orleans.Lattice.Membership.Oidc"
      - "Orleans.Lattice.Membership.Entra"
      - "Orleans.Lattice.Schema"
      - "Orleans.Lattice.Tenancy"
    trees: "Application trees plus policy, schema, membership, and tenant system trees owned by the enabled packages."
    replication_mode: "None documented for the team stage."
    storage: "Durable storage selected by host configuration."
    sources:
      - "README.md"
      - "PACKAGES.md"
