      - name: "RetryMaxAttempts"
        type: "int?"
        default: "null"
        source: "src/lattice.storage.azuretable/AzureTableWalStorageOptions.cs#AzureTableWalStorageOptions.RetryMaxAttempts"
      - name: "RetryDelay"
        type: "TimeSpan?"
        default: "null"
