<svg xmlns="http://www.w3.org/2000/svg" width="820" height="510" viewBox="0 0 820 510" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Point and batched writes: sustained throughput vs silo count</title>
<desc id="d">Point and batched writes: sustained throughput vs silo count. Line chart over 1, 2, 4, 6, 8 silos. Series: SetAsync (point write); SetAsync (point write + async materialised view); SetManyAsync (4,096 keys/call). The exact values are in the grid below.</desc>
