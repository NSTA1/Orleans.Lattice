<text class="y-tick" x="66" y="58" font-size="12" fill="#424a53" text-anchor="end" dominant-baseline="middle">25</text>
<line x1="74" y1="58" x2="74" y2="388" stroke="#eef1f4" stroke-width="1"/>
<text class="x-tick" x="74" y="406" font-size="12" fill="#424a53" text-anchor="middle">1</text>
