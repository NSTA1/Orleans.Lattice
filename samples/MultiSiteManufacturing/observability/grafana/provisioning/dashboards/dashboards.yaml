# Grafana dashboard provisioning for the MultiSiteManufacturing sample.
# Picks up the JSON dashboards bind-mounted from
# src/lattice.dashboards/Grafana/ at /var/lib/grafana/dashboards/orleans-lattice
# (see docker-compose.yml).

apiVersion: 1

providers:
  - name: orleans-lattice
    orgId: 1
    folder: Orleans.Lattice
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/orleans-lattice
      foldersFromFilesStructure: false
