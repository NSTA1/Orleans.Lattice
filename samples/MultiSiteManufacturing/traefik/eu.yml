# Traefik dynamic config for the EU cluster (file provider).
# See traefik/us.yml for rationale and router-split explanation.
http:
  routers:
    eu-replicate:
      # gRPC service name: orleans.lattice.replication.LatticeReplication
      rule: "PathPrefix(`/orleans.lattice.replication.`)"

      priority: 200
      entryPoints:
        - web
      service: eu-replicate

    eu-state:
      # gRPC service name: orleans.lattice.api.state (full method paths
      # are /orleans.lattice.api.state/<Method>). Read-only state API
      # browsed by the Orleans.Lattice.Explorer (issue #886). Trailing
      # slash anchors the prefix; priority 200 keeps it ahead of the /
      # catch-all, mirroring eu-replicate.
      rule: "PathPrefix(`/orleans.lattice.api.state/`)"

      priority: 200
      entryPoints:
        - web
      service: eu-state

    eu-web:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: eu-web

  services:
    eu-replicate:
      loadBalancer:
        # Round-robin, no sticky cookie: replication pushes are
        # stateless and either silo can apply a batch. h2c upstream
        # because gRPC requires HTTP/2 end-to-end. Port 8081 is a
        # dedicated h2c listener (Program.cs ConfigureKestrel) since
        # plaintext Kestrel cannot multiplex HTTP/1.1 + HTTP/2 on the
        # same port.
        servers:
          - url: "h2c://silo-eu-a:8081"
          - url: "h2c://silo-eu-b:8081"

    eu-state:
      loadBalancer:
        # No sticky cookie: state-API reads are stateless, cluster-wide
        # aggregates either silo can serve, so round-robin spreads
        # explorer load. h2c upstream to the same dedicated :8081 gRPC
        # listener eu-replicate uses. Active health check on the silo's
        # :8080 HTTP port (issue #1006) evicts a stopped silo within ~2s
        # so the explorer fails over instead of flickering; the gRPC port
        # itself has no clean 200 to probe, hence targeting :8080.
        # scheme: http is required so the probe does not inherit the h2c
        # server scheme (which fails against the plain HTTP :8080 port).
        servers:
          - url: "h2c://silo-eu-a:8081"
          - url: "h2c://silo-eu-b:8081"
        healthCheck:
          path: "/"
          scheme: http
          port: 8080
          interval: "5s"
          # Generous timeout (issue #1030): a live silo busy serving a
          # write burst can answer the :8080 probe slowly; a 1s timeout
          # evicted both live silos and 503-ed the state route.
          timeout: "4s"

    eu-web:
      loadBalancer:
        sticky:
          cookie:
            name: msmfg_eu_affinity
            httpOnly: true
            sameSite: lax
        servers:
          - url: "http://silo-eu-a:8080"
          - url: "http://silo-eu-b:8080"
        healthCheck:
          path: "/"
          interval: "5s"
          # Generous timeout (issue #1030): a live silo under a write
          # burst can answer the probe slowly; a 1s timeout would evict a
          # live silo and tear down its Blazor circuits under load.
          timeout: "4s"
