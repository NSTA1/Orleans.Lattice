# Traefik dynamic config for the US cluster (file provider).
#
# We use the file provider instead of the docker provider because the
# docker provider requires a working unix socket mount into the Traefik
# container, which fails on Docker Desktop Windows with "Error response
# from daemon" on every label lookup - leaving Traefik with zero
# discovered routers and returning 404 for every request. The file
# provider has no such dependency and the silo container names resolve
# over the shared us-net bridge network.
#
# Two routers share the same backend pool but with different LB
# strategies:
#   - us-replicate     PathPrefix(`/orleans.lattice.replication.`)
#                      Round-robin, no sticky cookie. Priority 200 so
#                      it wins decisively against the / catch-all.
#                      Reached by the peer cluster's silos opening the
#                      package's gRPC push transport stream. Upstream
#                      uses h2c (HTTP/2 cleartext) because gRPC
#                      requires HTTP/2 end-to-end and the silo Kestrel
#                      endpoint is configured for h2c.
#   - us-state         PathPrefix(`/orleans.lattice.api.state/`)
#                      Round-robin, no sticky cookie. Priority 200.
#                      Reached by the Orleans.Lattice.Explorer browsing
#                      the read-only state API (issue #886). Same h2c
#                      backend pool on :8081 as us-replicate; reads are
#                      stateless cluster-wide aggregates so any silo
#                      serves them and no affinity is needed. The
#                      trailing slash anchors the prefix so it cannot
#                      collide with a Blazor route.
#   - us-web           /             sticky cookie. Blazor Server's
#                      SignalR circuit pins to one silo per browser tab.
http:
  routers:
    us-replicate:
      # gRPC service name: orleans.lattice.replication.LatticeReplication
      # The trailing dot anchors the prefix so it cannot accidentally
      # match a Blazor route that happens to start with the same
      # characters. priority: 200 keeps it ahead of any future router.
      rule: "PathPrefix(`/orleans.lattice.replication.`)"

      priority: 200
      entryPoints:
        - web
      service: us-replicate

    us-state:
      # gRPC service name: orleans.lattice.api.state (full method paths
      # are /orleans.lattice.api.state/<Method>). The trailing slash
      # anchors the prefix so it cannot collide with a Blazor route.
      # priority: 200 keeps it ahead of the / catch-all, exactly like
      # us-replicate.
      rule: "PathPrefix(`/orleans.lattice.api.state/`)"

      priority: 200
      entryPoints:
        - web
      service: us-state

    us-backup:
      # gRPC service name: orleans.lattice.api.backup (full method paths
      # are /orleans.lattice.api.backup/<Method>). Backup control API the
      # Orleans.Lattice.Explorer backup UI drives (issue #1131), wired
      # only when the stack is started with run.ps1 -Backup. Without this
      # router the backup service path falls through to the / catch-all
      # (Blazor), which 404s the gRPC call and greys out the Backups tab.
      # The trailing slash anchors the prefix; priority 200 keeps it
      # ahead of the / catch-all, exactly like us-state.
      rule: "PathPrefix(`/orleans.lattice.api.backup/`)"

      priority: 200
      entryPoints:
        - web
      service: us-backup

    us-web:
      rule: "PathPrefix(`/`)"

      entryPoints:
        - web
      service: us-web

  services:
    us-replicate:
      loadBalancer:
        # No sticky cookie: replication pushes are stateless and both
        # silos share the same Azure Table Storage and lattice trees,
        # so any silo can apply an inbound batch. Round-robin + active
        # health check gives automatic per-silo failover within ~2s.
        # `h2c://` upstream tells Traefik to speak HTTP/2 cleartext to
        # the silo - required for gRPC. Port 8081 is a dedicated h2c
        # listener (Program.cs ConfigureKestrel) since plaintext Kestrel
        # cannot multiplex HTTP/1.1 + HTTP/2 on the same port.
        servers:
          - url: "h2c://silo-us-a:8081"
          - url: "h2c://silo-us-b:8081"
        # No health check: an HTTP/2 GET to the gRPC port returns 405 or
        # routes through Blazor (which 404s on unknown paths) - both
        # would mark the upstream "down" and stall replication. Traefik
        # without a health check just round-robins and the gRPC client
        # observes failures itself, with retry + backoff in the package.

    us-state:
      loadBalancer:
        # No sticky cookie: state-API reads are stateless, cluster-wide
        # aggregates sourced from data both silos share, so any silo
        # serves any read. Round-robin spreads explorer load across the
        # two silos. `h2c://` upstream speaks HTTP/2 cleartext to the
        # silo's dedicated :8081 gRPC listener - the same backend pool
        # us-replicate uses. Unlike us-replicate, this pool DOES carry an
        # active health check (issue #1006): the explorer's gRPC client
        # does not aggressively re-pick a dead backend, so without
        # eviction a stopped silo stays in round-robin rotation and ~half
        # of explorer calls fail, flickering the connection between
        # connected and reconnecting. The probe targets the silo's :8080
        # HTTP port (200 on /) rather than the gRPC :8081 port, so a
        # dead silo is evicted within ~2s and reads ride through on the
        # survivor. scheme: http is REQUIRED: the servers are h2c, which
        # Traefik would otherwise inherit for the probe and fail against
        # the plain HTTP/1.1 :8080 listener, evicting BOTH silos and 503-ing
        # the whole route.
        servers:
          - url: "h2c://silo-us-a:8081"
          - url: "h2c://silo-us-b:8081"
        healthCheck:
          path: "/"
          scheme: http
          port: 8080
          interval: "5s"
          # Generous timeout (issue #1030): under a write burst the silo's
          # :8080 listener can take well over a second to answer the probe
          # while still being perfectly alive. A 1s timeout evicted BOTH
          # live silos and 503-ed the state route, dropping the explorer
          # connection. 4s gives a loaded-but-live silo room to answer
          # before eviction, while a genuinely dead silo is still removed
          # within ~5s and reads ride through on the survivor.
          timeout: "4s"

    us-backup:
      loadBalancer:
        # No sticky cookie: the backup control API routes to grains that
        # Orleans places cluster-wide, so either silo entrypoint serves
        # any call and round-robin spreads load. Same dedicated :8081 h2c
        # gRPC listener and :8080 HTTP health probe as us-state, so a
        # stopped silo is evicted within ~2s and the backup UI fails over
        # instead of flickering.
        servers:
          - url: "h2c://silo-us-a:8081"
          - url: "h2c://silo-us-b:8081"
        healthCheck:
          path: "/"
          scheme: http
          port: 8080
          interval: "5s"
          timeout: "4s"

    us-web:
      loadBalancer:
        # Both US silos behind one sticky cookie. Blazor Server's
        # SignalR circuit MUST pin to a single silo for the lifetime of
        # the browser tab, or the reconnect handshake lands on the wrong
        # silo and the circuit is torn down.
        sticky:
          cookie:
            name: msmfg_us_affinity
            httpOnly: true
            sameSite: lax
        servers:
          - url: "http://silo-us-a:8080"
          - url: "http://silo-us-b:8080"
        # Active health check: evict a silo from rotation if it errors
        # out, re-probe frequently so a restarted silo rejoins quickly
        # and a silently-dead silo is taken out of sticky rotation
        # within a few seconds. The timeout is generous (issue #1030): a
        # silo busy serving a write burst can answer the probe slowly
        # while still being alive, and a 1s timeout would evict a live
        # silo and tear down its Blazor circuits under load.
        healthCheck:
          path: "/"
          interval: "5s"
          timeout: "4s"
