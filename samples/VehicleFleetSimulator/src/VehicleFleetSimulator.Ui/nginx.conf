# Nginx config for the Blazor WebAssembly SPA.
# - SPA fallback so deep-link navigations resolve to index.html.
# - Long-cache the fingerprinted _framework assets; never cache index.html
#   (it's the entry point that pins the framework manifest hash).
# - Ensure .wasm/.dll/.dat are served with their canonical content-types so
#   the browser streams them efficiently.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # IMPORTANT: keep the stock mime.types map (text/html, application/javascript, …) and
    # only *add* the Blazor-specific entries on top. Re-declaring `types { ... }` from
    # scratch silently drops every default mapping and turns the whole site into
    # application/octet-stream downloads — which is exactly what happens to index.html
    # if you remove this include.
    include /etc/nginx/mime.types;
    types {
        application/wasm                wasm;
        application/octet-stream        dll dat;
    }
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # Blazor WASM cookie-less requests for appsettings should never be cached;
    # the env-specific overrides are tiny and we want config changes to win.
    location = /appsettings.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}
