# RepoContext MCP container - "codebase memory in a box" (issue #1435).
#
# Brings up the restart-durable MCP host alongside its ONNX Runtime embedding
# companion. The host runs the default `local` durability profile (SQLite grain
# storage + reminders and the file WAL, all under the /data named volume), so
# ingested context survives `docker compose restart` and `docker compose down`
# (without `-v`). See README.md for the start -> bootstrap -> recall -> restart
# -> verify walkthrough.
#
# Build context is the repository root for the host image (it ProjectReferences
# the just-built src/ bits); the embedder builds from its own app directory. Run
# from this directory.

services:
  # The embedding companion stays a SEPARATE container so the MCP host keeps its
  # single-listener surface. Its baked HEALTHCHECK gates the host's startup.
  #
  # This is the ONNX Runtime companion (apps/embedding-onnx). It serves the same
  # HTTP contract on the same port as the Onyx companion it replaced, and emits
  # numerically identical vectors, so it is a drop-in: no host configuration
  # changes and no re-indexing of an existing volume. To go back to the Onyx
  # companion, layer docker-compose.onyx.yml over this file.
  #
  # NVIDIA: the default `cpu` flavour has NO GPU support compiled in, so running
  # it on a GPU host changes nothing. Enabling the GPU takes all three of the
  # edits below - the build arg selects a different ONNX Runtime package, the env
  # var selects the accelerator at runtime, and the reservation is what actually
  # exposes the device to the container:
  #
  #   build:
  #     args:
  #       ONNX_FLAVOR: cuda          # (1) build the CUDA-capable image
  #   environment:
  #     EMBED_PROVIDER: cuda         # (2) bind the CUDA execution provider
  #   deploy:                        # (3) hand the GPU to the container
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #
  # Rebuild after changing the build arg (`docker compose build embedder`); a
  # plain `up -d` reuses the cached cpu image. The cuda flavour still includes the
  # CPU provider, so that one image also serves CPU hosts, and an unrecognised
  # EMBED_PROVIDER falls back to the CPU instead of failing to boot. Confirm what
  # actually bound with `curl localhost:9000/api/health` inside the network - it
  # reports the live provider, so a silent CPU fallback is visible.
  embedder:
    build:
      context: ../../apps/embedding-onnx
      dockerfile: Dockerfile
      args:
        # cpu (default) or cuda. The cuda flavour also serves CPU hosts, so one
        # image covers both and EMBED_PROVIDER alone selects the accelerator.
        ONNX_FLAVOR: cpu
    environment:
      # cpu, or cuda on an NVIDIA host started with a device reservation.
      # An unknown value falls back to the CPU rather than failing to boot.
      EMBED_PROVIDER: cpu
      # EMBED_INTRA_THREADS is deliberately NOT set here, and deliberately not
      # given a placeholder value either, for the same reason
      # LATTICE_WAL_MAX_CONCURRENT_REPLAYS is left unset below: the correct value
      # is a property of YOUR CPU grant, and copying a literal out of somebody
      # else's deployment is precisely the failure the setting exists to prevent.
      #
      # WHAT IT IS. It sizes the ONNX Runtime intra-op thread pool - the threads
      # that parallelise a single inference. Left unset, this server derives it
      # from the container's ENFORCED cgroup CPU quota, which is the right answer
      # in every case we have measured. You only need to declare it if you want
      # to depart from that.
      #
      # WHY IT IS DERIVED FROM THE QUOTA AND NOT FROM THE CORE COUNT. ONNX
      # Runtime's own default sizes the pool from the HOST core count and does
      # not consult the cgroup quota. Under any CPU limit that oversubscribes by
      # the ratio between the two, and the cost is not proportional - it is far
      # worse. Measured on a 4.0-CPU grant on a 16-core host (issue #2606): a
      # pool of 16, the kernel throttling 296 of 298 consecutive scheduling
      # periods, and 346.3 CPU-seconds stalled against 118.8 running. The
      # arithmetic is elementary once stated: 16 threads drain a 400ms quota in
      # 25ms and are then frozen for the remaining 75ms, so 75:25 = 3.0 stalled
      # per unit run, against 2.91 measured. Because ONNX Runtime synchronises
      # intra-op threads at EVERY operator boundary and a transformer crosses
      # hundreds per inference, a freeze landing mid-barrier stalls the whole
      # operator rather than one thread, so throughput degrades super-linearly.
      #
      # WHY DOTNET_PROCESSOR_COUNT CANNOT BE REUSED FOR THIS. It is set on the
      # repocontext service below, where it sizes an unrelated WAL replay gate.
      # It OVERRIDES Environment.ProcessorCount and wins over the quota, so
      # copying that service's environment block onto this one - an entirely
      # ordinary thing to do - would silently restore the oversubscription. This
      # server reads the quota directly and is immune to it, and logs a warning
      # naming both figures when the two disagree.
      #
      # HOW TO DERIVE IT IF YOU DO SET IT. Use the container's actual CPU grant,
      # rounded UP: `cpus: "4.5"` -> 5. Not the host core count, and not
      # DOTNET_PROCESSOR_COUNT. IF YOU LATER CHANGE THE GRANT BELOW, A DECLARED
      # VALUE DOES NOT FOLLOW IT - that is the whole hazard of pinning one, and
      # is why leaving it unset is the recommended configuration. The startup log
      # reports the resolved count and whether it was DECLARED or DERIVED, so
      # check there rather than inferring it from this file.
    expose:
      - "9000"
    # Run PID 1 as an init process (issue #2576). Docker bind-mounts its own
    # static `docker-init` binary and runs it as PID 1, so this works unchanged
    # on the distroless, shell-less runtime image - nothing has to be baked in.
    #
    # This is a SEPARATE defect from the stop_grace_period below, and neither
    # substitutes for the other: the grace period governs how long the drain is
    # given, while init governs whether PID 1 behaves like a process supervisor
    # at all. Without it the server itself is PID 1, which reaps no orphaned
    # children and is subject to the kernel's rule that PID 1 takes no default
    # action for a signal it has installed no handler for.
    init: true
    # The embedder holds NO durable state: its weights are baked into an image
    # layer and the base file mounts it no volume, so there is nothing to flush
    # and Docker's 10s default would in fact be adequate here. It is set
    # explicitly anyway, and deliberately short, so that the value is a decision
    # on the record rather than an omission. The repocontext service below was
    # left to the same default for years while its documentation promised a
    # "generous shutdown budget" (issue #2389); the cost of that was not the
    # default itself but that nothing distinguished "10s is enough here" from
    # "nobody considered it". A reader of this file can now tell the two apart.
    stop_grace_period: 30s
    # Survive a daemon/host restart like the repocontext service does. Without
    # this the embedder's default `no` policy leaves it stopped after a Docker
    # daemon restart while repocontext (unless-stopped) comes back on its own,
    # degrading search to keyword mode until the embedder is started by hand.
    restart: unless-stopped
    # Cap container log growth: the default json-file driver is otherwise
    # unbounded. Rotate at 20 MiB x 5 files (100 MiB ceiling per container).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The RepoContext MCP host: its ONLY application listener is the MCP endpoint on
  # 8080 (plus the HTTP health probes and the /metrics scrape endpoint). No gRPC
  # facade, no Explorer UI.
  repocontext:
    build:
      context: ../..
      dockerfile: apps/repocontext/Dockerfile
    depends_on:
      embedder:
        condition: service_healthy
    environment:
      # Default local, durable, zero-external-dependency profile.
      LATTICE_DURABILITY: local
      # All durable local state lives here (a named volume): the file WAL
      # directory and the SQLite database file.
      LATTICE_DATA_ROOT: /data
      LATTICE_MCP_PORT: "8080"
      # WAL materialiser pin buckets: how many persisted slots the retention-floor
      # pin state is split across, so an advancing floor rewrites a fraction of the
      # blob instead of all of it. The library default is 1 (the legacy write path,
      # kept so upgrading an existing deployment changes nothing); this box opts in
      # because its measured pin blobs reached ~1.4 MB rewritten tens of thousands
      # of times. Widening self-migrates on activation and the legacy slot is
      # retained, so setting this back to "1" and restarting is a safe rollback
      # that over-retains WAL rather than over-trimming it.
      LATTICE_WAL_PIN_BUCKETS: "8"
      # Per-silo ceiling on concurrent activation-time leaf WAL replays. Left
      # UNSET here deliberately, so this sample behaves identically on every
      # host: unset defers to the library, which sizes the gate from
      # Environment.ProcessorCount.
      #
      # Set it when this container runs under a CPU limit (issue #2279).
      # Environment.ProcessorCount is cgroup-aware only while
      # DOTNET_PROCESSOR_COUNT does not override it, and an override wins
      # silently - so a box granted 6 CPUs whose environment says 16 sizes this
      # gate to 16 and oversubscribes a CPU-bound path 2.67x. Each permit admits
      # one whole-readable-window WAL replay, which is exactly the expensive path
      # a reactivation storm multiplies.
      #
      #   LATTICE_WAL_MAX_CONCURRENT_REPLAYS: "<this container's CPU limit>"
      #
      # The placeholder is deliberate: copying a literal from someone else's
      # deployment is the failure this setting exists to prevent, so there is no
      # number here to copy. An unparseable value is refused at startup with a
      # message naming the variable, which is the safe way to get it wrong.
      #
      # Set it TOGETHER WITH the CPU limit it is derived from, in the same file,
      # and keep the two adjacent. A ceiling pinned somewhere the quota is not
      # declared is a second claim about that quota which nothing can check - the
      # hazard that produced #2279 to begin with, relocated rather than removed.
      # Verify what actually bound: the silo logs the resolved ceiling once at
      # startup, alongside the configured option and Environment.ProcessorCount,
      # so a value that was ignored is visible rather than merely assumed.
      # MEMORY. This box needs FAR more than a default Docker VM allocation, and
      # under-provisioning it fails in a way that does not look like memory
      # (issue #2364). Measured on a ~8000-file index: steady-state working set
      # settled at about 10.2 GiB, so budget at least 12 GiB for the host
      # container. A single-variable run - same image, same volume, same corpus,
      # only the limit differing - produced 756 OutOfMemoryException and 528
      # failed grain activations at 4 GiB, and zero of each at 12 GiB.
      #
      # No memory limit is declared here on purpose, for the same reason as the
      # CPU ceiling above: the right number is a property of your corpus, not of
      # this file. Measure yours rather than copying 12.
      #
      # The failure mode is why this is worth stating. A cgroup limit becomes the
      # .NET GC heap HARD limit, so the process is not OOM-killed: there is no
      # restart, no exit code and no resource event. Instead the allocation for a
      # leaf-snapshot deserialisation fails, the snapshot read fails, and the leaf
      # activates COLD and replays its whole WAL window - which raises pressure
      # further. What an operator sees is a STORAGE error, so the box looks slow
      # and flaky rather than short of memory. Watch
      # orleans.lattice.leaf.snapshot.load_failures with reason=resource_exhausted
      # to name it directly.
      # GARBAGE COLLECTION. Follows directly from the memory note above, because
      # the hazard is the PAIR (issue #2596): .NET defaults to Workstation GC,
      # which collects a single heap with effectively single-threaded blocking
      # gen2 phases. That is the right default for a small heap and the wrong one
      # here. Once the heap is multi-GiB one collection walks all of it on one
      # thread with every other thread in the process suspended. A deployment of
      # this host at about 11 GiB resident had the runtime attribute a 252 second
      # pause to the collector, against a 30 second Orleans request timeout.
      #
      #   DOTNET_gcServer: "1"
      #   DOTNET_GCHeapCount: "<hex; see below>"
      #
      # Neither is set here, for the same reason as the two settings above: the
      # right heap count is a property of your CPU grant, not of this file.
      #
      # DOTNET_GCHeapCount is what makes the first line safe to set at all. Server
      # GC otherwise creates one heap per processor, and Environment.ProcessorCount
      # is what DOTNET_PROCESSOR_COUNT overrides - the same variable the replay
      # ceiling above discusses. That variable may legitimately be pinned ABOVE
      # this container's CPU grant to hold the replay gate's permits, and reusing
      # it as a heap count would then create one heap per phantom processor on a
      # heap already at its ceiling. One variable, two jobs, opposite
      # requirements. DOTNET_GCHeapCount separates them: derive it from the
      # container's actual CPU grant, independently of DOTNET_PROCESSOR_COUNT.
      #
      # WRITE THE HEAP COUNT IN HEXADECIMAL. The collector reads its numeric
      # ENVIRONMENT variables as hex, while the same settings in
      # runtimeconfig.json are decimal. So "10" asks for 16 heaps and "16" asks
      # for 22, silently and with no error. Values below 10 read the same either
      # way, which is what makes this so easy to miss on a small box and then get
      # wrong on a large one. Prefer an explicit 0x prefix.
      #
      # Verify rather than assume: this host reports GC.Mode, GC.HeapCount (the
      # figure the collector RESOLVED, not the one declared) and its memory
      # ceiling in the effective-configuration report at startup, and warns there
      # when the combination is the hazardous one. Check the resolved heap count
      # against what you wrote; a declaration that was misread or ignored is
      # visible in that line rather than only in a latency graph.
      #
      # The claim here is narrow on purpose. This removes the class of pause that
      # is multi-minute, process-wide, and attributed to the collector by the
      # runtime itself. It is NOT a general remedy for stalls: measurement of the
      # same container found collector pauses accounted for under a third of long
      # silences and did not explain the largest timeout burst at all. Pauses the
      # runtime does not attribute to the collector need their own diagnosis.
      # The read-only workspace root. Repositories are registered at runtime by
      # the client through the repocontext_add_repo tool, and every added path
      # must resolve under this root - a path escaping it (via `..` or a symlink)
      # is refused. Mount a broad parent at /workspace (below) and add individual
      # repositories beneath it on demand.
      LATTICE_WORKSPACE_ROOT: /workspace
      # Point the default embedding provider at the separate companion container.
      LATTICE_EMBEDDING_ENDPOINT: http://embedder:9000
      # Background-indexing cadence. A short self-index tick and a short reconcile
      # interval (with no jitter) make the periodic content reconcile effectively
      # continuous: the walk's directory-modification-time pruning keeps each
      # reconcile cheap, so edits and deletions are picked up within seconds. The
      # full-walk interval bounds how long an in-place content edit (which does not
      # bump a directory's modification time and is invisible to pruning) can go
      # unnoticed before a forced full sweep re-stats every file. Both periodic
      # deadlines below are declared in wall clock but counted in reconcile passes
      # (interval / (reconcile interval + jitter), rounded up, minimum one), so they
      # still hold when a pass takes longer than its own scheduled spacing - which
      # is the normal case on a large repository, and which silently defeated the
      # previous wall-clock deadlines. Here that is 24 passes to a full walk and
      # 60 to an embedding gap scan.
      LATTICE_SELFINDEX_TICK_SECONDS: "5"
      LATTICE_RECONCILE_INTERVAL_SECONDS: "5"
      LATTICE_RECONCILE_JITTER_SECONDS: "0"
      LATTICE_FULL_WALK_INTERVAL_SECONDS: "120"
      # How often a pass re-probes every unchanged file for a missing vector. The
      # probe is two membership reads per indexed source, so it dominates a pass on
      # a converged repository. Spacing it costs no healing latency: the self-index
      # grain's out-of-band paged sweep forces an immediate in-pass scan whenever it
      # actually finds a gap.
      LATTICE_EMBEDDING_GAP_SCAN_INTERVAL_SECONDS: "300"
      # The container's stop_grace_period, DECLARED to the process that has to fit
      # inside it. The host derives its own shutdown budget from this (issue #2402)
      # instead of holding a second, independent constant: 120s here yields the 90s
      # budget the container has always run with, and the remainder is reserve for
      # the host to unwind and report a cut-short drain before SIGKILL.
      #
      # It must EQUAL the stop_grace_period set on this same service below, and
      # RepoContextComposeShutdownBudgetTests asserts exactly that. The adjacency is
      # a convention, not an enforcement: the process cannot read the real grace
      # period from inside the container, so a value edited here but not below (or
      # vice versa) leaves the budget derived from a stale figure, and the dangerous
      # direction - declaring MORE than the container actually grants - is
      # undetectable at run time and reintroduces the silent kill of issue #2389.
      # Change the two together, always.
      LATTICE_REPOCONTEXT_STOP_GRACE_PERIOD: "120s"
    ports:
      # The MCP streamable-HTTP endpoint (and the health probes) on the host.
      #
      # The HOST side is overridable because 8080 is one of the most commonly
      # occupied ports on a developer machine, and a collision surfaces only as
      # an opaque bind failure at `up` time. Set REPOCONTEXT_PORT (in .env or the
      # environment) to publish elsewhere:
      #
      #   REPOCONTEXT_PORT=18080 docker compose up -d
      #
      # The CONTAINER side stays 8080 and must keep matching LATTICE_MCP_PORT
      # above - only the published port moves, so the health probes and the MCP
      # endpoint are then at http://localhost:$REPOCONTEXT_PORT. The default is
      # deliberately unchanged, so existing clients keep working untouched.
      - "${REPOCONTEXT_PORT:-8080}:8080"
    volumes:
      # Durable state survives restart / recreation / image upgrade.
      - repocontext-data:/data
      # The workspace the box can see, mounted READ-ONLY so the box can never
      # mutate the code it ingests. Mount a broad PARENT directory here and let
      # the client register individual repositories under it with
      # repocontext_add_repo. Override with REPO_PATH; defaults to this repo's
      # parent directory (so this repo is one registerable child, added at
      # /workspace/<repo>). Note ../../.. resolves this compose file's grandparent
      # (the repo root's parent), NOT the repo root itself.
      - ${REPO_PATH:-../../..}:/workspace:ro
    restart: unless-stopped
    # Run PID 1 as an init process (issue #2576). Docker bind-mounts its own
    # static `docker-init` binary in and runs it as PID 1, so this needs nothing
    # in the distroless, shell-less runtime image and changes no application
    # code: the host becomes a CHILD of PID 1 rather than PID 1 itself.
    #
    # Two things follow, and both were observed to matter during the epic #2368
    # gate runs, where a container reached a state in which neither
    # `docker kill` nor `docker rm -f` would reap PID 1 and it had to be
    # SIGKILLed - taking the run's time-to-ready measurement with it:
    #
    #   * ORPHAN REAPING. PID 1 inherits every orphaned descendant and must
    #     wait() on it. The .NET host installs no such reaper, so anything it
    #     orphans accumulates as a zombie for the life of the container.
    #   * SIGNAL SEMANTICS. The kernel applies NO default action to a signal
    #     delivered to PID 1 that PID 1 has installed no handler for. A process
    #     that is merely a well-behaved application when run as a child can
    #     therefore become unkillable-by-SIGTERM purely by being PID 1. tini
    #     always installs handlers and forwards, so signalling is never a
    #     property of the application's own handler registration.
    #
    # This is INDEPENDENT of stop_grace_period below. The grace period decides
    # how long the drain is allowed; init decides whether the SIGTERM that
    # starts the drain is honoured at all, and whether the container's process
    # table stays clean while it runs. Setting one and not the other leaves the
    # other half of the failure in place - which is exactly the state this file
    # was in when #2576 was raised, with a fully considered 120s grace period
    # sitting above a PID 1 that was not an init process.
    init: true
    # How long Docker waits between SIGTERM and SIGKILL. This MUST exceed the
    # host's own shutdown budget (RepoContextHostBuilder.ShutdownBudget, 90s) or
    # that budget is dead configuration: the host asks for 90s to deactivate the
    # silo and flush the WAL commit-log, and Docker's default grants 10s, so
    # every `docker compose stop` / `restart` / `down` is a crash teardown and
    # the graceful deactivation path never completes. That was issue #2389, and
    # it was invisible because a SIGKILLed container reports only an exit code
    # that the next start overwrites.
    #
    # 120s = the 90s the host is entitled to, plus 30s of headroom for process
    # exit after the last hosted service stops. Measured, not guessed - and the
    # measurements are the reason the bound to clear is the HOST budget rather
    # than any one corpus's drain time. A rig holding a 400-file synthetic index
    # spent 67.2s in Orleans' GrainDeactivation stage alone, and the same rig
    # earlier drained the same corpus in 33.9s before its vector trees had
    # landed. Drain time scales with resident state; the 90s ceiling does not.
    #
    # Note what that pair implies, because it is the trap this value has to
    # survive: a `stop_grace_period` tuned to an observed drain would have been
    # set to something like 45s after the first measurement and would then have
    # started killing teardowns as the index grew, reintroducing #2389 silently
    # and with a number that looked carefully chosen. Clearing the host budget is
    # what makes the value stable as the corpus grows.
    #
    # THIS IS NOW THE ONLY NUMBER TO CHANGE. The host derives its own budget from
    # the grant declared in LATTICE_REPOCONTEXT_STOP_GRACE_PERIOD above (issue
    # #2402), so raising the grace period raises the budget with it and a budget
    # above the grant is unrepresentable. Keep the two in step: they are two
    # halves of one statement, and the process cannot read this line.
    # RepoContextComposeShutdownBudgetTests asserts they are equal.
    #
    # The drain is observable rather than inferred. The host logs
    # "RepoContext drain complete in <n>s" once every hosted service has stopped,
    # so `docker logs` after a stop tells you the measured requirement directly;
    # if that line is ABSENT, the container was killed mid-drain and this value is
    # too small.
    stop_grace_period: 120s
    # Cap container log growth: the periodic self-index reconcile (every
    # LATTICE_RECONCILE_INTERVAL_SECONDS) logs continuously, so the default
    # unbounded json-file driver would grow without limit. Rotate at
    # 20 MiB x 5 files (100 MiB ceiling); older lines are dropped, not lost to disk.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  # Durable Lattice state (WAL + SQLite): the heart of "codebase memory in a box".
  repocontext-data:
