name: Coverage

# Coverage is measured on main only, once a night. The README coverage badge
# reads the default branch's coverage from Codecov, and Codecov only learns
# main's coverage from an upload made on a main commit, which a scheduled run on
# main is. This deliberately does NOT run on pull_request: the full non-chaos
# suite (every test/*.Tests.csproj, including the durable active-active and
# other Azurite integration tests) is expensive, and paying it on every PR would
# slow the PR feedback loop for no badge benefit. The change-scoped
# build-and-test job in ci.yml remains the PR gate.
#
# Why nightly rather than on every push. This lane builds the whole solution and
# runs every non-chaos suite under coverlet, the browser UI suite included, which
# takes about an hour - by far the most expensive workflow in the repository -
# and main takes merges faster than that. Run on every push with
# `cancel-in-progress: true`, most runs were cancelled part way (22 of the 35
# runs from #3327 to #3473), and GitHub rolls a cancelled check run up as a
# FAILURE, so main showed a red cross on most of its commits although nothing had
# failed. Queueing the runs instead removes the red but spends more, because the
# run already in flight always finishes. Replaying the 207 pushes to main from
# 4 to 24 September against today's hour-long run, every per-push design cost
# 8,900-10,000 runner-minutes; one run a night cost about 870, and it is the only
# design that stops this lane competing with pull-request CI for runners during
# the working day. The price is freshness: the badge is up to a day old, and a
# failure here narrows to a day's merges rather than to one. Coverage gates
# nothing and build-and-test tests every pull request before it merges, so that
# is the right trade. CiCoverageLaneScheduleTests holds this shape in place.
#
# The schedule alone is not enough. GitHub documents `schedule` as best-effort:
# an event can be delayed or dropped. Since the Actions incidents of 2026-08-26
# that has been the norm rather than the exception (see
# https://github.com/orgs/community/discussions/207346): the 03:17 slot below
# was created at 08:49 UTC on 25 September, 08:36 UTC on 26 September and
# 09:16 UTC on 27 September, 5h19m-5h59m late, with `created_at` equal to
# `run_started_at` to the second - the event itself was late, not a runner -
# and GitHub may drop one outright. `workflow_dispatch` is
# unaffected. So coverage-catch-up.yml checks on every push to main whether
# tonight's run exists and, once the slot is two hours past with none, dispatches
# this workflow with `catch_up: true`. Whichever of the schedule and the
# catch-up arrives first measures; the other skips (see the `measured` job).
on:
  schedule:
    # 03:17 UTC. The quietest hour on main - not one of those 207 pushes landed
    # between 03:00 and 04:00 UTC - and off the top of the hour, when GitHub
    # delays and can drop scheduled runs under load. GitHub also disables a
    # public repository's schedules after 60 days without activity.
    # The `slot` in the `measured` job and in coverage-catch-up.yml must match
    # this expression; CiCoverageLaneScheduleTests pins the three together.
    - cron: '17 3 * * *'
  # Manual trigger: re-run after a transient failure, measure a merge without
  # waiting for the night, or validate a change to this lane on a branch before
  # merging it - otherwise the change would land on main unverified. A manual
  # dispatch always measures; only a catch-up dispatch is subject to the skip.
  workflow_dispatch:
    inputs:
      catch_up:
        description: 'Stand in for a missed nightly run: skip if tonight is already covered. Set by coverage-catch-up.yml.'
        type: boolean
        default: false

# Least-privilege: this workflow only reads source and uploads a coverage report.
# The `measured` job additionally reads this workflow's own run history.
permissions:
  contents: read

# One measurement at a time. A dispatch that arrives during the nightly run waits
# for it rather than cancelling it: nothing in this lane should cancel a run,
# because GitHub rolls a cancelled check run up as a failure on its commit.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A night with no merges would otherwise spend an hour re-measuring the commit
  # the previous night measured - main went eight days without a commit in the
  # period replayed above. So a scheduled run skips when its commit is the one the
  # last successful run measured. That is exact rather than a heuristic, because
  # the same commit measures the same coverage, and it fails open: another commit,
  # a failed last run, an API error or a manual dispatch all measure.
  #
  # A nightly run - the schedule, or a catch-up dispatch standing in for it -
  # also skips when an earlier run of this lane already exists since tonight's
  # slot opened, so a late schedule arriving after the catch-up does not measure
  # the night twice. "Earlier" is by run id, which GitHub assigns in creation
  # order, so of any set of nightly runs the first always measures and the skip
  # can never fire on all of them. A failed earlier run counts - retrying it
  # would spend another hour on the same failure, which is already red - and a
  # cancelled one does not.
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To read this workflow's last successful run, which is all this job reads.
      actions: read
    outputs:
      measure: ${{ steps.head.outputs.measure }}
    steps:
      - name: Skip a commit already measured, or a night already covered
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          CATCH_UP: ${{ inputs.catch_up }}
        run: |
          set -uo pipefail
          # GITHUB_WORKFLOW_REF is <owner>/<repo>/.github/workflows/<file>@<ref>.
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          last="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
            -f branch="${GITHUB_REF_NAME}" -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // ""')" || last=""

          nightly=false
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$CATCH_UP" = true ]; then
            nightly=true
          fi

          # Tonight's slot: the most recent 03:17 UTC, matching the cron above.
          slot="03:17"
          now="$(date -u +%s)"
          opened="$(date -u -d "$(date -u +%F) ${slot}" +%s)"
          if [ "$now" -lt "$opened" ]; then
            opened=$((opened - 86400))
          fi
          since="$(date -u -d "@${opened}" +%Y-%m-%dT%H:%M:%SZ)"
          earlier="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
            -f branch="${GITHUB_REF_NAME}" -f created=">=${since}" -f per_page=100 \
            --jq "[.workflow_runs[] | select(.id < ${GITHUB_RUN_ID} and .conclusion != \"cancelled\")] | length")" || earlier=0
          case "$earlier" in ''|*[!0-9]*) earlier=0 ;; esac

          if [ "$nightly" = true ] && [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "::notice title=Coverage already measured::${GITHUB_SHA} is the commit the last successful run measured, so this run skips the measurement."
            echo "measure=false" >> "$GITHUB_OUTPUT"
          elif [ "$nightly" = true ] && [ "$earlier" -gt 0 ]; then
            echo "::notice title=Night already covered::An earlier run of this lane started since the ${since} slot, so this run skips the measurement."
            echo "measure=false" >> "$GITHUB_OUTPUT"
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

  coverage:
    needs: measured
    # Measure unless the check positively found this commit already measured. Only
    # an explicit 'false' skips, so a missing verdict measures, and `!cancelled()`
    # keeps a failed check job from blocking the measurement (it still turns the
    # run red, so the failure is not hidden).
    if: ${{ !cancelled() && needs.measured.outputs.measure != 'false' }}
    runs-on: ubuntu-latest
    # A backstop, not a budget: without it one hung run would hold the lane - and
    # any dispatch waiting behind it - for GitHub's six-hour default. The suites
    # carry their own ten-minute hang dumps below; this is about twice the longest
    # recent run (69 minutes).
    timeout-minutes: 150

    # Azurite supplies the local Azure Storage blob/queue/table endpoints that the
    # AzureStorageEmulator-category integration tests drive via
    # `UseDevelopmentStorage=true`, so their code paths are counted in coverage
    # rather than self-skipping. Mirrors the build-and-test job in ci.yml.
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Orleans.Lattice.slnx

      - name: Build
        run: dotnet build Orleans.Lattice.slnx --no-restore --configuration Release

      # The browser UI suite runs in this job too, so its code paths are counted
      # rather than self-skipping. It hosts the Explorer in-process on Kestrel,
      # so coverlet instruments the same process that serves the app and the
      # server-side render path is genuinely covered - not just the test code.
      # Browsers are cached on the project file, which is where the pinned
      # Microsoft.Playwright version lives.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('test/lattice.explorer.uitests/**/*.csproj') }}

      # Chromium, Firefox and WebKit: the suite's apps shard runs the frame isolation
      # tests in all three engines, as ui-tests.yml does.
      - name: Install Playwright browsers
        run: |
          set -euo pipefail
          script="$(find test/lattice.explorer.uitests/bin/Release -name playwright.ps1 -print -quit 2>/dev/null || true)"
          if [ -z "$script" ]; then
            echo "::error::playwright.ps1 not found - the UI test project did not build, so its coverage would be silently missing."
            exit 1
          fi
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            pwsh "$script" install-deps chromium firefox webkit
          else
            pwsh "$script" install chromium firefox webkit --with-deps
          fi

      - name: Wait for Azurite
        run: |
          for port in 10000 10001 10002; do
            for i in $(seq 1 30); do
              if (echo > "/dev/tcp/127.0.0.1/${port}") 2>/dev/null; then
                echo "Azurite port ${port} ready"; break
              fi
              if [ "$i" -eq 30 ]; then echo "::error::Azurite port ${port} not ready after 30s"; exit 1; fi
              sleep 1
            done
          done

      # The TLA+ toolchain for the `Tlc` category in test/lattice, which runs
      # TLC over every module under spec/ and over a mutant generated from each
      # definition in its mutations/ directory. See spec/README.md and issue #2323.
      #
      # This lane runs every non-chaos suite with the filter
      # `TestCategory!=Chaos&TestCategory!=Coyote`, which does NOT exclude
      # `Tlc`, and TlcModelCheckTests FAILS (never skips) when the toolchain is
      # absent under GITHUB_ACTIONS - deliberately, so a missing tool cannot
      # report a green model-checking gate that checked no model. Without these
      # two steps the whole Orleans.Lattice.Tests project failed here and its
      # coverage went missing. Mirrors the steps in ci.yml; the version and the
      # digest are pinned identically and `CiTlaToolchainProvisioningTests`
      # fails if any lane drifts from the others.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p tools
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output tools/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          # Pinned by digest, not merely by tag. A release asset can be replaced
          # in place, and an unverified jar on the classpath of a verification
          # gate is the one dependency where a silent substitution would be
          # least visible.
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tools/tla2tools.jar" \
            | sha256sum --check --strict

      - name: Test with coverage
        # The upload step reads this step's `complete` output; see below.
        id: test
        # The digest-settle integration oracles need a wider convergence budget
        # on a loaded runner; see the equivalent step in ci.yml for the rationale.
        env:
          LATTICE_DIGEST_SETTLE_TIMEOUT_MS: '60000'
        run: |
          set -uo pipefail
          # Exclude the benchmark/throughput test projects: microbench runs
          # BenchmarkDotNet harnesses (not library coverage) and
          # azure-throughput-silo is not part of Orleans.Lattice.slnx, so it is
          # not built by the step above. The standalone lattice.integration
          # project is intentionally included here.
          #
          # The pattern is '*Tests.csproj', not '*.Tests.csproj'. The browser UI
          # project is Orleans.Lattice.Explorer.UiTests.csproj, whose suffix is
          # '.UiTests.csproj' - it has no literal dot before 'Tests', so the
          # stricter glob silently skipped it and its coverage would have gone
          # missing without anything failing. Widening costs nothing: every
          # existing project matches either way.
          mapfile -t testProjs < <(find test -type f -name '*Tests.csproj' \
            -not -path '*/microbench/*' \
            -not -path '*/azure-throughput-silo/*' | sort)
          # Run every project even when one fails, then fail the step at the end.
          #
          # This loop used to run under `set -e`, so the first failing project
          # aborted the whole step: every later project went unmeasured and the
          # Codecov upload was skipped entirely, leaving the badge frozen on the
          # last good commit. One flaky suite therefore discarded the coverage of
          # all forty-odd others, which is the opposite of what this lane is for.
          # Collecting failures and reporting them together keeps a green project's
          # coverage even when a sibling is broken, and still fails the run.
          failed=()
          flaky=()
          # Suites whose coverage report cannot be trusted. Distinct from `failed`:
          # a suite with a named failing test ran to completion, so its report is
          # whole and is still uploaded. A suite whose test host crashed or hung
          # was killed mid-run, and coverlet still writes a coverage.cobertura.xml
          # for it - but with the hit counts the dead process never flushed, so
          # the whole assembly under test reads as uncovered. Uploading that is
          # not "a bit stale", it is wrong: on 29 September a hang in
          # Orleans.Lattice.Tests uploaded the core library at near zero and
          # main's coverage fell from 93.5% to 78.7% with no code change.
          incomplete=()
          mkdir -p test-logs

          runSuite() {
            local proj="$1" name="$2" label="$3" filter="$4"
            # The console log is kept outside coverage/, the directory Codecov
            # uploads from, so it can never be mistaken for a report.
            local out="test-logs/${name}-${label}.log"
            local before after rc
            # Clear this suite's result file first, so that if the run dies without
            # producing one, the retry step finds nothing rather than reading a
            # stale file and retrying the wrong thing. A crashed or hung host is
            # exactly the case that must NOT be treated as a set of named failures.
            rm -f "coverage/${name}/${name}-${label}.trx"
            before="$(find "coverage/${name}" -name coverage.cobertura.xml 2>/dev/null | wc -l)"
            dotnet test "$proj" --no-build --configuration Release \
              --filter "$filter" \
              --collect:"XPlat Code Coverage" \
              --results-directory "coverage/${name}" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=${name}-${label}.trx" 2>&1 | tee "$out"
            rc=${PIPESTATUS[0]}
            after="$(find "coverage/${name}" -name coverage.cobertura.xml 2>/dev/null | wc -l)"

            # vstest reports a killed host as "The active test run was aborted",
            # "Test Run Aborted." and "The Test Run was aborted because the host
            # process exited unexpectedly"; a --blame-hang kill produces all three.
            if grep -qiE 'test run (was )?aborted|test host process crashed' "$out"; then
              echo "::error::${name} (${label}): the test host was aborted, so its coverage report is truncated. Coverage will not be uploaded for this run."
              incomplete+=("${name} (${label}): test host aborted")
            elif [ "$after" -le "$before" ]; then
              echo "::error::${name} (${label}) produced no coverage report. Coverage will not be uploaded for this run."
              incomplete+=("${name} (${label}): no coverage report")
            fi
            return "$rc"
          }

          # Retry exactly the tests that failed, once. Returns 0 when the retry
          # cleared them, non-zero when it did not or could not be attempted.
          #
          # Why this lane retries and the PR gate does not.
          #
          # This is the metrics lane: it exists to keep main's coverage report and
          # the README badge current, and `build-and-test` in ci.yml remains the
          # required correctness gate, running the same tests with no retries and
          # no instrumentation. What makes THIS lane different is that it runs the
          # whole suite under coverlet on a shared runner, which is materially
          # slower, and that is enough to push time-sensitive machinery past
          # internal deadlines it clears comfortably everywhere else - an Orleans
          # reminder service that "is still initializing and it is taking a long
          # time", a Blazor circuit, a browser relayout. Those failures say
          # something about the runner, not about the commit, and there are forty-odd
          # projects any of which can produce one.
          #
          # A whole-project rerun would be the blunt version of this and is worse on
          # both counts: it gives every OTHER test in that project a fresh chance to
          # flake, and it cannot tell which test was unstable. Retrying only the
          # named failures keeps the signal - two failures of the same test is a real
          # failure and still fails the run.
          #
          # The retry never silences anything: a test that only passes on the second
          # attempt is reported as flaky, in the log, as a warning annotation, and in
          # the job summary. Green-but-flaky is a visible state, not a hidden one.
          retryFailed() {
            local proj="$1" name="$2" label="$3"
            local trx="coverage/${name}/${name}-${label}.trx"

            if [ ! -f "$trx" ]; then
              echo "::notice::No trx at ${trx}; cannot identify which tests failed, so not retrying."
              return 1
            fi

            local filter
            if ! filter="$(python3 .github/workflows/failed-tests-filter.py "$trx")"; then
              echo "::notice::Could not read ${trx}; not retrying."
              return 1
            fi

            if [ -z "$filter" ]; then
              # The suite failed but recorded no failed test: a crash, a hang, or a
              # build/discovery problem. Retrying blind would tell us nothing.
              echo "::notice::${name} (${label}) failed without a named failing test; not retrying."
              return 1
            fi

            echo "Retrying the failed tests of ${name} (${label}) once: ${filter}"
            dotnet test "$proj" --no-build --configuration Release \
              --filter "$filter" \
              --collect:"XPlat Code Coverage" \
              --results-directory "coverage/${name}" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=${name}-${label}-retry.trx"
          }

          # Runs a suite and, if it fails, retries just its failures once.
          # Records the outcome into `failed` or `flaky`.
          runSuiteWithRetry() {
            local proj="$1" name="$2" label="$3" filter="$4"

            if runSuite "$proj" "$name" "$label" "$filter"; then
              return 0
            fi

            if retryFailed "$proj" "$name" "$label"; then
              echo "::warning::${name} (${label}) failed and then passed on retry - treating as FLAKY, not as a failure. It is still a defect; see the job summary."
              flaky+=("${name} (${label})")
              return 0
            fi

            return 1
          }

          for proj in "${testProjs[@]}"; do
            name=$(basename "$proj" .csproj)
            echo "::group::Coverage: $name"
            ok=true
            # Chaos tests are CI-only fault-injection and excluded here to keep
            # the coverage run deterministic; AzureStorageEmulator tests run
            # against the Azurite service above. Coyote systematic-concurrency
            # models run in their own opt-in CI tier and cover the same shared
            # cores the deterministic unit tests already exercise, so they are
            # excluded here too. The UI category is deliberately NOT excluded -
            # browsers are installed above precisely so those paths are counted.
            if [ "$name" = "Orleans.Lattice.Explorer.UiTests" ]; then
              # Shard the browser suite exactly as ui-tests.yml does, reading the
              # same ui-test-shards.json so the two lanes cannot drift.
              #
              # Sharding is not about speed here - the shards run sequentially - it
              # is about how many cases one in-process Explorer web head serves.
              # ui-tests.yml gives each shard its own runner, and therefore its own
              # head, because a single head serving the whole journey suite starts
              # failing cases with the shell never reporting itself measured: the
              # interactive circuit stops establishing under the accumulated load.
              # Running the whole suite in one `dotnet test` process here put every
              # case back on one head and reproduced exactly that, two cases timing
              # out after thirty seconds waiting for .lx-root[data-lx-measured].
              # A separate process per shard restores one head per shard.
              #
              # The shards cover the whole project, so nothing is skipped by
              # not running it unfiltered as well: every filter selects
              # TestCategory=UI, and UiCategoryHygieneTests fails the build if any
              # [TestFixture] in this assembly lacks [Category("UI")] (with a
              # vacuity guard, so it cannot pass by scanning nothing). Within that,
              # accessibility, journeys and apps take their namespaces, journeys-b is
              # the complement of journeys-a, and structure the complement of all three.
              while IFS=$'\t' read -r shard filter; do
                runSuiteWithRetry "$proj" "$name" "$shard" "$filter" || ok=false
              done < <(jq -r '.[] | [.shard, .filter] | @tsv' .github/workflows/ui-test-shards.json)
            else
              runSuiteWithRetry "$proj" "$name" "all" \
                "TestCategory!=Chaos&TestCategory!=Coyote" || ok=false
            fi
            if [ "$ok" != true ]; then
              failed+=("$name")
              echo "::error::Coverage run failed for ${name}."
            fi
            echo "::endgroup::"
          done

          # Report flakes loudly even though they did not fail the run. A test that
          # only passes on the second attempt is still a defect; the point of the
          # retry is to stop it discarding the coverage report, not to pretend it
          # did not happen. Writing it to the job summary makes it visible without
          # anyone having to read the log.
          if [ ${#flaky[@]} -gt 0 ]; then
            {
              echo "### Flaky suites (passed only on retry)"
              echo
              echo "These failed once and passed when their failing tests were retried."
              echo "The run is green because this is the metrics lane, but each of these"
              echo "is a real instability worth fixing."
              echo
              for f in "${flaky[@]}"; do
                echo "- \`${f}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${#flaky[@]} suite(s) passed only on retry: ${flaky[*]}"
          fi

          # Decide whether the upload may run. Written before any `exit`, and read
          # by the upload step as `== 'true'`, so a step that dies before reaching
          # this line uploads nothing: the guard fails closed. A withheld upload
          # leaves main's coverage at the last complete measurement, which is
          # stale by a day; a partial one replaces it with a figure that is wrong.
          if [ ${#incomplete[@]} -gt 0 ]; then
            {
              echo "### Coverage NOT uploaded"
              echo
              echo "These suites did not produce a complete coverage report, so uploading"
              echo "this run would understate main's coverage. Codecov keeps the last"
              echo "complete measurement until a run measures every suite."
              echo
              for f in "${incomplete[@]}"; do
                echo "- \`${f}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Coverage upload withheld: ${#incomplete[@]} suite(s) produced an incomplete report: ${incomplete[*]}"
            echo "complete=false" >> "$GITHUB_OUTPUT"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

          if [ ${#failed[@]} -gt 0 ]; then
            {
              echo "### Failed suites"
              echo
              echo "These failed twice - once on the first run and again when only their"
              echo "failing tests were retried - so they are not being treated as flakes."
              echo
              for f in "${failed[@]}"; do
                echo "- \`${f}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Coverage failed for ${#failed[@]} project(s): ${failed[*]}"
            exit 1
          fi

      - name: Upload coverage to Codecov
        # Upload even when a project failed above, provided every suite still
        # produced a complete report: a named test failure leaves the report
        # whole, and discarding it because one suite broke is how the badge went
        # stale. A crashed or hung test host does not - its report reads the
        # assembly under test as uncovered - so the test step withholds the
        # upload by reporting `complete` as anything but 'true'.
        # CiCoverageUploadCompletenessTests holds this in place.
        if: ${{ !cancelled() && steps.test.outputs.complete == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          # Add a CODECOV_TOKEN repository secret (from the Codecov project
          # settings). fail_ci_if_error is left false so a transient upload
          # hiccup never fails the nightly run.
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          fail_ci_if_error: false
