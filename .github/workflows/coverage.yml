name: Coverage

# Coverage is measured on main only, once a night. The README coverage badge
# reads the default branch's coverage from Codecov, and Codecov only learns
# main's coverage from an upload made on a main commit, which a scheduled run on
# main is. This deliberately does NOT run on pull_request: the coverage-relevant
# suites (including the browser suite, durable active-active and
# other Azurite integration tests) is expensive, and paying it on every PR would
# slow the PR feedback loop for no badge benefit. The change-scoped
# build-and-test job in ci.yml remains the PR gate.
#
# Why nightly rather than on every push. This lane builds the whole solution and
# runs the non-chaos, non-Coyote, non-TLC suites under coverlet, including browsers.
# Coverage uses CI's shard partitions and duration estimates on parallel runners.
# Beside them, uninstrumented legs run every exhaustive TLC shard and the smoke
# shard; see the `tlc` job below.
# Before sharding this took over 150 minutes; the historic replay below explains
# why it remains nightly even though parallelism reduces elapsed time.
# Main took merges faster than the old serial run. Run on every push with
# `cancel-in-progress: true`, most runs were cancelled part way (22 of the 35
# runs from #3327 to #3473), and GitHub rolls a cancelled check run up as a
# FAILURE, so main showed a red cross on most of its commits although nothing had
# failed. Queueing the runs instead removes the red but spends more, because the
# run already in flight always finishes. Replaying the 207 pushes to main from
# 4 to 24 September against today's hour-long run, every per-push design cost
# 8,900-10,000 runner-minutes; one run a night cost about 870, and it is the only
# design that stops this lane competing with pull-request CI for runners during
# the working day. The price is freshness: the badge is up to a day old, and a
# failure here narrows to a day's merges rather than to one. Coverage gates
# nothing and build-and-test tests every pull request before it merges, so that
# is the right trade. CiCoverageLaneScheduleTests holds this shape in place.
#
# The schedule alone is not enough. GitHub documents `schedule` as best-effort:
# an event can be delayed or dropped. Since the Actions incidents of 2026-08-26
# that has been the norm rather than the exception (see
# https://github.com/orgs/community/discussions/207346): the 03:17 slot below
# was created at 08:49 UTC on 25 September, 08:36 UTC on 26 September and
# 09:16 UTC on 27 September, 5h19m-5h59m late, with `created_at` equal to
# `run_started_at` to the second - the event itself was late, not a runner -
# and GitHub may drop one outright. `workflow_dispatch` is
# unaffected. So coverage-catch-up.yml checks on every push to main whether
# tonight's run exists and, once the slot is two hours past with none, dispatches
# this workflow with `catch_up: true`. Whichever of the schedule and the
# catch-up arrives first measures; the other skips (see the `measured` job).
# Still observed on 8-10 October: scheduled events were created at 10:35,
# 10:34 and 09:51 UTC, 6h34m-7h19m after the slot. Sharding cannot fix event
# delivery; keep catch-up until GitHub restores timely schedule delivery.
on:
  schedule:
    # 03:17 UTC. The quietest hour on main - not one of those 207 pushes landed
    # between 03:00 and 04:00 UTC - and off the top of the hour, when GitHub
    # delays and can drop scheduled runs under load. GitHub also disables a
    # public repository's schedules after 60 days without activity.
    # The `slot` in the `measured` job and in coverage-catch-up.yml must match
    # this expression; CiCoverageLaneScheduleTests pins the three together.
    - cron: '17 3 * * *'
  # Manual trigger: re-run after a transient failure, measure a merge without
  # waiting for the night, or validate a change to this lane on a branch before
  # merging it - otherwise the change would land on main unverified. A manual
  # dispatch always measures; only a catch-up dispatch is subject to the skip.
  workflow_dispatch:
    inputs:
      catch_up:
        description: 'Stand in for a missed nightly run: skip if tonight is already covered. Set by coverage-catch-up.yml.'
        type: boolean
        default: false
      # The cheap way to validate a change to the TLC legs or the tracking
      # issue on a branch: one small TLC leg instead of the whole lane. Ignored
      # on the default branch, where a partial run must never stand in for a
      # night (the `measured` job counts any earlier run as covering it).
      tlc_shards:
        description: 'Branch validation only: comma-separated TLC shards (e.g. formal-tlc-smoke). Runs ONLY those, with no coverage legs and no Codecov upload. Ignored on the default branch.'
        type: string
        default: ''
      track_tlc_failures:
        description: 'Branch validation only: open, update or close the nightly TLC tracking issue from this run.'
        type: boolean
        default: false

# Least-privilege: this workflow only reads source and uploads a coverage report.
# The `measured` job additionally reads this workflow's own run history, and the
# `tlc-tracking` job alone may write issues, to maintain the TLC tracking issue.
permissions:
  contents: read

# One measurement at a time. A dispatch that arrives during the nightly run waits
# for it rather than cancelling it: nothing in this lane should cancel a run,
# because GitHub rolls a cancelled check run up as a failure on its commit.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A night with no merges would otherwise spend an hour re-measuring the commit
  # the previous night measured - main went eight days without a commit in the
  # period replayed above. So a scheduled run skips when its commit is the one the
  # last successful run measured. That is exact rather than a heuristic, because
  # the same commit measures the same coverage, and it fails open: another commit,
  # a failed last run, an API error or a manual dispatch all measure.
  #
  # A nightly run - the schedule, or a catch-up dispatch standing in for it -
  # also skips when an earlier run of this lane already exists since tonight's
  # slot opened, so a late schedule arriving after the catch-up does not measure
  # the night twice. "Earlier" is by run id, which GitHub assigns in creation
  # order, so of any set of nightly runs the first always measures and the skip
  # can never fire on all of them. A failed earlier run counts - retrying it
  # would spend another hour on the same failure, which is already red - and a
  # cancelled one does not.
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To read this workflow's last successful run, which is all this job reads.
      actions: read
    outputs:
      measure: ${{ steps.head.outputs.measure }}
    steps:
      - name: Skip a commit already measured, or a night already covered
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          CATCH_UP: ${{ inputs.catch_up }}
        run: |
          set -uo pipefail
          # GITHUB_WORKFLOW_REF is <owner>/<repo>/.github/workflows/<file>@<ref>.
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          last="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
            -f branch="${GITHUB_REF_NAME}" -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // ""')" || last=""

          nightly=false
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$CATCH_UP" = true ]; then
            nightly=true
          fi

          # Tonight's slot: the most recent 03:17 UTC, matching the cron above.
          slot="03:17"
          now="$(date -u +%s)"
          opened="$(date -u -d "$(date -u +%F) ${slot}" +%s)"
          if [ "$now" -lt "$opened" ]; then
            opened=$((opened - 86400))
          fi
          since="$(date -u -d "@${opened}" +%Y-%m-%dT%H:%M:%SZ)"
          earlier="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
            -f branch="${GITHUB_REF_NAME}" -f created=">=${since}" -f per_page=100 \
            --jq "[.workflow_runs[] | select(.id < ${GITHUB_RUN_ID} and .conclusion != \"cancelled\")] | length")" || earlier=0
          case "$earlier" in ''|*[!0-9]*) earlier=0 ;; esac

          if [ "$nightly" = true ] && [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "::notice title=Coverage already measured::${GITHUB_SHA} is the commit the last successful run measured, so this run skips the measurement."
            echo "measure=false" >> "$GITHUB_OUTPUT"
          elif [ "$nightly" = true ] && [ "$earlier" -gt 0 ]; then
            echo "::notice title=Night already covered::An earlier run of this lane started since the ${since} slot, so this run skips the measurement."
            echo "measure=false" >> "$GITHUB_OUTPUT"
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: measured
    # Measure unless the check positively found this commit already measured. Only
    # an explicit 'false' skips, so a missing verdict measures, and `!cancelled()`
    # keeps a failed check job from blocking the measurement (it still turns the
    # run red, so the failure is not hidden).
    if: ${{ !cancelled() && needs.measured.outputs.measure != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.matrix.outputs.legs }}
      tlc_legs: ${{ steps.matrix.outputs.tlc_legs }}
      coverage: ${{ steps.matrix.outputs.coverage }}
      track: ${{ steps.matrix.outputs.track }}
    steps:
      - uses: actions/checkout@v5
      - name: Plan coverage shards
        id: matrix
        env:
          TLC_SHARDS: ${{ inputs.tlc_shards }}
          TRACK_TLC_FAILURES: ${{ inputs.track_tlc_failures }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          shards="${TLC_SHARDS:-}"
          on_default=false
          if [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            on_default=true
          fi
          if [ -n "$shards" ] && [ "$on_default" = true ]; then
            echo "::warning title=TLC restriction ignored::tlc_shards validates a branch. On ${DEFAULT_BRANCH} a partial run would stand in for a whole night, so this run measures everything."
            shards=""
          fi
          python3 .github/workflows/plan-coverage-matrix.py \
            --output-matrix /tmp/coverage-matrix.json \
            --output-tlc-matrix /tmp/tlc-matrix.json \
            --tlc-shards "$shards"
          # The tracking issue follows the default branch's full runs: the
          # schedule, its catch-up and a manual dispatch there. A branch run
          # touches it only when asked to, to validate the tracking itself.
          track=false
          if [ "$on_default" = true ] || [ "${TRACK_TLC_FAILURES:-false}" = true ]; then
            track=true
          fi
          coverage=true
          if [ -n "$shards" ]; then
            coverage=false
          fi
          {
            echo "legs=$(cat /tmp/coverage-matrix.json)"
            echo "tlc_legs=$(cat /tmp/tlc-matrix.json)"
            echo "coverage=${coverage}"
            echo "track=${track}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Coverage plan"
            echo
            if [ "$coverage" = true ]; then
              echo "$(jq length /tmp/coverage-matrix.json) parallel coverage legs using CI's shard partitions and duration estimates."
              echo "Chaos, Coyote and TLC are NOT run under coverlet."
            else
              echo "Coverage legs and the Codecov upload are NOT run: this branch run is restricted to TLC shards ${shards}."
            fi
            echo
            echo "$(jq length /tmp/tlc-matrix.json) uninstrumented TLC legs ($(jq '[.[].items[]] | length' /tmp/tlc-matrix.json) shards), ignoring verdict receipts. Tracking issue maintained: ${track}."
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    needs: [measured, plan]
    if: ${{ !cancelled() && needs.measured.outputs.measure != 'false' && needs.plan.result == 'success' && needs.plan.outputs.coverage == 'true' }}
    name: Coverage / ${{ matrix.leg.name }}
    runs-on: ubuntu-latest
    # Per-leg backstop; a hung leg cannot hold the nightly lane for six hours.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJson(needs.plan.outputs.legs) }}

    # Azurite supplies the local Azure Storage blob/queue/table endpoints that the
    # AzureStorageEmulator-category integration tests drive via
    # `UseDevelopmentStorage=true`, so their code paths are counted in coverage
    # rather than self-skipping. Mirrors the build-and-test job in ci.yml.
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Orleans.Lattice.slnx

      - name: Build
        run: dotnet build Orleans.Lattice.slnx --no-restore --configuration Release

      # The browser UI suite runs in this job too, so its code paths are counted
      # rather than self-skipping. It hosts the Explorer in-process on Kestrel,
      # so coverlet instruments the same process that serves the app and the
      # server-side render path is genuinely covered - not just the test code.
      # Browsers are cached on the project file, which is where the pinned
      # Microsoft.Playwright version lives.
      - name: Cache Playwright browsers
        if: matrix.leg.ui
        id: pwcache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-firefox-webkit-${{ runner.os }}-${{ hashFiles('test/lattice.explorer.uitests/**/*.csproj') }}

      # Chromium, Firefox and WebKit: the suite's apps shard runs the frame isolation
      # tests in all three engines, as ui-tests.yml does.
      - name: Install Playwright browsers
        if: matrix.leg.ui
        timeout-minutes: 15
        env:
          CACHE_HIT: ${{ steps.pwcache.outputs.cache-hit }}
        run: |
          bash .github/workflows/install-playwright-browsers.sh "$CACHE_HIT" chromium firefox webkit

      - name: Wait for Azurite
        run: |
          for port in 10000 10001 10002; do
            for i in $(seq 1 30); do
              if (echo > "/dev/tcp/127.0.0.1/${port}") 2>/dev/null; then
                echo "Azurite port ${port} ready"; break
              fi
              if [ "$i" -eq 30 ]; then echo "::error::Azurite port ${port} not ready after 30s"; exit 1; fi
              sleep 1
            done
          done

      # tla-toolchain: not-required - Coverage excludes every Tlc test, including retries.
      - name: Test with coverage
        # The upload step reads this step's `complete` output; see below.
        id: test
        # The digest-settle integration oracles need a wider convergence budget
        # on a loaded runner; see the equivalent step in ci.yml for the rationale.
        env:
          LATTICE_DIGEST_SETTLE_TIMEOUT_MS: '60000'
          LEG: ${{ toJson(matrix.leg) }}
        run: |
          set -uo pipefail
          # Run every project even when one fails, then fail the step at the end.
          #
          # This loop used to run under `set -e`, so the first failing project
          # aborted the whole step: every later project went unmeasured and the
          # Codecov upload was skipped entirely, leaving the badge frozen on the
          # last good commit. One flaky suite therefore discarded the coverage of
          # all forty-odd others, which is the opposite of what this lane is for.
          # Collecting failures and reporting them together keeps a green project's
          # coverage even when a sibling is broken, and still fails the run.
          failed=()
          flaky=()
          # Suites whose coverage report cannot be trusted. Distinct from `failed`:
          # a suite with a named failing test ran to completion, so its report is
          # whole and is still uploaded. A suite whose test host crashed or hung
          # was killed mid-run, and coverlet still writes a coverage.cobertura.xml
          # for it - but with the hit counts the dead process never flushed, so
          # the whole assembly under test reads as uncovered. Uploading that is
          # not "a bit stale", it is wrong: on 29 September a hang in
          # Orleans.Lattice.Tests uploaded the core library at near zero and
          # main's coverage fell from 93.5% to 78.7% with no code change.
          incomplete=()
          mkdir -p test-logs

          runSuite() {
            local proj="$1" name="$2" label="$3" filter="$4"
            # The console log is kept outside coverage/, the directory Codecov
            # uploads from, so it can never be mistaken for a report.
            local out="test-logs/${name}-${label}.log"
            local before after rc
            # Clear this suite's result file first, so that if the run dies without
            # producing one, the retry step finds nothing rather than reading a
            # stale file and retrying the wrong thing. A crashed or hung host is
            # exactly the case that must NOT be treated as a set of named failures.
            rm -f "coverage/${name}/${name}-${label}.trx"
            before="$(find "coverage/${name}" -name coverage.cobertura.xml 2>/dev/null | wc -l)"
            dotnet test "$proj" --no-build --configuration Release \
              --filter "$filter" \
              --collect:"XPlat Code Coverage" \
              --results-directory "coverage/${name}" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=${name}-${label}.trx" 2>&1 | tee "$out"
            rc=${PIPESTATUS[0]}
            after="$(find "coverage/${name}" -name coverage.cobertura.xml 2>/dev/null | wc -l)"

            # vstest reports a killed host as "The active test run was aborted",
            # "Test Run Aborted." and "The Test Run was aborted because the host
            # process exited unexpectedly"; a --blame-hang kill produces all three.
            if grep -qiE 'test run (was )?aborted|test host process crashed' "$out"; then
              echo "::error::${name} (${label}): the test host was aborted, so its coverage report is truncated. Coverage will not be uploaded for this run."
              incomplete+=("${name} (${label}): test host aborted")
            elif [ "$after" -le "$before" ]; then
              echo "::error::${name} (${label}) produced no coverage report. Coverage will not be uploaded for this run."
              incomplete+=("${name} (${label}): no coverage report")
            fi
            return "$rc"
          }

          # Retry exactly the tests that failed, once. Returns 0 when the retry
          # cleared them, non-zero when it did not or could not be attempted.
          #
          # Why this lane retries and the PR gate does not.
          #
          # This is the metrics lane: it exists to keep main's coverage report and
          # the README badge current, and `build-and-test` in ci.yml remains the
          # required correctness gate, running the same tests with no retries and
          # no instrumentation. What makes THIS lane different is that it runs the
          # whole suite under coverlet on a shared runner, which is materially
          # slower, and that is enough to push time-sensitive machinery past
          # internal deadlines it clears comfortably everywhere else - an Orleans
          # reminder service that "is still initializing and it is taking a long
          # time", a Blazor circuit, a browser relayout. Those failures say
          # something about the runner, not about the commit, and there are forty-odd
          # projects any of which can produce one.
          #
          # A whole-project rerun would be the blunt version of this and is worse on
          # both counts: it gives every OTHER test in that project a fresh chance to
          # flake, and it cannot tell which test was unstable. Retrying only the
          # named failures keeps the signal - two failures of the same test is a real
          # failure and still fails the run.
          #
          # The retry never silences anything: a test that only passes on the second
          # attempt is reported as flaky, in the log, as a warning annotation, and in
          # the job summary. Green-but-flaky is a visible state, not a hidden one.
          retryFailed() {
            local proj="$1" name="$2" label="$3"
            local trx="coverage/${name}/${name}-${label}.trx"

            if [ ! -f "$trx" ]; then
              echo "::notice::No trx at ${trx}; cannot identify which tests failed, so not retrying."
              return 1
            fi

            local filter
            if ! filter="$(python3 .github/workflows/failed-tests-filter.py "$trx")"; then
              echo "::notice::Could not read ${trx}; not retrying."
              return 1
            fi

            if [ -z "$filter" ]; then
              # The suite failed but recorded no failed test: a crash, a hang, or a
              # build/discovery problem. Retrying blind would tell us nothing.
              echo "::notice::${name} (${label}) failed without a named failing test; not retrying."
              return 1
            fi

            echo "Retrying the failed tests of ${name} (${label}) once: ${filter}"
            # Retry reports are subject to the same abort/completeness checks.
            runSuite "$proj" "$name" "${label}-retry" \
              "(${filter})&(TestCategory!=Chaos&TestCategory!=Coyote&TestCategory!=Tlc)"
          }

          # Runs a suite and, if it fails, retries just its failures once.
          # Records the outcome into `failed` or `flaky`.
          runSuiteWithRetry() {
            local proj="$1" name="$2" label="$3" filter="$4"

            if runSuite "$proj" "$name" "$label" "$filter"; then
              return 0
            fi

            if retryFailed "$proj" "$name" "$label"; then
              echo "::warning::${name} (${label}) failed and then passed on retry - treating as FLAKY, not as a failure. It is still a defect; see the job summary."
              flaky+=("${name} (${label})")
              return 0
            fi

            return 1
          }

          while IFS=$'\t' read -r proj label filter; do
            name=$(basename "$proj" .csproj)
            echo "::group::Coverage: $name / $label"
            ok=true
            runSuiteWithRetry "$proj" "$name" "$label" "$filter" || ok=false
            if [ "$ok" != true ]; then
              failed+=("$name")
              echo "::error::Coverage run failed for ${name}."
            fi
            echo "::endgroup::"
          done < <(jq -r '.items[] | [.project, (.shard + "-" + .tier), .filter] | @tsv' <<< "$LEG")

          # Report flakes loudly even though they did not fail the run. A test that
          # only passes on the second attempt is still a defect; the point of the
          # retry is to stop it discarding the coverage report, not to pretend it
          # did not happen. Writing it to the job summary makes it visible without
          # anyone having to read the log.
          if [ ${#flaky[@]} -gt 0 ]; then
            {
              echo "### Flaky suites (passed only on retry)"
              echo
              echo "These failed once and passed when their failing tests were retried."
              echo "The run is green because this is the metrics lane, but each of these"
              echo "is a real instability worth fixing."
              echo
              for f in "${flaky[@]}"; do
                echo "- \`${f}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${#flaky[@]} suite(s) passed only on retry: ${flaky[*]}"
          fi

          # Decide whether the upload may run. Written before any `exit`, and read
          # by the upload step as `== 'true'`, so a step that dies before reaching
          # this line uploads nothing: the guard fails closed. A withheld upload
          # leaves main's coverage at the last complete measurement, which is
          # stale by a day; a partial one replaces it with a figure that is wrong.
          if [ ${#incomplete[@]} -gt 0 ]; then
            {
              echo "### Coverage NOT uploaded"
              echo
              echo "These suites did not produce a complete coverage report, so uploading"
              echo "this run would understate main's coverage. Codecov keeps the last"
              echo "complete measurement until a run measures every suite."
              echo
              for f in "${incomplete[@]}"; do
                echo "- \`${f}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Coverage upload withheld: ${#incomplete[@]} suite(s) produced an incomplete report: ${incomplete[*]}"
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

          if [ ${#failed[@]} -gt 0 ]; then
            {
              echo "### Failed suites"
              echo
              echo "These failed twice - once on the first run and again when only their"
              echo "failing tests were retried - so they are not being treated as flakes."
              echo
              for f in "${failed[@]}"; do
                echo "- \`${f}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Coverage failed for ${#failed[@]} project(s): ${failed[*]}"
            exit 1
          fi

      - name: Save complete coverage leg
        if: ${{ !cancelled() && steps.test.outputs.complete == 'true' }}
        run: |
          mkdir -p coverage/complete
          touch "coverage/complete/${{ matrix.leg.id }}"

      - name: Upload coverage leg
        if: ${{ !cancelled() && steps.test.outputs.complete == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_attempt }}-${{ matrix.leg.id }}
          path: |
            coverage/**/coverage.cobertura.xml
            coverage/complete/*
          if-no-files-found: error
          retention-days: 3

  upload:
    needs: [measured, plan, coverage]
    if: ${{ !cancelled() && needs.measured.outputs.measure != 'false' && needs.plan.result == 'success' && needs.plan.outputs.coverage == 'true' }}
    runs-on: ubuntu-latest
    # Sized for the ReportGenerator merge below (about seven minutes for the
    # 2026-10-30 legs) plus the download and the upload.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Download coverage legs
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-${{ github.run_attempt }}-leg-*
          path: coverage
          merge-multiple: false

      - name: Verify all coverage legs are complete
        id: test
        env:
          LEGS: ${{ needs.plan.outputs.legs }}
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0' <<< "$LEGS" > /dev/null
          while read -r leg; do
            artifact="coverage/coverage-${{ github.run_attempt }}-${leg}"
            if [ ! -f "${artifact}/complete/${leg}" ] || \
              [ -z "$(find "$artifact" -name coverage.cobertura.xml -print -quit)" ]; then
              echo "::error::Coverage upload withheld: ${leg} did not produce a complete report."
              exit 1
            fi
          done < <(jq -r '.[].id' <<< "$LEGS")
          echo "complete=true" >> "$GITHUB_OUTPUT"

      # Merge every leg's per-test-project Cobertura report into one before
      # uploading (#5218). Each project's report repeats the classes of every
      # assembly it loads, so the raw upload was 134 files and about 3 GB of
      # XML. Codecov stopped processing that within its time limit (every upload
      # from 2026-10-27 ended in 'error' after ~10 minutes, with no report).
      # Merged, it is one report of about 35 MB. The merge runs only on a
      # complete set of legs, like the upload.
      - name: Setup .NET (coverage merge)
        if: ${{ !cancelled() && steps.test.outputs.complete == 'true' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Merge coverage reports
        id: merge
        if: ${{ !cancelled() && steps.test.outputs.complete == 'true' }}
        run: |
          set -euo pipefail
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.11 \
            --tool-path "$RUNNER_TEMP/reportgenerator"
          "$RUNNER_TEMP/reportgenerator/reportgenerator" \
            "-reports:coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage-merged -reporttypes:Cobertura -verbosity:Warning
          test -s coverage-merged/Cobertura.xml
          echo "Merged $(find coverage -name coverage.cobertura.xml | wc -l) report(s) into $(du -h coverage-merged/Cobertura.xml | cut -f1)."

      - name: Upload coverage to Codecov
        # Upload even when a project failed above, provided every suite still
        # produced a complete report: a named test failure leaves the report
        # whole, and discarding it because one suite broke is how the badge went
        # stale. A crashed or hung test host does not - its report reads the
        # assembly under test as uncovered - so the test step withholds the
        # upload by reporting `complete` as anything but 'true'. This final job
        # also requires every planned leg's attempt-scoped artifact and marker.
        # CiCoverageUploadCompletenessTests holds this in place.
        if: ${{ !cancelled() && steps.test.outputs.complete == 'true' && steps.merge.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          # Add a CODECOV_TOKEN repository secret (from the Codecov project
          # settings). fail_ci_if_error is left false so a transient upload
          # hiccup never fails the nightly run.
          token: ${{ secrets.CODECOV_TOKEN }}
          # Only the merged report: searching the raw legs would upload the
          # 134 per-project files again.
          files: coverage-merged/Cobertura.xml
          disable_search: true
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # EXHAUSTIVE TLC, nightly. spec/README.md ("CI decision") and tier-scope.py
  # say nightly coverage runs the exhaustive TLC shards; these legs make that
  # true. Pull requests skip exhaustive TLC when no TLC input changed, and
  # receipts (#5164) will let them skip unchanged modules, so this is the one
  # lane that checks every module against a toolchain and runner image that can
  # drift without any diff. Hence two rules:
  #
  # - Every "tlc" and "tlcSmoke" shard of test-shards.json runs, planned by
  #   plan-coverage-matrix.py from CI's own partition and estimates. Nothing
  #   here restores a TLC verdict receipt, and nothing ever may: a receipt
  #   would turn the drift backstop into a check of nothing.
  # - No coverlet. The legs run through run-test-leg.py exactly as ci.yml's
  #   legs do, so a TLC-only item is bounded by this job's timeout rather than
  #   VSTest's inactivity collector (#5012). The timeout is sized per leg from
  #   its measured estimate by the planner, not fixed here.
  #
  # A quiet night skips with the coverage legs (see `measured`), so TLC reruns
  # when main moves; a manual dispatch re-checks an unchanged commit.
  # ---------------------------------------------------------------------------
  tlc:
    needs: [measured, plan]
    if: ${{ !cancelled() && needs.measured.outputs.measure != 'false' && needs.plan.result == 'success' }}
    name: Exhaustive TLC / ${{ matrix.leg.name }}
    # TLC_RUNNER (a repository variable holding a JSON runs-on value, e.g.
    # ["self-hosted","lattice-tlc"]) moves these legs onto the elastic
    # self-hosted pool in tools/ci-runners, off the hosted runners PR CI uses.
    # Unset, they run on ubuntu-latest. Only trusted workflows (push to main,
    # schedule, owner dispatch) may opt in: never a pull_request workflow.
    runs-on: ${{ fromJSON(vars.TLC_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: ${{ matrix.leg.timeout }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJson(needs.plan.outputs.tlc_legs) }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Only the core test project: every TLC shard is in it.
      - name: Build the TLC test project
        run: dotnet build test/lattice/Orleans.Lattice.Tests.csproj --configuration Release

      # The one TLA+ toolchain action (#5151): pins from tools/tlc/toolchain.json,
      # a digest-verified jar and the verified checkpoint overlay. Its overlay
      # cache is keyed on the resolved JDK, so it is not a verdict receipt.
      - name: Provision TLA+ toolchain
        uses: ./.github/actions/tla-toolchain

      - name: Run TLC leg
        env:
          LEG: ${{ toJson(matrix.leg) }}
          LEG_ID: ${{ matrix.leg.id }}
        run: |
          set -euo pipefail
          printf '%s' "$LEG" > /tmp/leg.json
          python3 .github/workflows/run-test-leg.py \
            --leg /tmp/leg.json \
            --results-dir tlc-results \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload TLC leg results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tlc-results-${{ github.run_attempt }}-${{ matrix.leg.id }}
          path: tlc-results/
          retention-days: 7

      - name: Upload TLC trx
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tlc-trx-${{ github.run_attempt }}-${{ matrix.leg.id }}
          path: '**/TestResults/*.trx'
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload TLC diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tlc-diagnostics-${{ github.run_attempt }}-${{ matrix.leg.id }}
          path: |
            **/*.dmp
            **/Sequence_*.xml
          retention-days: 7
          if-no-files-found: ignore

  # One verdict over every TLC leg, so a leg that died before writing its
  # result reads as a failure rather than as an absence, plus the measured
  # durations TLC pricing is refreshed from: test-durations.tsv rows in the job
  # summary, and one row per case in the tlc-case-durations artifact.
  tlc-report:
    needs: [measured, plan, tlc]
    if: ${{ !cancelled() && needs.measured.outputs.measure != 'false' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Every attempt: summarise-test-legs.py keeps the latest result per leg,
      # so re-running one failed leg reports on the whole lane.
      - name: Download TLC leg results
        uses: actions/download-artifact@v8
        with:
          pattern: tlc-results-*
          path: tlc-results
          merge-multiple: false

      - name: Download TLC trx
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: tlc-trx-${{ github.run_attempt }}-*
          path: tlc-trx
          merge-multiple: false

      - name: Write per-case TLC durations
        run: |
          set -euo pipefail
          mkdir -p tlc-trx
          python3 .github/workflows/plan-coverage-matrix.py \
            --tlc-case-durations tlc-trx --output tlc-case-durations.tsv

      - name: Upload per-case TLC durations
        uses: actions/upload-artifact@v6
        with:
          name: tlc-case-durations-${{ github.run_attempt }}
          path: tlc-case-durations.tsv
          retention-days: 90

      - name: Judge the TLC legs
        if: ${{ !cancelled() }}
        env:
          TLC_LEGS: ${{ needs.plan.outputs.tlc_legs }}
        run: |
          set -euo pipefail
          expect="$(jq length <<< "$TLC_LEGS")"
          python3 .github/workflows/summarise-test-legs.py \
            --results-dir tlc-results \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --expect-legs "$expect"

  # Receipts WRITTEN, never read (#5165). Every module whose every census case
  # passed tonight gets a TLC verdict receipt (contract C5) in this run's cache
  # scope, which on main is the scope every pull request reads, so a module the
  # night verified is not rerun by the next pull request that touches a verdict
  # input elsewhere. The legs above never restore one; see the `tlc` job. A
  # separate job, so a receipt-writing fault never reads as a TLC failure in the
  # tracking issue. Only this attempt's evidence counts: a receipt must come
  # from one run.
  tlc-receipts:
    needs: [measured, plan, tlc]
    if: ${{ !cancelled() && needs.measured.outputs.measure != 'false' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build the TLC test project
        run: dotnet build test/lattice/Orleans.Lattice.Tests.csproj --configuration Release

      - name: Write the TLC case census
        run: |
          set -euo pipefail
          LATTICE_TLC_CENSUS="$RUNNER_TEMP/tlc-census.json" \
            dotnet test test/lattice/Orleans.Lattice.Tests.csproj --no-build --configuration Release --nologo \
              --filter "FullyQualifiedName=Orleans.Lattice.Tests.Formal.TlcCaseCensusTests.The_census_is_written_to_the_file_LATTICE_TLC_CENSUS_names"
          if [ ! -s "$RUNNER_TEMP/tlc-census.json" ]; then
            echo "::error::Writing TLC receipts needs the census and it was not written."
            exit 1
          fi

      - name: Fingerprint every TLC module
        run: python3 .github/workflows/tlc-fingerprint.py --output "$RUNNER_TEMP/tlc-fingerprints.json"

      - name: Download TLC leg results
        uses: actions/download-artifact@v8
        with:
          pattern: tlc-results-${{ github.run_attempt }}-*
          path: tlc-results
          merge-multiple: false

      # No receipt plan: the night ran every module, so every module whose
      # census cases all passed earns a receipt.
      - name: Write TLC verdict receipts
        run: |
          set -euo pipefail
          python3 .github/workflows/tlc-receipts.py assemble \
            --fingerprints "$RUNNER_TEMP/tlc-fingerprints.json" \
            --census "$RUNNER_TEMP/tlc-census.json" \
            --evidence-dir tlc-results \
            --receipts-dir "$RUNNER_TEMP/tlc-receipts" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # The action ci.yml saves receipts with; save only, never lookup.
      - name: Save TLC verdict receipts
        if: ${{ !cancelled() }}
        uses: ./.github/actions/tlc-receipts
        with:
          operation: save
          receipts-dir: ${{ runner.temp }}/tlc-receipts

  # One open issue tracks a failing night: created on the first red night,
  # commented with the run link on each later one, closed on the first green
  # one. The only job in this workflow that may write issues.
  tlc-tracking:
    needs: [plan, tlc, tlc-report]
    if: ${{ !cancelled() && needs.plan.outputs.track == 'true' && needs.tlc-report.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly TLC tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TLC_RESULT: ${{ needs.tlc.result }}
          REPORT_RESULT: ${{ needs.tlc-report.result }}
        run: |
          set -euo pipefail
          title="Nightly exhaustive TLC failing on main"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$TLC_RESULT" = success ] && [ "$REPORT_RESULT" = success ]; then
            verdict=green
          elif [ "$TLC_RESULT" = failure ] || [ "$REPORT_RESULT" = failure ]; then
            verdict=red
          else
            echo "::notice title=TLC tracking::No verdict (legs ${TLC_RESULT}, report ${REPORT_RESULT}); the tracking issue is left as it is."
            exit 0
          fi
          # The REST listing rather than search: search is eventually
          # consistent, so a run right after a red one could miss the issue it
          # opened and open a second.
          existing="$(gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/issues" \
            -f state=open -f labels=ci -f per_page=100 \
            --jq ".[] | select(.pull_request == null and .title == \"${title}\") | .number" \
            | sort -n | head -n 1)"
          if [ "$verdict" = red ]; then
            note="Exhaustive TLC failed on \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}: ${run_url} (legs ${TLC_RESULT}, report ${REPORT_RESULT})."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$note"
              echo "::notice title=TLC tracking::Updated #${existing}."
            else
              body="$(printf '%s\n\n%s\n' "$note" "Maintained by the tlc-tracking job of .github/workflows/coverage.yml: each failing night adds its run here, and the first green night closes this issue.")"
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label ci --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "Exhaustive TLC passed on \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}: ${run_url}. Closing."
            echo "::notice title=TLC tracking::Closed #${existing}."
          else
            echo "::notice title=TLC tracking::Green, and no open tracking issue to close."
          fi
