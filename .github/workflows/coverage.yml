name: Coverage

# Coverage is measured on main only. The README coverage badge reads the
# default branch's coverage from Codecov, and Codecov only learns main's
# coverage from an upload made on a main commit - so a post-merge push run is
# what keeps the badge live. This deliberately does NOT run on pull_request:
# the full non-chaos suite (every test/*.Tests.csproj, including the durable
# active-active and other Azurite integration tests) is expensive, and paying
# it on every PR would slow the PR feedback loop for no badge benefit. The
# change-scoped build-and-test job in ci.yml remains the PR gate.
on:
  push:
    branches: [main]

# Least-privilege: this workflow only reads source and uploads a coverage report.
permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest

    # Azurite supplies the local Azure Storage blob/queue/table endpoints that the
    # AzureStorageEmulator-category integration tests drive via
    # `UseDevelopmentStorage=true`, so their code paths are counted in coverage
    # rather than self-skipping. Mirrors the build-and-test job in ci.yml.
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Orleans.Lattice.slnx

      - name: Build
        run: dotnet build Orleans.Lattice.slnx --no-restore --configuration Release

      # The browser UI suite runs in this job too, so its code paths are counted
      # rather than self-skipping. It hosts the Explorer in-process on Kestrel,
      # so coverlet instruments the same process that serves the app and the
      # server-side render path is genuinely covered - not just the test code.
      # Browsers are cached on the project file, which is where the pinned
      # Microsoft.Playwright version lives.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/lattice.explorer.uitests/**/*.csproj') }}

      - name: Install Playwright chromium
        run: |
          set -euo pipefail
          script="$(find test/lattice.explorer.uitests/bin/Release -name playwright.ps1 -print -quit 2>/dev/null || true)"
          if [ -z "$script" ]; then
            echo "::error::playwright.ps1 not found - the UI test project did not build, so its coverage would be silently missing."
            exit 1
          fi
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            pwsh "$script" install-deps chromium
          else
            pwsh "$script" install chromium --with-deps
          fi

      - name: Wait for Azurite
        run: |
          for port in 10000 10001 10002; do
            for i in $(seq 1 30); do
              if (echo > "/dev/tcp/127.0.0.1/${port}") 2>/dev/null; then
                echo "Azurite port ${port} ready"; break
              fi
              if [ "$i" -eq 30 ]; then echo "::error::Azurite port ${port} not ready after 30s"; exit 1; fi
              sleep 1
            done
          done

      - name: Test with coverage
        # The digest-settle integration oracles need a wider convergence budget
        # on a loaded runner; see the equivalent step in ci.yml for the rationale.
        env:
          LATTICE_DIGEST_SETTLE_TIMEOUT_MS: '60000'
        run: |
          set -euo pipefail
          # Exclude the benchmark/throughput test projects: microbench runs
          # BenchmarkDotNet harnesses (not library coverage) and
          # azure-throughput-silo is not part of Orleans.Lattice.slnx, so it is
          # not built by the step above. The standalone lattice.integration
          # project is intentionally included here.
          #
          # The pattern is '*Tests.csproj', not '*.Tests.csproj'. The browser UI
          # project is Orleans.Lattice.Explorer.UiTests.csproj, whose suffix is
          # '.UiTests.csproj' - it has no literal dot before 'Tests', so the
          # stricter glob silently skipped it and its coverage would have gone
          # missing without anything failing. Widening costs nothing: every
          # existing project matches either way.
          mapfile -t testProjs < <(find test -type f -name '*Tests.csproj' \
            -not -path '*/microbench/*' \
            -not -path '*/azure-throughput-silo/*' | sort)
          for proj in "${testProjs[@]}"; do
            name=$(basename "$proj" .csproj)
            echo "::group::Coverage: $name"
            # Chaos tests are CI-only fault-injection and excluded here to keep
            # the coverage run deterministic; AzureStorageEmulator tests run
            # against the Azurite service above. Coyote systematic-concurrency
            # models run in their own opt-in CI tier and cover the same shared
            # cores the deterministic unit tests already exercise, so they are
            # excluded here too. The UI category is deliberately NOT excluded -
            # browsers are installed above precisely so those paths are counted.
            dotnet test "$proj" --no-build --configuration Release \
              --filter "TestCategory!=Chaos&TestCategory!=Coyote" \
              --collect:"XPlat Code Coverage" \
              --results-directory "coverage/${name}" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=${name}.trx"
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # Add a CODECOV_TOKEN repository secret (from the Codecov project
          # settings). fail_ci_if_error is left false so a transient upload
          # hiccup never fails the post-merge run.
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          fail_ci_if_error: false
