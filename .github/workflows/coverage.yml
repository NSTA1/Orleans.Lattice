name: Coverage

# Coverage is measured on main only. The README coverage badge reads the
# default branch's coverage from Codecov, and Codecov only learns main's
# coverage from an upload made on a main commit - so a post-merge push run is
# what keeps the badge live. This deliberately does NOT run on pull_request:
# the full non-chaos suite (every test/*.Tests.csproj, including the durable
# active-active and other Azurite integration tests) is expensive, and paying
# it on every PR would slow the PR feedback loop for no badge benefit. The
# change-scoped build-and-test job in ci.yml remains the PR gate.
on:
  push:
    branches: [main]
    # Only run when something that can actually move the coverage number changed.
    # This lane builds the whole solution and runs every non-chaos suite under
    # coverlet, including the Azurite integration tests and the browser UI suite,
    # so it is by far the most expensive workflow in the repository - and a
    # docs-only or workflow-only merge cannot change coverage by a single line.
    #
    # A genuine `paths` filter is safe here, unlike in ci.yml: that workflow's
    # build-and-test job is the required status check on main, so a filtered-out
    # run would never report and a pull request could never merge, which is why
    # it always runs and classifies the diff internally instead. Coverage gates
    # nothing, so a skipped run simply leaves the badge on its last value.
    #
    # test/** is included deliberately. Adding tests is the single most direct
    # way to change coverage, and this repository does it often in isolation: of
    # the last 60 commits on main, 8 touched test/** with no src/ or apps/ change
    # at all, and several were explicitly coverage-closing work. Filtering to
    # src/ and apps/ alone would have skipped the badge update for exactly the
    # commits whose purpose was to raise it.
    #
    # The root build files are included because they decide what is compiled and
    # therefore what is measured, and this workflow's own helper files are
    # included so a change to the lane itself is validated by running it.
    paths:
      - 'src/**'
      - 'apps/**'
      - 'test/**'
      - 'Directory.Build.targets'
      - 'Orleans.Lattice.slnx'
      - '.github/workflows/coverage.yml'
      - '.github/workflows/coverage-supersession.py'
      - '.github/workflows/failed-tests-filter.py'
      - '.github/workflows/ui-test-shards.json'
  # Manual trigger. Coverage is a post-merge lane, so without this there is no way
  # to re-run it after a transient failure, or to validate a change to the lane
  # itself on a branch before merging it - the change would have to land on main
  # unverified. It is also the escape hatch when the paths filter above skips a
  # merge whose coverage you nonetheless want re-measured. A dispatched run is the
  # newest run of this workflow when it is created, so the supersession gate below
  # lets it measure unless a newer run arrives behind it.
  workflow_dispatch:

# Least-privilege: this workflow only reads source and uploads a coverage report.
# The supersession job additionally reads this workflow's own run history.
permissions:
  contents: read

# Queue runs; never cancel one.
#
# This lane used `cancel-in-progress: true`. That is the right setting for a lane
# that gates a pull request and the wrong one here. A run takes about an hour and
# main routinely takes merges faster than that, so most runs were cancelled part
# way: of the 35 runs from #3327 to #3473, 22 were cancelled, spending 615
# runner-minutes measuring nothing against 708 for the 11 that completed. GitHub
# rolls a cancelled check run up as a FAILURE on its commit, so main showed a red
# cross on most of its commits although nothing had failed - indistinguishable at
# a glance from the lane being broken - and the two runs that genuinely failed
# were buried among them.
#
# `queue: max` lets every run that starts finish, and holds later runs first in,
# first out instead of cancelling them. On its own that would measure every commit
# one after another, and a burst of merges would leave the queue hours behind main.
# The supersession job below closes that gap: a queued run that reaches the front
# skips when a newer run of this workflow exists, because that run measures a later
# commit. The newest run never finds a newer one, so the latest state of main is
# always measured, behind at most the one run already in flight. The predicate,
# and why it fails open, are in coverage-supersession.py. GitHub rejects
# `queue: max` alongside `cancel-in-progress: true`, and
# CiCoverageLaneConcurrencyTests holds this shape in place.
concurrency:
  group: coverage-${{ github.ref }}
  queue: max

jobs:
  # Decides whether this run measures, or leaves it to a newer run of this workflow
  # on the same branch. It is cheap - a sparse checkout, one API call, one script -
  # which is what makes skipping a superseded run worth it: a skipped run costs this
  # job, a measured one costs the hour below.
  supersession:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To list this workflow's runs, which is all the gate reads.
      actions: read
    outputs:
      measure: ${{ steps.verdict.outputs.measure }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/workflows

      - name: Decide whether this run measures
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # GITHUB_WORKFLOW_REF is <owner>/<repo>/.github/workflows/<file>@<ref>.
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          runs="${RUNNER_TEMP}/coverage-runs.json"

          verdict=""
          if gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f branch="${GITHUB_REF_NAME}" -f per_page=100 -f exclude_pull_requests=true \
              > "$runs"; then
            verdict="$(python3 .github/workflows/coverage-supersession.py --run-id "$GITHUB_RUN_ID" "$runs")" \
              || verdict=""
          fi

          # Fail open. Measuring needlessly costs one run of this lane; skipping
          # wrongly leaves main unmeasured with nothing red to show for it.
          case "$verdict" in
            measure|skip) ;;
            *)
              echo "::warning::Could not decide whether a newer run supersedes this one, so this run measures."
              verdict=measure
              ;;
          esac

          if [ "$verdict" = skip ]; then
            echo "measure=false" >> "$GITHUB_OUTPUT"
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

  coverage:
    needs: supersession
    # Measure unless the gate positively decided that a newer run supersedes this one.
    # Only an explicit 'false' skips, so a missing verdict measures, and `!cancelled()`
    # keeps a failed gate job from blocking the measurement (it still turns the run
    # red, so the failure is not hidden).
    if: ${{ !cancelled() && needs.supersession.outputs.measure != 'false' }}
    runs-on: ubuntu-latest
    # A backstop, not a budget. Runs no longer cancel each other, so without it one
    # hung run would hold every queued run behind it for the six-hour default. The
    # suites carry their own ten-minute hang dumps below; this is about twice the
    # longest recent run (69 minutes).
    timeout-minutes: 150

    # Azurite supplies the local Azure Storage blob/queue/table endpoints that the
    # AzureStorageEmulator-category integration tests drive via
    # `UseDevelopmentStorage=true`, so their code paths are counted in coverage
    # rather than self-skipping. Mirrors the build-and-test job in ci.yml.
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Orleans.Lattice.slnx

      - name: Build
        run: dotnet build Orleans.Lattice.slnx --no-restore --configuration Release

      # The browser UI suite runs in this job too, so its code paths are counted
      # rather than self-skipping. It hosts the Explorer in-process on Kestrel,
      # so coverlet instruments the same process that serves the app and the
      # server-side render path is genuinely covered - not just the test code.
      # Browsers are cached on the project file, which is where the pinned
      # Microsoft.Playwright version lives.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/lattice.explorer.uitests/**/*.csproj') }}

      - name: Install Playwright chromium
        run: |
          set -euo pipefail
          script="$(find test/lattice.explorer.uitests/bin/Release -name playwright.ps1 -print -quit 2>/dev/null || true)"
          if [ -z "$script" ]; then
            echo "::error::playwright.ps1 not found - the UI test project did not build, so its coverage would be silently missing."
            exit 1
          fi
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            pwsh "$script" install-deps chromium
          else
            pwsh "$script" install chromium --with-deps
          fi

      - name: Wait for Azurite
        run: |
          for port in 10000 10001 10002; do
            for i in $(seq 1 30); do
              if (echo > "/dev/tcp/127.0.0.1/${port}") 2>/dev/null; then
                echo "Azurite port ${port} ready"; break
              fi
              if [ "$i" -eq 30 ]; then echo "::error::Azurite port ${port} not ready after 30s"; exit 1; fi
              sleep 1
            done
          done

      # The TLA+ toolchain for the `Tlc` category in test/lattice, which runs
      # TLC over spec/ and over a mutant generated from each definition in
      # spec/mutations/. See spec/README.md and issue #2323.
      #
      # This lane runs every non-chaos suite with the filter
      # `TestCategory!=Chaos&TestCategory!=Coyote`, which does NOT exclude
      # `Tlc`, and TlcModelCheckTests FAILS (never skips) when the toolchain is
      # absent under GITHUB_ACTIONS - deliberately, so a missing tool cannot
      # report a green model-checking gate that checked no model. Without these
      # two steps the whole Orleans.Lattice.Tests project failed here and its
      # coverage went missing. Mirrors the steps in ci.yml; the version and the
      # digest are pinned identically and `CiTlaToolchainProvisioningTests`
      # fails if any lane drifts from the others.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch TLA+ tools
        run: |
          set -euo pipefail
          mkdir -p tools
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output tools/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          # Pinned by digest, not merely by tag. A release asset can be replaced
          # in place, and an unverified jar on the classpath of a verification
          # gate is the one dependency where a silent substitution would be
          # least visible.
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tools/tla2tools.jar" \
            | sha256sum --check --strict

      - name: Test with coverage
        # The digest-settle integration oracles need a wider convergence budget
        # on a loaded runner; see the equivalent step in ci.yml for the rationale.
        env:
          LATTICE_DIGEST_SETTLE_TIMEOUT_MS: '60000'
        run: |
          set -uo pipefail
          # Exclude the benchmark/throughput test projects: microbench runs
          # BenchmarkDotNet harnesses (not library coverage) and
          # azure-throughput-silo is not part of Orleans.Lattice.slnx, so it is
          # not built by the step above. The standalone lattice.integration
          # project is intentionally included here.
          #
          # The pattern is '*Tests.csproj', not '*.Tests.csproj'. The browser UI
          # project is Orleans.Lattice.Explorer.UiTests.csproj, whose suffix is
          # '.UiTests.csproj' - it has no literal dot before 'Tests', so the
          # stricter glob silently skipped it and its coverage would have gone
          # missing without anything failing. Widening costs nothing: every
          # existing project matches either way.
          mapfile -t testProjs < <(find test -type f -name '*Tests.csproj' \
            -not -path '*/microbench/*' \
            -not -path '*/azure-throughput-silo/*' | sort)
          # Run every project even when one fails, then fail the step at the end.
          #
          # This loop used to run under `set -e`, so the first failing project
          # aborted the whole step: every later project went unmeasured and the
          # Codecov upload was skipped entirely, leaving the badge frozen on the
          # last good commit. One flaky suite therefore discarded the coverage of
          # all forty-odd others, which is the opposite of what this lane is for.
          # Collecting failures and reporting them together keeps a green project's
          # coverage even when a sibling is broken, and still fails the run.
          failed=()
          flaky=()

          runSuite() {
            local proj="$1" name="$2" label="$3" filter="$4"
            # Clear this suite's result file first, so that if the run dies without
            # producing one, the retry step finds nothing rather than reading a
            # stale file and retrying the wrong thing. A crashed or hung host is
            # exactly the case that must NOT be treated as a set of named failures.
            rm -f "coverage/${name}/${name}-${label}.trx"
            dotnet test "$proj" --no-build --configuration Release \
              --filter "$filter" \
              --collect:"XPlat Code Coverage" \
              --results-directory "coverage/${name}" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=${name}-${label}.trx"
          }

          # Retry exactly the tests that failed, once. Returns 0 when the retry
          # cleared them, non-zero when it did not or could not be attempted.
          #
          # Why this lane retries and the PR gate does not.
          #
          # This is the metrics lane: it exists to keep main's coverage report and
          # the README badge current, and `build-and-test` in ci.yml remains the
          # required correctness gate, running the same tests with no retries and
          # no instrumentation. What makes THIS lane different is that it runs the
          # whole suite under coverlet on a shared runner, which is materially
          # slower, and that is enough to push time-sensitive machinery past
          # internal deadlines it clears comfortably everywhere else - an Orleans
          # reminder service that "is still initializing and it is taking a long
          # time", a Blazor circuit, a browser relayout. Those failures say
          # something about the runner, not about the commit, and there are forty-odd
          # projects any of which can produce one.
          #
          # A whole-project rerun would be the blunt version of this and is worse on
          # both counts: it gives every OTHER test in that project a fresh chance to
          # flake, and it cannot tell which test was unstable. Retrying only the
          # named failures keeps the signal - two failures of the same test is a real
          # failure and still fails the run.
          #
          # The retry never silences anything: a test that only passes on the second
          # attempt is reported as flaky, in the log, as a warning annotation, and in
          # the job summary. Green-but-flaky is a visible state, not a hidden one.
          retryFailed() {
            local proj="$1" name="$2" label="$3"
            local trx="coverage/${name}/${name}-${label}.trx"

            if [ ! -f "$trx" ]; then
              echo "::notice::No trx at ${trx}; cannot identify which tests failed, so not retrying."
              return 1
            fi

            local filter
            if ! filter="$(python3 .github/workflows/failed-tests-filter.py "$trx")"; then
              echo "::notice::Could not read ${trx}; not retrying."
              return 1
            fi

            if [ -z "$filter" ]; then
              # The suite failed but recorded no failed test: a crash, a hang, or a
              # build/discovery problem. Retrying blind would tell us nothing.
              echo "::notice::${name} (${label}) failed without a named failing test; not retrying."
              return 1
            fi

            echo "Retrying the failed tests of ${name} (${label}) once: ${filter}"
            dotnet test "$proj" --no-build --configuration Release \
              --filter "$filter" \
              --collect:"XPlat Code Coverage" \
              --results-directory "coverage/${name}" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=${name}-${label}-retry.trx"
          }

          # Runs a suite and, if it fails, retries just its failures once.
          # Records the outcome into `failed` or `flaky`.
          runSuiteWithRetry() {
            local proj="$1" name="$2" label="$3" filter="$4"

            if runSuite "$proj" "$name" "$label" "$filter"; then
              return 0
            fi

            if retryFailed "$proj" "$name" "$label"; then
              echo "::warning::${name} (${label}) failed and then passed on retry - treating as FLAKY, not as a failure. It is still a defect; see the job summary."
              flaky+=("${name} (${label})")
              return 0
            fi

            return 1
          }

          for proj in "${testProjs[@]}"; do
            name=$(basename "$proj" .csproj)
            echo "::group::Coverage: $name"
            ok=true
            # Chaos tests are CI-only fault-injection and excluded here to keep
            # the coverage run deterministic; AzureStorageEmulator tests run
            # against the Azurite service above. Coyote systematic-concurrency
            # models run in their own opt-in CI tier and cover the same shared
            # cores the deterministic unit tests already exercise, so they are
            # excluded here too. The UI category is deliberately NOT excluded -
            # browsers are installed above precisely so those paths are counted.
            if [ "$name" = "Orleans.Lattice.Explorer.UiTests" ]; then
              # Shard the browser suite exactly as ui-tests.yml does, reading the
              # same ui-test-shards.json so the two lanes cannot drift.
              #
              # Sharding is not about speed here - the shards run sequentially - it
              # is about how many cases one in-process Explorer web head serves.
              # ui-tests.yml gives each shard its own runner, and therefore its own
              # head, because a single head serving the whole journey suite starts
              # failing cases with the shell never reporting itself measured: the
              # interactive circuit stops establishing under the accumulated load.
              # Running the whole suite in one `dotnet test` process here put every
              # case back on one head and reproduced exactly that, two cases timing
              # out after thirty seconds waiting for .lx-root[data-lx-measured].
              # A separate process per shard restores one head per shard.
              #
              # The three shards cover the whole project, so nothing is skipped by
              # not running it unfiltered as well: every filter selects
              # TestCategory=UI, and UiCategoryHygieneTests fails the build if any
              # [TestFixture] in this assembly lacks [Category("UI")] (with a
              # vacuity guard, so it cannot pass by scanning nothing). Within that,
              # structure takes the non-Journeys fixtures and journeys-a/journeys-b
              # partition the Journeys ones by complement.
              while IFS=$'\t' read -r shard filter; do
                runSuiteWithRetry "$proj" "$name" "$shard" "$filter" || ok=false
              done < <(jq -r '.[] | [.shard, .filter] | @tsv' .github/workflows/ui-test-shards.json)
            else
              runSuiteWithRetry "$proj" "$name" "all" \
                "TestCategory!=Chaos&TestCategory!=Coyote" || ok=false
            fi
            if [ "$ok" != true ]; then
              failed+=("$name")
              echo "::error::Coverage run failed for ${name}."
            fi
            echo "::endgroup::"
          done

          # Report flakes loudly even though they did not fail the run. A test that
          # only passes on the second attempt is still a defect; the point of the
          # retry is to stop it discarding the coverage report, not to pretend it
          # did not happen. Writing it to the job summary makes it visible without
          # anyone having to read the log.
          if [ ${#flaky[@]} -gt 0 ]; then
            {
              echo "### Flaky suites (passed only on retry)"
              echo
              echo "These failed once and passed when their failing tests were retried."
              echo "The run is green because this is the metrics lane, but each of these"
              echo "is a real instability worth fixing."
              echo
              for f in "${flaky[@]}"; do
                echo "- \`${f}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${#flaky[@]} suite(s) passed only on retry: ${flaky[*]}"
          fi

          if [ ${#failed[@]} -gt 0 ]; then
            {
              echo "### Failed suites"
              echo
              echo "These failed twice - once on the first run and again when only their"
              echo "failing tests were retried - so they are not being treated as flakes."
              echo
              for f in "${failed[@]}"; do
                echo "- \`${f}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Coverage failed for ${#failed[@]} project(s): ${failed[*]}"
            exit 1
          fi

      - name: Upload coverage to Codecov
        # Upload whatever was measured even when a project failed above. The
        # point of this lane is to keep main's coverage current; discarding a
        # complete report because one suite broke is how the badge went stale.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          # Add a CODECOV_TOKEN repository secret (from the Codecov project
          # settings). fail_ci_if_error is left false so a transient upload
          # hiccup never fails the post-merge run.
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          fail_ci_if_error: false
