name: CI

on:
  pull_request:
    branches: [main]

# Least-privilege: this workflow only reads source code.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history so the package-scope discovery step can
          # `git diff` against the PR base SHA. Shallow clone (the default)
          # would not have the base commit available.
          fetch-depth: 0

      # Classify what changed so we can skip expensive steps when the PR only
      # touches docs, or run a lightweight samples-only build when nothing
      # outside samples/ (plus docs) changed.
      #
      # Outputs:
      #   code       - at least one non-doc, non-benchmark file changed
      #                (any *.md / *.txt / docs/** / benchmark/** / apps/** /
      #                 reference-architecture/** / .github/workflows/** only
      #                 => false).
      #   nonSample  - at least one non-doc, non-benchmark, non-sample file changed.
      #   refArch    - at least one non-markdown file under
      #                reference-architecture/** changed (drives the isolated
      #                reference-architecture build/test lane below).
      #
      # *.txt is treated as documentation (the only tracked .txt files are the
      # root llms.txt index and a MAUI Raw resource that the ubuntu lane never
      # compiles), and .github/workflows/** is excluded because a CI/publish
      # workflow edit has no compileable surface for the library test matrix -
      # gating a full build/test on either would just burn runner minutes.
      #
      # Derived: samples-only == (code == 'true' && nonSample == 'false').
      #
      # benchmark/** is excluded because its projects (Silo/, Producer/,
      # infra/, scripts/) are not referenced from Orleans.Lattice.slnx and
      # are deployed/run by hand against a long-lived Azure VM
      # (see benchmark/azure-throughput/README.md). A benchmark-only PR has
      # no compileable surface for the library test matrix to cover, so
      # gating on it would just burn CI minutes running every package's
      # deterministic suite via the conservative no-match-found fallback.
      #
      # reference-architecture/** is excluded from `code`/`nonSample` (and
      # handled by its own `refArch` lane) because it is a standalone deployment
      # kit: its host projects and single test project are NOT in
      # Orleans.Lattice.slnx and reference the core library by published
      # PackageReference, not by ProjectReference into src/. Without the
      # exclusion, a reference-architecture-only change matches no src/<name>/
      # package and falls through to the conservative "test every package"
      # fallback - fanning a docs-and-IaC kit change out to the entire core
      # library matrix while never actually building the kit's own projects.
      # The dedicated lane below builds only the kit and runs only its tests.
      #
      # apps/** is excluded from `code`/`nonSample` (and handled by its own
      # `apps` lane) for the same reason as reference-architecture/**: the
      # container host apps (apps/repocontext, apps/embedding) map to no
      # src/<name>/ package, so an apps-only change matches nothing in the
      # per-package discovery step and would fall through to the conservative
      # "test every package" fallback - fanning a Docker-host edit out to the
      # entire core library matrix. Unlike the reference-architecture kit, the
      # repocontext host IS in Orleans.Lattice.slnx and references src/ by
      # ProjectReference, and it is covered by test/lattice.api.mcp.repocontext
      # (which references the host via InternalsVisibleTo + ProjectReference), so
      # it must still be compile-checked and its covering tests run. The
      # dedicated lane below builds each changed app's csproj and runs every test
      # project that covers it - both a *.Tests.csproj under the app and a
      # test/<pkg>/ project that ProjectReferences the changed app - instead of
      # rebuilding and testing every package. An app with no csproj (e.g.
      # apps/embedding, a pure Dockerfile build) is a clean no-op there.
      #
      # NOTE: patterns must use '**/*.md' for recursive markdown matching.
      # picomatch (the matcher dorny/paths-filter uses) only treats '**' as a
      # globstar when it stands alone as a path segment - '**.md' degrades to
      # '*.md' and silently fails to match nested files like
      # 'docs/lattice/observability.md', defeating the docs-only skip.
      - name: Check for non-markdown changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!benchmark/**'
              - '!apps/**'
              - '!reference-architecture/**'
              - '!.github/workflows/**'
            nonSample:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!benchmark/**'
              - '!apps/**'
              - '!reference-architecture/**'
              - '!.github/workflows/**'
              - '!samples/**'
            refArch:
              - 'reference-architecture/**'
              - '!reference-architecture/**/*.md'
            apps:
              - 'apps/**'
              - '!apps/**/*.md'

      # Auto-discover packages by convention: each subdirectory of `src/`
      # is a package; tests live at `test/{name}/`; docs at `docs/{name}/`.
      # A package is in scope when any **non-markdown** file under one of
      # those three subtrees changed. Markdown-only edits (e.g. a design
      # note) skip that package's test run - the top-level `nonSample`
      # filter already gates the whole job on at least one non-doc edit
      # somewhere in the tree, but per-package discovery without the
      # extension filter would still pull a heavy package's chaos suite into
      # CI for a markdown-only edit inside its subtree. When no package
      # matched (e.g. the PR only edits `Orleans.Lattice.slnx` or a shared
      # root file) we conservatively test every discovered package.
      #
      # Rationale for not using dorny/paths-filter here: its filter set is
      # static YAML, so adding a new src/{name}/ folder would still require
      # a workflow edit. The bash discovery below picks up new packages
      # automatically.
      - name: Discover changed packages
        id: discover
        if: steps.filter.outputs.nonSample == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          packages=()
          for dir in src/*/; do
            packages+=("$(basename "$dir")")
          done
          echo "Discovered packages: ${packages[*]}"

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          matched=()
          for name in "${packages[@]}"; do
            # Match files under src/<name>/, test/<name>/, or docs/<name>/
            # whose extension is not .md. A package whose only change is a
            # markdown file (design note, etc.) is not pulled into
            # the test matrix - its expensive suites (e.g. chaos) would add
            # minutes of CI runtime for a docs edit.
            #
            # NOTE: the downstream grep must NOT use `-q`. Under
            # `set -o pipefail`, an early-exiting `grep -q` causes the
            # upstream `grep -E` to receive SIGPIPE on its next write,
            # which GNU grep reports as `write error: Broken pipe` and
            # exit status 141. `pipefail` then propagates 141 as the
            # pipeline's status, making the `if` skip the body - so the
            # package with the largest matching diff (the one whose
            # upstream grep is still flushing when the downstream exits)
            # gets silently dropped from the test matrix. Letting the
            # downstream grep read to EOF (no `-q`, redirect output to
            # /dev/null) keeps the conditional driven solely by grep's
            # match/no-match exit status (0 / 1) and avoids the race.
            if echo "$changed" \
                 | grep -E "^(src|test|docs)/${name}/" \
                 | grep -vE '\.md$' > /dev/null; then
              matched+=("$name")
            fi
          done

          if [ ${#matched[@]} -eq 0 ]; then
            matched=("${packages[@]}")
            echo "No package-scoped changes detected; testing all packages."
            # A shared/root change (e.g. Orleans.Lattice.slnx or
            # Directory.Packages.props) fans out to every package. Signal the
            # Build step to compile the whole solution in one invocation rather
            # than looping project-by-project - a single solution build is
            # faster than N separate builds when the fan-out is total.
            echo "build_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_all=false" >> "$GITHUB_OUTPUT"
          fi

          # Always test lattice.dashboards. The bundled Grafana dashboards chart
          # metric instruments owned by OTHER packages' meters (the core
          # `orleans.lattice` meter and the `orleans.lattice.replication` meter),
          # and its drift guards in test/lattice.dashboards/DashboardJsonTests.cs
          # assert BOTH directions: every live instrument is referenced by at
          # least one panel, and every panel token resolves to a live instrument.
          # Those guards must therefore run whenever any meter could have changed
          # - e.g. adding a counter in src/lattice.replication/ - not only when a
          # dashboards-owned file changes. Under the package-scoped matrix a new
          # unpaneled counter in another package would otherwise never trip the
          # guard (the dashboards suite is not in `matched`), which is exactly how
          # such a gap can reach main. The suite is tiny and fast, so always
          # including it costs negligibly while closing the cross-package hole.
          if [ -d "test/lattice.dashboards" ]; then
            case " ${matched[*]} " in
              *" lattice.dashboards "*) ;;
              *) matched+=("lattice.dashboards") ;;
            esac
          fi

          echo "to_test=${matched[*]}" >> "$GITHUB_OUTPUT"
          echo "Packages to test: ${matched[*]}"

      - name: Setup .NET
        if: steps.filter.outputs.code == 'true' || steps.filter.outputs.refArch == 'true' || steps.filter.outputs.apps == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Cache ~/.nuget/packages between runs.
      - name: Cache NuGet packages
        if: steps.filter.outputs.code == 'true' || steps.filter.outputs.refArch == 'true' || steps.filter.outputs.apps == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Samples-only fast path: build (and test) each sample under samples/.
      # The samples reference the library as a ProjectReference, so this
      # transitively compiles Orleans.Lattice too - enough to catch breaks
      # introduced by sample-side edits without paying for the full library
      # test matrix.
      #
      # Per-sample change scoping:
      #   The loop processes only the `samples/<name>/` directories that have
      #   at least one non-markdown change between the PR base and head SHAs.
      #   Markdown-only edits inside a sample (e.g. README.md) do not trigger
      #   a rebuild - they cannot break the build, and pulling a heavyweight
      #   sample's integration suite into CI for a docs edit wastes runner
      #   minutes. This mirrors the per-package discovery convention used
      #   above for `src/{name}/` ↔ `test/{name}/`.
      #
      #   When no per-sample match is found (e.g. a shared file under
      #   `samples/` that doesn't belong to any specific sample), the loop
      #   falls back to processing every sample, matching the conservative
      #   fallback in the per-package discovery step.
      #
      # Per-sample dispatch:
      #   1. If `samples/<name>/*.slnx` exists, build that solution. This is
      #      the right path for multi-project samples (e.g. MultiSiteManufacturing,
      #      VehicleFleetSimulator) where the sample owns its own slnx.
      #   2. Otherwise, build every `*.csproj` found anywhere under the sample
      #      directory. This handles single-project samples (e.g. HelloWorld).
      #
      # Test execution: after each sample is built, every `*.Tests.csproj`
      # discovered under the sample directory is run with `--no-build` and
      # the deterministic-only filter (chaos category excluded - samples are
      # not the place to gate CI on flake-prone surface). Trx files are
      # namespaced by sample so the upload artifact is browsable.
      #
      # NOTE: bash's `**` does not recurse without `shopt -s globstar`, so
      # the previous `samples/**/*.csproj` glob silently missed nested csprojs.
      # The slnx-first / `find`-fallback dispatch below avoids that footgun.
      - name: Build and test samples (samples-only change)
        if: steps.filter.outputs.code == 'true' && steps.filter.outputs.nonSample != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          allSamples=(samples/*/)
          if [ ${#allSamples[@]} -eq 0 ]; then
            echo "No samples found under samples/."
            exit 1
          fi

          # Per-sample change detection: only act on samples whose tree has at
          # least one non-markdown change between BASE_SHA and HEAD_SHA. The
          # diff is computed once and filtered per-sample below.
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          samples=()
          for sampleDir in "${allSamples[@]}"; do
            sampleName=$(basename "$sampleDir")
            # Match files under samples/<name>/ whose extension is not .md.
            # A sample whose only change is a markdown file (README, plan,
            # etc.) is not pulled into the build matrix - its expensive
            # build/test sequence would add minutes of CI runtime for a docs
            # edit.
            #
            # See the package-discovery comment above for why the
            # downstream grep must not use `-q` under `set -o pipefail`.
            if echo "$changed" \
                 | grep -E "^samples/${sampleName}/" \
                 | grep -vE '\.md$' > /dev/null; then
              samples+=("$sampleDir")
            fi
          done

          if [ ${#samples[@]} -eq 0 ]; then
            samples=("${allSamples[@]}")
            echo "No per-sample changes detected; building every sample."
          else
            echo "Per-sample changes detected; building only:"
            printf '  %s\n' "${samples[@]}"
          fi

          for sampleDir in "${samples[@]}"; do
            sampleName=$(basename "$sampleDir")

            echo "::group::Build sample: $sampleName"
            slnxFiles=("${sampleDir}"*.slnx)
            if [ ${#slnxFiles[@]} -gt 0 ]; then
              echo "Building solution: ${slnxFiles[0]}"
              dotnet build "${slnxFiles[0]}" --configuration Release
            else
              mapfile -t csprojs < <(find "$sampleDir" -type f -name '*.csproj')
              if [ ${#csprojs[@]} -eq 0 ]; then
                echo "::notice::Sample $sampleName has no slnx and no csproj - skipping."
                echo "::endgroup::"
                continue
              fi
              for proj in "${csprojs[@]}"; do
                echo "Building project: $proj"
                dotnet build "$proj" --configuration Release
              done
            fi
            echo "::endgroup::"

            mapfile -t testProjs < <(find "$sampleDir" -type f -name '*.Tests.csproj')
            if [ ${#testProjs[@]} -eq 0 ]; then
              echo "::notice::No test projects under $sampleDir - skipping tests."
              continue
            fi
            for testProj in "${testProjs[@]}"; do
              testName=$(basename "$testProj" .csproj)
              echo "::group::Test sample: $sampleName / $testName"
              dotnet test "$testProj" --no-build --configuration Release \
                --filter "TestCategory!=Chaos&TestCategory!=AzureTableEmulator" \
                --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
                --logger "trx;LogFileName=samples-${sampleName}-${testName}.trx"
              echo "::endgroup::"
            done
          done

      # Isolated reference-architecture lane. Runs only when a non-markdown file
      # under reference-architecture/** changed (refArch), independently of the
      # core library matrix above. The kit is not in Orleans.Lattice.slnx and
      # references the core library by published PackageReference, so building it
      # is self-contained and does not compile or test any src/ package. Build
      # every kit csproj (the silo / MCP / Explorer / hosting-common projects and
      # the hosting test project) so a host-side or bicep-adjacent change is
      # compile-checked, then run the kit's own test project(s), deterministic
      # only (chaos and Azure-emulator categories excluded, mirroring the samples
      # lane). bin/obj are pruned so stale build outputs are never picked up.
      - name: Build and test reference architecture (reference-architecture change)
        if: steps.filter.outputs.refArch == 'true'
        run: |
          set -euo pipefail

          mapfile -t csprojs < <(find reference-architecture -type f -name '*.csproj' \
            -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          if [ ${#csprojs[@]} -eq 0 ]; then
            echo "::notice::No reference-architecture csproj found - nothing to build."
            exit 0
          fi
          for proj in "${csprojs[@]}"; do
            echo "::group::Build $proj"
            dotnet build "$proj" --configuration Release
            echo "::endgroup::"
          done

          mapfile -t testProjs < <(find reference-architecture -type f -name '*.Tests.csproj' \
            -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          if [ ${#testProjs[@]} -eq 0 ]; then
            echo "::notice::No reference-architecture test projects - skipping tests."
            exit 0
          fi
          for testProj in "${testProjs[@]}"; do
            testName=$(basename "$testProj" .csproj)
            echo "::group::Test $testName"
            dotnet test "$testProj" --no-build --configuration Release \
              --filter "TestCategory!=Chaos&TestCategory!=AzureTableEmulator" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=refarch-${testName}.trx"
            echo "::endgroup::"
          done

      # Isolated apps lane. Runs only when a non-markdown file under apps/**
      # changed (apps), independently of the core library matrix. The container
      # host apps map to no src/<name>/ package (see the classification comment
      # at the top of this job), so a change under apps/ is compile-checked and
      # covered here instead of fanning out to every package. For each changed
      # apps/<name>/ directory: build every csproj it owns (the repocontext host
      # references src/ by ProjectReference, so this transitively compiles the
      # core library too), then run every test project that covers a changed app
      # - both a *.Tests.csproj living under the app directory and any
      # test/**/ *.Tests.csproj that ProjectReferences a changed app csproj (e.g.
      # test/lattice.api.mcp.repocontext covers apps/repocontext). Deterministic
      # only (chaos and Azure-emulator categories excluded), mirroring the
      # samples and reference-architecture lanes. An app with no csproj (e.g.
      # apps/embedding, a pure Dockerfile build) and an app with no covering test
      # are both clean no-ops in their respective phases.
      - name: Build and test apps (apps change)
        if: steps.filter.outputs.apps == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LATTICE_DIGEST_SETTLE_TIMEOUT_MS: '60000'
        run: |
          set -euo pipefail

          # Resolve which apps/<name>/ directories have a non-markdown change.
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          mapfile -t appDirs < <(echo "$changed" \
            | grep -E '^apps/[^/]+/' \
            | grep -vE '\.md$' \
            | sed -E 's#^(apps/[^/]+)/.*#\1#' \
            | sort -u || true)
          if [ ${#appDirs[@]} -eq 0 ]; then
            echo "::notice::No non-markdown apps change resolved to an app directory - nothing to build."
            exit 0
          fi
          echo "Changed app directories: ${appDirs[*]}"

          # Build each changed app's csproj(s). ProjectReferences into src/ mean
          # this compile-checks the host and the core projects it consumes.
          appProjs=()
          for appDir in "${appDirs[@]}"; do
            while IFS= read -r p; do
              [ -n "$p" ] && appProjs+=("$p")
            done < <(find "$appDir" -type f -name '*.csproj' \
              -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          done
          if [ ${#appProjs[@]} -eq 0 ]; then
            echo "::notice::No csproj under the changed app directories (pure Dockerfile build) - nothing to compile."
          else
            for proj in "${appProjs[@]}"; do
              echo "::group::Build $proj"
              dotnet build "$proj" --configuration Release
              echo "::endgroup::"
            done
          fi

          # Collect covering test projects: any *.Tests.csproj under a changed
          # app directory, plus any test/**/ *.Tests.csproj that ProjectReferences
          # a changed app's csproj (matched by csproj file name).
          testProjs=()
          for appDir in "${appDirs[@]}"; do
            while IFS= read -r t; do
              [ -n "$t" ] && testProjs+=("$t")
            done < <(find "$appDir" -type f -name '*.Tests.csproj' \
              -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          done
          for proj in "${appProjs[@]}"; do
            projFile=$(basename "$proj")
            while IFS= read -r t; do
              [ -n "$t" ] && testProjs+=("$t")
            done < <(grep -rlF "$projFile" test --include='*.Tests.csproj' 2>/dev/null | sort -u || true)
          done
          if [ ${#testProjs[@]} -eq 0 ]; then
            echo "::notice::No test project covers the changed apps - build-only."
            exit 0
          fi
          mapfile -t testProjs < <(printf '%s\n' "${testProjs[@]}" | sort -u)
          echo "Covering test projects: ${testProjs[*]}"

          for testProj in "${testProjs[@]}"; do
            testName=$(basename "$testProj" .csproj)
            echo "::group::Build $testName"
            dotnet build "$testProj" --configuration Release
            echo "::endgroup::"
            echo "::group::Test $testName"
            dotnet test "$testProj" --no-build --configuration Release \
              --filter "TestCategory!=Chaos&TestCategory!=AzureTableEmulator" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=apps-${testName}.trx"
            echo "::endgroup::"
          done

      - name: Restore
        if: steps.filter.outputs.nonSample == 'true'
        run: dotnet restore

      # Whole-solution build, used only when a shared/root change fanned the
      # test matrix out to every package (build_all=true). One solution build
      # is faster than looping every project separately.
      - name: Build (all packages - shared/root change)
        if: steps.filter.outputs.nonSample == 'true' && steps.discover.outputs.build_all == 'true'
        run: dotnet build --no-restore --configuration Release

      # Selective build: compile only the in-scope packages. Building each
      # package's test project transitively compiles its src project (and its
      # dependency graph) in Release, which is exactly what the downstream
      # `dotnet test --no-build` steps consume. Packages with no test project
      # fall back to building the src csproj directly so a src-only change is
      # still compile-checked. This mirrors the per-package test scoping - a PR
      # that touches one package no longer pays to rebuild the whole solution.
      - name: Build changed packages
        if: steps.filter.outputs.nonSample == 'true' && steps.discover.outputs.build_all != 'true'
        run: |
          set -euo pipefail
          for name in ${{ steps.discover.outputs.to_test }}; do
            testProj=$(ls "test/${name}"/*.Tests.csproj 2>/dev/null | head -n 1 || true)
            if [ -n "$testProj" ]; then
              echo "::group::Build ${name} (test project -> transitively builds src)"
              dotnet build "$testProj" --no-restore --configuration Release
              echo "::endgroup::"
              continue
            fi
            srcProj=$(ls "src/${name}"/*.csproj 2>/dev/null | head -n 1 || true)
            if [ -n "$srcProj" ]; then
              echo "::group::Build ${name} (src project - no test project)"
              dotnet build "$srcProj" --no-restore --configuration Release
              echo "::endgroup::"
            else
              echo "::notice::No csproj found for ${name} - nothing to build."
            fi
          done

      # Per-package test execution. Two separate top-level steps preserve the
      # chaos-first / deterministic split from the previous static layout: all
      # in-scope packages run their chaos suite first, then their deterministic
      # suite. A failure in either step short-circuits the next via the default
      # `success()` gate on subsequent steps. Per-package trx files keep test
      # results identifiable in the upload artifact.
      #
      # Convention: tests at `test/{name}/*.Tests.csproj`. A discovered package
      # without a matching test project is silently skipped (e.g. a future
      # `src/foo/` that has no `test/foo/`).
      - name: Test changed packages (chaos first - isolate flaky-prone surface)
        if: steps.filter.outputs.nonSample == 'true'
        # See the deterministic step below for why the digest-settle
        # convergence budget is widened on a loaded CI runner via
        # LATTICE_DIGEST_SETTLE_TIMEOUT_MS. The chaos digest suite leans on
        # the same settle helper under even heavier fault-injection load.
        env:
          LATTICE_DIGEST_SETTLE_TIMEOUT_MS: '60000'
        run: |
          set -euo pipefail
          for name in ${{ steps.discover.outputs.to_test }}; do
            proj=$(ls "test/${name}"/*.Tests.csproj 2>/dev/null | head -n 1 || true)
            if [ -z "$proj" ]; then
              echo "::notice::No test project under test/${name}/ - skipping."
              continue
            fi
            echo "::group::Test ${name} (chaos)"
            dotnet test "$proj" --no-build --configuration Release \
              --filter "TestCategory=Chaos" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=${name}-chaos.trx"
            echo "::endgroup::"
          done

      - name: Test changed packages (deterministic)
        if: steps.filter.outputs.nonSample == 'true'
        # The leaf-side projection-digest publish is coalesced behind a
        # short one-shot grain timer, so the digest-settle integration
        # oracles poll the chained-fold aggregate until it converges to
        # the authoritative live count. Under full-suite parallel load a
        # post-split aggregate can transiently overshoot (a new leaf's
        # count folds in before the donor's corrective reduction is
        # scheduled off the backlogged grain-call queue) and take longer
        # than the 20s default to settle. The settle helper exposes
        # LATTICE_DIGEST_SETTLE_TIMEOUT_MS precisely so a saturated runner
        # can grant a longer convergence budget; wire it here. This does
        # not mask a real convergence bug - a digest that settles on a
        # wrong value still fails, it only grants more wall-clock time for
        # a correct-but-slow convergence on a loaded runner.
        env:
          LATTICE_DIGEST_SETTLE_TIMEOUT_MS: '60000'
        run: |
          set -euo pipefail
          for name in ${{ steps.discover.outputs.to_test }}; do
            proj=$(ls "test/${name}"/*.Tests.csproj 2>/dev/null | head -n 1 || true)
            if [ -z "$proj" ]; then
              continue
            fi
            echo "::group::Test ${name} (deterministic)"
            dotnet test "$proj" --no-build --configuration Release \
              --filter "TestCategory!=Chaos&TestCategory!=AzureTableEmulator" \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger "trx;LogFileName=${name}-results.trx"
            echo "::endgroup::"
          done

      # Upload test results even if the Test step fails. Gated on `code`,
      # `refArch`, or `apps` rather than `nonSample` so trx files produced by the
      # samples-only path, the reference-architecture lane, and the apps lane are
      # also captured.
      - name: Upload test results
        if: always() && (steps.filter.outputs.code == 'true' || steps.filter.outputs.refArch == 'true' || steps.filter.outputs.apps == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          # Include blame-hang crash dumps (*.dmp) and the sequence file
          # alongside the trx logs so a hung test can be diagnosed from the
          # captured process state, not just inferred from a missing result.
          path: |
            **/*.trx
            **/*.dmp
            **/Sequence_*.xml
