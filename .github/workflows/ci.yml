name: CI

on:
  pull_request:
    branches: [main]

# Least-privilege: this workflow only reads source code.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the package-scope discovery step can
          # `git diff` against the PR base SHA. Shallow clone (the default)
          # would not have the base commit available.
          fetch-depth: 0

      # Classify what changed so we can skip expensive steps when the PR only
      # touches docs, or run a lightweight samples-only build when nothing
      # outside samples/ (plus docs) changed.
      #
      # Outputs:
      #   code       — at least one non-doc file changed (any *.md / docs/** only => false).
      #   nonSample  — at least one non-doc, non-sample file changed.
      #
      # Derived: samples-only == (code == 'true' && nonSample == 'false').
      #
      # NOTE: patterns must use '**/*.md' for recursive markdown matching.
      # picomatch (the matcher dorny/paths-filter uses) only treats '**' as a
      # globstar when it stands alone as a path segment — '**.md' degrades to
      # '*.md' and silently fails to match nested files like
      # 'src/lattice/roadmap.md', defeating the docs-only skip.
      - name: Check for non-markdown changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
            nonSample:
              - '!**/*.md'
              - '!docs/**'
              - '!samples/**'

      # Auto-discover packages by convention: each subdirectory of `src/`
      # is a package; tests live at `test/{name}/`; docs at `docs/{name}/`.
      # A package is in scope when any file under one of those three
      # subtrees changed. When no package matched (e.g. the PR only edits
      # Orleans.Lattice.slnx or a shared root file) we conservatively test
      # every discovered package.
      #
      # Rationale for not using dorny/paths-filter here: its filter set is
      # static YAML, so adding a new src/{name}/ folder would still require
      # a workflow edit. The bash discovery below picks up new packages
      # automatically.
      - name: Discover changed packages
        id: discover
        if: steps.filter.outputs.nonSample == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          packages=()
          for dir in src/*/; do
            packages+=("$(basename "$dir")")
          done
          echo "Discovered packages: ${packages[*]}"

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          matched=()
          for name in "${packages[@]}"; do
            if echo "$changed" | grep -qE "^(src|test|docs)/${name}/"; then
              matched+=("$name")
            fi
          done

          if [ ${#matched[@]} -eq 0 ]; then
            matched=("${packages[@]}")
            echo "No package-scoped changes detected; testing all packages."
          fi

          echo "to_test=${matched[*]}" >> "$GITHUB_OUTPUT"
          echo "Packages to test: ${matched[*]}"

      - name: Setup .NET
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Cache ~/.nuget/packages between runs.
      - name: Cache NuGet packages
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Samples-only fast path: build every project under samples/ and stop.
      # The samples reference the library as a ProjectReference, so this
      # transitively compiles Orleans.Lattice too — enough to catch breaks
      # introduced by sample-side edits without paying for the full test suite.
      - name: Build samples (samples-only change)
        if: steps.filter.outputs.code == 'true' && steps.filter.outputs.nonSample != 'true'
        run: |
          shopt -s nullglob
          projects=(samples/**/*.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "No sample projects found under samples/."
            exit 1
          fi
          for proj in "${projects[@]}"; do
            echo "::group::Build $proj"
            dotnet build "$proj" --configuration Release
            echo "::endgroup::"
          done

      - name: Restore
        if: steps.filter.outputs.nonSample == 'true'
        run: dotnet restore

      - name: Build
        if: steps.filter.outputs.nonSample == 'true'
        run: dotnet build --no-restore --configuration Release

      # Per-package test execution. Two separate top-level steps preserve the
      # chaos-first / deterministic split from the previous static layout: all
      # in-scope packages run their chaos suite first, then their deterministic
      # suite. A failure in either step short-circuits the next via the default
      # `success()` gate on subsequent steps. Per-package trx files keep test
      # results identifiable in the upload artifact.
      #
      # Convention: tests at `test/{name}/*.Tests.csproj`. A discovered package
      # without a matching test project is silently skipped (e.g. a future
      # `src/foo/` that has no `test/foo/`).
      - name: Test changed packages (chaos first — isolate flaky-prone surface)
        if: steps.filter.outputs.nonSample == 'true'
        run: |
          set -euo pipefail
          for name in ${{ steps.discover.outputs.to_test }}; do
            proj=$(ls "test/${name}"/*.Tests.csproj 2>/dev/null | head -n 1 || true)
            if [ -z "$proj" ]; then
              echo "::notice::No test project under test/${name}/ — skipping."
              continue
            fi
            echo "::group::Test ${name} (chaos)"
            dotnet test "$proj" --no-build --configuration Release \
              --filter "TestCategory=Chaos" \
              --logger "trx;LogFileName=${name}-chaos.trx"
            echo "::endgroup::"
          done

      - name: Test changed packages (deterministic)
        if: steps.filter.outputs.nonSample == 'true'
        run: |
          set -euo pipefail
          for name in ${{ steps.discover.outputs.to_test }}; do
            proj=$(ls "test/${name}"/*.Tests.csproj 2>/dev/null | head -n 1 || true)
            if [ -z "$proj" ]; then
              continue
            fi
            echo "::group::Test ${name} (deterministic)"
            dotnet test "$proj" --no-build --configuration Release \
              --filter "TestCategory!=Chaos" \
              --logger "trx;LogFileName=${name}-results.trx"
            echo "::endgroup::"
          done

      # Upload test results even if the Test step fails.
      - name: Upload test results
        if: always() && steps.filter.outputs.nonSample == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
