name: Videos

# Advisory (non-required) lane for the `videos/` HyperFrames workspace - the
# educational video series (see videos/README.md). A change there matches no
# package, so ci.yml carves `videos/**` out of its package selection rather than
# fanning out to the full test suite; this lane is what checks the workspace
# instead. The repository's content gates (em-dash, mojibake) still scan every
# file under `videos/` from ci.yml, so a stray character fails there as well as
# in this lane's ASCII check.
on:
  pull_request:
    # Branch list mirrors ci.yml; the rationale for the '*/epic/**' and
    # 'release/**' patterns is documented there and in
    # .github/copilot-instructions.md, and is not restated here.
    branches: [main, '*/epic/**', 'release/**']
    # The workspace reads the docs site's design system (docs-site/template/public
    # and docs-site/figures), its home page's words (docs-site/pages) and the
    # package catalogue (PACKAGES.md), so a change to any of them is re-checked
    # here too.
    paths:
      - 'videos/**'
      - 'docs/videos/**'
      - 'docs-site/template/public/**'
      - 'docs-site/figures/**'
      - 'docs-site/pages/**'
      - 'docs-site/media/**'
      - 'PACKAGES.md'
      - '.github/workflows/videos.yml'

  # Integration-branch lane, mirroring ci.yml's push trigger (#2972). ADVISORY,
  # AND IT MUST NEVER BECOME BRANCH PROTECTION. As in ui-tests.yml, a push
  # `paths:` filter is evaluated against the push diff, so on a bucket this runs
  # only when the member that just merged touched the workspace. The glob also
  # matches MEMBER branches (`<type>/epic/<bucket>-<item>`), whose own
  # pull_request run already gates them; the `plan` job below classifies the
  # pushed ref and the workspace job skips on a member push (#4260).
  push:
    branches: ['*/epic/**']
    paths:
      - 'videos/**'
      - 'docs/videos/**'
      - 'docs-site/template/public/**'
      - 'docs-site/figures/**'
      - 'docs-site/pages/**'
      - 'docs-site/media/**'
      - 'PACKAGES.md'
      - '.github/workflows/videos.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Member-push classifier (#4260). The '*/epic/**' push trigger cannot tell a
  # bucket `<type>/epic/<bucket>` from its member `<type>/epic/<bucket>-<item>`,
  # and no glob can, so without this every push to a member pull request would
  # re-run the whole workspace check on top of the pull_request run that
  # already gates the same commit.
  #
  # The script is ci.yml's `pushref` step, which is the SOURCE OF TRUTH for the
  # rule and documents it (and its one residual false positive) at length. Do
  # not edit it here alone: CiIntegrationBranchTriggerTests fails the build
  # when this copy and ci.yml's differ.
  #
  # On pull_request and workflow_dispatch the steps do not run, the output is
  # empty, and `!= 'true'` below lets the workspace job run exactly as before;
  # a bucket (non-member) push classifies as `false` and also runs it.
  plan:
    name: Classify pushed ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      push_is_member: ${{ steps.pushref.outputs.member }}
    steps:
      # Only the remote's heads are read, so a one-commit sparse checkout
      # suffices to give `git ls-remote` an `origin`.
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          fetch-depth: 1
          sparse-checkout: .github

      - name: Classify the pushed integration ref
        id: pushref
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          member=false
          parent=""

          while read -r _sha ref; do
            branch="${ref#refs/heads/}"

            # A proper prefix, and the very next character is the `-` separator.
            case "$BRANCH" in
              "$branch"-*)
                if [ "$branch" != "$BRANCH" ]; then
                  member=true
                  parent="$branch"
                fi
                ;;
            esac
          done < <(git ls-remote --heads origin)

          echo "member=$member" >> "$GITHUB_OUTPUT"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"

          if [ "$member" = "true" ]; then
            echo "Pushed ref '$BRANCH' extends integration branch '$parent'; treating it as a member."
          else
            echo "Pushed ref '$BRANCH' extends no existing branch; treating it as an integration branch."
          fi

  workspace:
    needs: plan
    if: needs.plan.outputs.push_is_member != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: videos

    # The same quiet environment tools/hf.js applies, set here as well so that
    # nothing in this job can reach HyperFrames telemetry, the update check, or
    # a skill install, whichever way the CLI is started.
    env:
      HYPERFRAMES_NO_TELEMETRY: '1'
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
      HYPERFRAMES_SKIP_SKILLS: '1'
      DO_NOT_TRACK: '1'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: videos/package-lock.json

      # The renderer encodes with the system FFmpeg.
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install the pinned workspace toolchain
        run: npm ci

      - name: Unit tests for the workspace tools
        run: npm test

      - name: Plain ASCII
        run: npm run ascii

      # Code shown on screen must match the compiled snippets on the companion
      # pages under docs/videos/, which the repository's Roslyn harness builds.
      - name: Snippets match their companion pages
        run: npm run snippets:check

      # Each companion page carries its episode's video block (what the docs
      # site lists and plays) and its transcript, word for word as the script
      # has it; both are written from the episode.
      - name: Companion pages match their episodes
        run: npm run companions:check

      # The plan as data (series.json) must agree with its prose (series.md),
      # and what is published must be a gapless run of its production order.
      # ci.yml runs the same check in the required path; here it sits with the
      # rest of the workspace's checks.
      - name: The series plan and its order
        run: npm run series -- check

      # Each published episode's closing scene names what the plan says comes
      # next and the deep dive it leads to, by their titles in the plan.
      - name: Endings name what the plan says they lead to
        run: npm run series -- endings

      - name: Lint the smoke test
        run: npm run lint

      # Downloaded explicitly so a network failure is reported as itself rather
      # than as a failed check.
      - name: Fetch the rendering browser
        run: node tools/hf.js browser ensure

      # Lint, runtime, layout, motion and WCAG AA contrast on the smoke test.
      - name: Check the workspace smoke test
        run: npm run check

      # The same check on every episode. Narration audio is never committed (a
      # published episode's MP4 carries its sound), so each episode is checked
      # against silence of its stamped length: its pictures, timing and
      # structure, not its sound.
      - name: Check every episode
        run: npm run check:episodes

      - name: Draft-render the smoke test
        run: npm run render -- --quality draft --workers 1 -o renders/smoke.mp4

      - name: Upload the draft render
        uses: actions/upload-artifact@v6
        with:
          name: videos-smoke-render
          path: videos/renders/smoke.mp4
          if-no-files-found: error
          retention-days: 7
