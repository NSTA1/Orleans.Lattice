name: Publish

on:
  push:
    tags:
      # Convention: <src-folder-name>-v<X.Y.Z>[-suffix]
      # Examples:
      #   lattice-v3.3.0
      #   lattice.replication-v3.3.0
      #   lattice.replication.grpc-v3.3.0
      #   lattice.storage.azuretable-v3.3.0
      #   lattice.dashboards-v3.3.0
      #   lattice.api.state-v3.3.0
      #   lattice.api.state.grpc-v3.3.0
      #   lattice.membership-v7.8.0
      #   lattice.membership.entra-v7.8.0
      #   lattice.membership.entra.graph-v7.8.0
      #   lattice.auth-v7.8.0
      #   lattice.api.auth-v7.8.0
      #   lattice.api.auth.grpc-v7.8.0
      #   lattice.api.data-v7.8.0
      #   lattice.api.data.grpc-v7.8.0
      #   lattice.backup-v7.9.0
      #   lattice.backup.azureblob-v7.9.0
      #   lattice.api.backup-v7.9.0
      #   lattice.api.backup.grpc-v7.9.0
      # The tag prefix is the literal folder name under src/, dots and all.
      - 'lattice-v*'
      - 'lattice.replication-v*'
      - 'lattice.replication.grpc-v*'
      - 'lattice.storage.azuretable-v*'
      - 'lattice.dashboards-v*'
      - 'lattice.api.state-v*'
      - 'lattice.api.state.grpc-v*'
      - 'lattice.membership-v*'
      - 'lattice.membership.entra-v*'
      - 'lattice.membership.entra.graph-v*'
      - 'lattice.auth-v*'
      - 'lattice.api.auth-v*'
      - 'lattice.api.auth.grpc-v*'
      - 'lattice.api.data-v*'
      - 'lattice.api.data.grpc-v*'
      - 'lattice.backup-v*'
      - 'lattice.backup.azureblob-v*'
      - 'lattice.api.backup-v*'
      - 'lattice.api.backup.grpc-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Parse tag → package + version
        id: parse
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Split on the LAST '-v' so package names containing dots (and
          # potentially hyphens, though none today) round-trip cleanly.
          pkg="${tag%-v*}"
          ver="${tag##*-v}"

          if [ ! -d "src/${pkg}" ]; then
            echo "::error::Tag '${tag}' does not map to any src/${pkg}/ folder."
            echo "::error::Expected convention: <src-folder-name>-v<X.Y.Z>"
            exit 1
          fi

          csproj=$(ls "src/${pkg}"/*.csproj | head -n1)
          if [ -z "${csproj}" ]; then
            echo "::error::No .csproj found under src/${pkg}/"
            exit 1
          fi

          testProj=""
          if [ -d "test/${pkg}" ]; then
            testProj=$(ls "test/${pkg}"/*.Tests.csproj 2>/dev/null | head -n1 || true)
          fi

          echo "PACKAGE=${pkg}"     >> "$GITHUB_OUTPUT"
          echo "VERSION=${ver}"     >> "$GITHUB_OUTPUT"
          echo "CSPROJ=${csproj}"   >> "$GITHUB_OUTPUT"
          echo "TEST_PROJECT=${testProj}" >> "$GITHUB_OUTPUT"

          echo "::notice::Publishing src/${pkg} as version ${ver} (csproj: ${csproj}, test: ${testProj:-<none>})"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.parse.outputs.VERSION }}

      - name: Test (chaos first - isolate flaky-prone surface)
        if: steps.parse.outputs.TEST_PROJECT != ''
        run: dotnet test "${{ steps.parse.outputs.TEST_PROJECT }}" --no-build --configuration Release --filter "TestCategory=Chaos" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full

      # The Azurite-gated AzureTableEmulator category is excluded because
      # the GitHub-hosted runner has no Azurite instance. This mirrors the
      # ci.yml deterministic step. The exclusion is harmless for packages
      # that don't define the category.
      - name: Test (deterministic, no Azurite)
        if: steps.parse.outputs.TEST_PROJECT != ''
        run: dotnet test "${{ steps.parse.outputs.TEST_PROJECT }}" --no-build --configuration Release --filter "TestCategory!=Chaos&TestCategory!=AzureTableEmulator" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full

      - name: Pack
        run: dotnet pack "${{ steps.parse.outputs.CSPROJ }}" --no-build --configuration Release -p:PackageVersion=${{ steps.parse.outputs.VERSION }} --output ./artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
