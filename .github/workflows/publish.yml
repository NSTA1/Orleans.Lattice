      - 'lattice.api.auth-v*'
      - 'lattice.api.auth.grpc-v*'
      - 'lattice.api.data-v*'
      - 'lattice.api.data.grpc-v*'
      - 'lattice.backup-v*'
      - 'lattice.backup.azureblob-v*'
      - 'lattice.api.backup-v*'
      - 'lattice.api.backup.grpc-v*'
      - 'lattice.api.replication-v*'
      - 'lattice.api.replication.grpc-v*'
      - 'lattice.api.mcp-v*'
      - 'lattice.api.mcp.telemetry-v*'
      - 'lattice.api.mcp.telemetry.azure-v*'
      - 'lattice.api.mcp.repocontext-v*'
      - 'lattice.api.mcp.repocontext.replication-v*'
      - 'lattice.api.schema-v*'
      - 'lattice.api.schema.grpc-v*'
      - 'lattice.api.treeadmin-v*'
      - 'lattice.api.treeadmin.grpc-v*'
      - 'lattice.api.tenantadmin-v*'
      - 'lattice.api.tenantadmin.grpc-v*'
      - 'lattice.api.telemetry-v*'
      - 'lattice.api.telemetry.grpc-v*'
      - 'lattice.schema-v*'
      - 'lattice.scaling-v*'
      - 'lattice.vector-v*'
      - 'lattice.tenancy-v*'
      - 'lattice.explorer.core-v*'
      - 'lattice.explorer.ui-v*'
      - 'lattice.explorer.backup-v*'
      - 'lattice.explorer.access-v*'
      - 'lattice.explorer.schema-v*'
      - 'lattice.explorer.web-v*'
      - 'lattice.explorer.entra-v*'
      - 'lattice.explorer.entra.web-v*'
      - 'lattice.explorer.designsystem-v*'
      - 'lattice.explorer.plugins.abstractions-v*'
      - 'lattice.explorer.plugins.selection-v*'
      - 'lattice.explorer.plugins.data-v*'
      - 'lattice.explorer.plugins.history-v*'
      - 'lattice.explorer.plugins.metrics-v*'
      - 'lattice.explorer.plugins.topology-v*'
      - 'lattice.explorer.plugins.tagindex-v*'
      - 'lattice.explorer.plugins.deadletter-v*'
      - 'lattice.explorer.plugins.telemetry-v*'
      - 'lattice.explorer.plugins.tenancy-v*'
      - 'lattice.explorer.plugins.tenants-v*'
      - 'lattice.explorer.plugins.mytenant-v*'
      - 'lattice.caching.azureblob-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    # Azurite supplies the local Azure Storage endpoints for the
    # AzureStorageEmulator-category tests (storage.azuretable, caching.azureblob,
    # backup.azureblob) so a release of those packages actually runs their emulator
    # tests instead of skipping them. Harmless for packages that define no such
    # tests. Pinned to the version validated locally; default command binds
    # blob/queue/table on 0.0.0.0 and the ports map to the runner host.
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
      - uses: actions/checkout@v5

      - name: Parse tag -> package + version
        id: parse
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Split on the LAST '-v' so package names containing dots (and
          # potentially hyphens, though none today) round-trip cleanly.
          pkg="${tag%-v*}"
          ver="${tag##*-v}"

          # Fast path: the one-package-per-top-level-src-folder convention,
          # where the tag prefix is the literal folder name under src/.
          csproj=""
          if [ -d "src/${pkg}" ]; then
            csproj=$(ls "src/${pkg}"/*.csproj 2>/dev/null | head -n1 || true)
          fi

          # Fallback: some src folders host several publishable libraries in
          # sub-folders (e.g. the explorer app folder ships the Core/UI/Web
          # hosting libraries). Those cannot be addressed by folder name, so
          # resolve the csproj by matching the tag against each project's
          # <PackageId> (lowercased, with the "Orleans." prefix stripped).
          if [ -z "${csproj}" ]; then
            while IFS= read -r cand; do
              pid=$(grep -oP '(?<=<PackageId>)[^<]+' "$cand" | head -n1 || true)
              [ -z "${pid}" ] && continue
              candtag=$(printf '%s' "${pid}" | tr '[:upper:]' '[:lower:]')
              candtag="${candtag#orleans.}"
              if [ "${candtag}" = "${pkg}" ]; then
                csproj="${cand}"
                break
              fi
            done < <(find src -name '*.csproj')
          fi

          if [ -z "${csproj}" ]; then
            echo "::error::Tag '${tag}' does not resolve to any src/ project."
            echo "::error::Expected either a src/${pkg}/ folder or a project whose"
            echo "::error::<PackageId> is 'Orleans.${pkg}' (case-insensitive)."
            exit 1
          fi

          pkgDir=$(dirname "${csproj}")

          # Test discovery follows the same top-level convention. Packages that
          # live in a shared app folder share one test project (run by CI), so a
          # missing test/${pkg}/ folder here just means "no publish-time tests".
          testProj=""
          if [ -d "test/${pkg}" ]; then
            testProj=$(ls "test/${pkg}"/*.Tests.csproj 2>/dev/null | head -n1 || true)
          fi

          echo "PACKAGE=${pkg}"     >> "$GITHUB_OUTPUT"
          echo "VERSION=${ver}"     >> "$GITHUB_OUTPUT"
          echo "CSPROJ=${csproj}"   >> "$GITHUB_OUTPUT"
          echo "TEST_PROJECT=${testProj}" >> "$GITHUB_OUTPUT"

          echo "::notice::Publishing ${pkgDir} as version ${ver} (csproj: ${csproj}, test: ${testProj:-<none>})"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The packed csproj's own <Version> is the single source of truth for
      # both the package version AND every emitted ProjectReference dependency
      # floor. We must NOT stamp the version as a global MSBuild property (a
      # global -p:Version / -p:PackageVersion propagates into every referenced
      # project, so a package that references e.g. Orleans.Lattice would emit a
      # dependency on Orleans.Lattice at the *tag* version instead of core's
      # real published version - which silently produces un-restorable packages
      # when the referenced package has a lower real version). Instead we trust
      # each csproj <Version> and fail the release here if it has drifted from
      # the release tag, so the operator bumps the csproj rather than shipping a
      # mis-versioned package with inflated dependency floors.
      - name: Verify csproj version matches tag
        run: |
          csprojVersion=$(dotnet msbuild "${{ steps.parse.outputs.CSPROJ }}" -getProperty:Version)
          echo "csproj <Version> = '${csprojVersion}', tag version = '${{ steps.parse.outputs.VERSION }}'"
          if [ "${csprojVersion}" != "${{ steps.parse.outputs.VERSION }}" ]; then
            echo "::error::The packed project's <Version> (${csprojVersion}) does not match the release tag version (${{ steps.parse.outputs.VERSION }}). Bump the csproj <Version> to match the tag (or fix the tag) before releasing - the csproj version is the source of truth for dependency floors."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      # No global -p:Version here (see 'Verify csproj version matches tag'):
      # the csproj <Version> drives the assembly and package version so that
      # ProjectReference dependency floors resolve to each referenced package's
      # real version, not the tag version.
      #
      # Build only the package being released rather than the whole solution.
      # When a test project exists, building it transitively compiles the src
      # csproj (and its dependency graph) in Release - exactly what the Test
      # (--no-build) and Pack (--no-build) steps consume. With no test project,
      # build the src csproj directly. A single-package release has no reason to
      # compile every other project in the solution.
      - name: Build
        run: |
          set -euo pipefail
          if [ -n "${{ steps.parse.outputs.TEST_PROJECT }}" ]; then
            dotnet build "${{ steps.parse.outputs.TEST_PROJECT }}" --no-restore --configuration Release
          else
            dotnet build "${{ steps.parse.outputs.CSPROJ }}" --no-restore --configuration Release
          fi

      # The durable active-active suite is deliberately outside package test
      # discovery: it spans core, replication, and Azure WAL concerns and is a
      # release-wide gate rather than a package-owned suite.
      - name: Build durable active-active release gate
        run: dotnet build test/lattice.integration/Orleans.Lattice.Integration.Tests.csproj --no-restore --configuration Release

      # Ensure Azurite is accepting connections before the
      # AzureStorageEmulator tests run (they self-skip on a connection failure).
      # Build precedes this, so it is normally already satisfied; cheap guard
      # against a cold-start race.
      - name: Wait for Azurite
        run: |
          for port in 10000 10001 10002; do
            for i in $(seq 1 30); do
              if (echo > "/dev/tcp/127.0.0.1/${port}") 2>/dev/null; then
                echo "Azurite port ${port} ready"; break
              fi
              if [ "$i" -eq 30 ]; then echo "::error::Azurite port ${port} not ready after 30s"; exit 1; fi
              sleep 1
            done
          done

      - name: Test durable active-active release gate
        run: dotnet test test/lattice.integration/Orleans.Lattice.Integration.Tests.csproj --no-build --configuration Release --filter "TestCategory=AzureStorageEmulator&TestCategory!=Chaos" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full

      - name: Test (chaos first - isolate flaky-prone surface)
        if: steps.parse.outputs.TEST_PROJECT != ''
        run: dotnet test "${{ steps.parse.outputs.TEST_PROJECT }}" --no-build --configuration Release --filter "TestCategory=Chaos&TestCategory!=AzureStorageEmulator" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full

      # The AzureStorageEmulator category runs here against the job's Azurite
      # service container (see `services:` above). The chaos step excludes it so
      # the Azure chaos suite stays out of the release gate; the deterministic
      # emulator integration tests run. Harmless for packages without the category.
      - name: Test (deterministic)
        if: steps.parse.outputs.TEST_PROJECT != ''
        run: dotnet test "${{ steps.parse.outputs.TEST_PROJECT }}" --no-build --configuration Release --filter "TestCategory!=Chaos" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full

      # No global -p:PackageVersion here (see 'Verify csproj version matches
      # tag' and 'Build'): --no-build reuses the already-correct assembly, and
      # the csproj <Version> is the single source of truth for both the package
      # version and its emitted ProjectReference dependency floors.
      - name: Pack
        run: dotnet pack "${{ steps.parse.outputs.CSPROJ }}" --no-build --configuration Release --output ./artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
