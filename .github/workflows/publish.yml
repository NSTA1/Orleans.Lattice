name: Publish

on:
  push:
    tags:
      # Convention: <src-folder-name>-v<X.Y.Z>[-suffix]
      # Examples:
      #   lattice-v3.3.0
      #   lattice.replication-v3.3.0
      #   lattice.replication.grpc-v3.3.0
      #   lattice.storage.azuretable-v3.3.0
      #   lattice.storage.file-v8.0.0
      #   lattice.dashboards-v3.3.0
      #   lattice.api.abstractions-v7.9.0
      #   lattice.api.state-v3.3.0
      #   lattice.api.state.grpc-v3.3.0
      #   lattice.membership-v7.8.0
      #   lattice.membership.entra-v7.8.0
      #   lattice.membership.entra.graph-v7.8.0
      #   lattice.auth-v7.8.0
      #   lattice.api.auth-v7.8.0
      #   lattice.api.auth.grpc-v7.8.0
      #   lattice.api.data-v7.8.0
      #   lattice.api.data.grpc-v7.8.0
      #   lattice.backup-v7.9.0
      #   lattice.backup.azureblob-v7.9.0
      #   lattice.api.backup-v7.9.0
      #   lattice.api.backup.grpc-v7.9.0
      #   lattice.api.replication-v7.9.0
      #   lattice.api.replication.grpc-v7.9.0
      #   lattice.api.mcp-v7.9.1
      #   lattice.api.mcp.telemetry-v7.9.1
      #   lattice.api.mcp.telemetry.azure-v8.0.0
      #   lattice.api.mcp.repocontext-v8.0.0
      #   lattice.api.mcp.repocontext.replication-v8.0.0
      #   lattice.api.schema-v7.9.1
      #   lattice.api.schema.grpc-v7.9.1
      #   lattice.api.treeadmin-v8.0.0
      #   lattice.api.treeadmin.grpc-v8.0.0
      #   lattice.api.tenantadmin-v8.0.0
      #   lattice.api.tenantadmin.grpc-v8.0.0
      #   lattice.api.telemetry-v9.4.0
      #   lattice.api.telemetry.grpc-v9.4.0
      #   lattice.schema-v7.9.0
      #   lattice.scaling-v7.9.0
      #   lattice.vector-v9.5.0
      #   lattice.tenancy-v8.0.0
      #   lattice.explorer.core-v7.9.1
      #   lattice.explorer.ui-v7.9.1
      #   lattice.explorer.backup-v7.9.1
      #   lattice.explorer.access-v7.9.1
      #   lattice.explorer.schema-v7.9.1
      #   lattice.explorer.web-v7.9.1
      #   lattice.explorer.entra-v7.7.1
      #   lattice.explorer.entra.web-v8.0.0
      #   lattice.explorer.designsystem-v9.4.0
      #   lattice.explorer.plugins.abstractions-v9.4.0
      #   lattice.explorer.plugins.selection-v9.4.0
      #   lattice.explorer.plugins.data-v9.4.0
      #   lattice.explorer.plugins.history-v9.4.0
      #   lattice.explorer.plugins.metrics-v9.4.0
      #   lattice.explorer.plugins.topology-v9.4.0
      #   lattice.explorer.plugins.tagindex-v9.4.0
      #   lattice.explorer.plugins.deadletter-v9.4.0
      #   lattice.explorer.plugins.telemetry-v9.4.0
      #   lattice.explorer.plugins.tenancy-v9.4.0
      #   lattice.explorer.plugins.tenants-v9.4.0
      #   lattice.explorer.plugins.mytenant-v9.4.0
      #   lattice.caching.azureblob-v8.0.0
      # The tag prefix is the literal folder name under src/, dots and all.
      # Packages that live in a shared app folder's sub-directory (the
      # explorer's Core/UI/Web/... hosting libraries) have no folder of their
      # own under src/; those tags resolve to the project whose <PackageId> is
      # 'Orleans.<tag>' (case-insensitive) - see the parse step below.
      - 'lattice-v*'
      - 'lattice.replication-v*'
      - 'lattice.replication.grpc-v*'
      - 'lattice.storage.azuretable-v*'
      - 'lattice.storage.file-v*'
      - 'lattice.dashboards-v*'
      - 'lattice.api.abstractions-v*'
      - 'lattice.api.state-v*'
