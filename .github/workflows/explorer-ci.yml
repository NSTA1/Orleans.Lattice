name: Explorer CI

# Advisory (non-required) lane that runs the whole Explorer test suite when
# Explorer files change. It used to exist to build the .NET MAUI Windows desktop
# head, which the ubuntu core matrix could not compile; that head is retired
# (epic #3807, E12), so the lane now runs on ubuntu like everything else and
# gives an Explorer change one self-contained signal. It only runs when explorer
# files change, so it never burdens unrelated PRs, and it is not a required
# status check.
on:
  pull_request:
    # Branch list mirrors ci.yml; the rationale for the '*/epic/**' pattern is
    # documented there and in .github/copilot-instructions.md, and is not
    # restated here. Without it an epic sub-PR that touches the Explorer would
    # get no Explorer-lane signal at all. The paths filter below is unchanged,
    # so unrelated sub-PRs still skip this lane entirely, and epic branches
    # carry no required checks, so a lane that does not report cannot leave a
    # sub-PR pending.
    #
    # `release/**` is included for the same reason as in `ci.yml`: a patch wave
    # assembled on a release line otherwise gets no validation at all.
    branches: [main, '*/epic/**', 'release/**']
    paths:
      - 'src/lattice.explorer/**'
      - 'test/lattice.explorer/**'
      - '.github/workflows/explorer-ci.yml'

  # Integration-branch lane, mirroring ci.yml's push trigger (#2972). A pull
  # request INTO a bucket was gated; the bucket itself was not, so its combined
  # state went unevaluated until the epic's single pull request into `main`.
  #
  # ADVISORY, AND MUST NEVER BECOME BRANCH PROTECTION - the same constraint
  # ci.yml states at length. A bucket exists so members merge in any order
  # without invalidating each other.
  #
  # DISCLOSED LIMIT, because it is narrower than it looks: GitHub evaluates a
  # `paths:` filter on a push against the PUSH diff, which on a bucket is the
  # one member that just merged - not the bucket against `main`. So this lane
  # runs on a push only when THAT merge touched Explorer files, and a bucket
  # carrying an Explorer change from an earlier member will not re-run it when
  # a later unrelated member lands. That is weaker than ci.yml's push lane,
  # which bypasses diff-scoping entirely. It is accepted rather than worked
  # around: the core push lane already evaluates the whole bucket, and this
  # lane's own value is the Explorer-focused signal on the merges that actually
  # touch it.
  push:
    branches: ['*/epic/**']
    paths:
      - 'src/lattice.explorer/**'
      - 'test/lattice.explorer/**'
      - '.github/workflows/explorer-ci.yml'

permissions:
  contents: read

concurrency:
  group: explorer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explorer-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-explorer-${{ runner.os }}-${{ hashFiles('src/lattice.explorer/**/*.csproj', 'test/lattice.explorer/**/*.csproj') }}
          restore-keys: nuget-explorer-${{ runner.os }}-

      # tla-toolchain: not-required - this lane runs only
      # test/lattice.explorer, which contains no `Tlc`-category fixture. See
      # spec/README.md and CiTlaToolchainProvisioningTests.
      - name: Test explorer
        run: dotnet test test/lattice.explorer/Orleans.Lattice.Explorer.Tests.csproj --configuration Release --filter "TestCategory!=Chaos" --logger "trx;LogFileName=explorer.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: explorer-test-results
          path: '**/*.trx'