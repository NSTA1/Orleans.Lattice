name: Explorer Journeys

# Advisory (non-required) lane for the Explorer end-to-end journeys (epic #5401).
#
# The journeys run against a production-shaped estate (#5359): journey hosts
# launched as real processes, a two-silo west region behind a TLS gateway with
# active health checks, an Explorer head that holds the gateway as its one
# endpoint, and every storage provider on Azurite - with the backup sink on a
# separate account. Estates with an east region (#5362) add a third Azurite
# account for east, and each runs its own pinned Prometheus container.
# `test/lattice.explorer.e2e/**` is carved out of the `code` and `nonSample`
# filters in `ci.yml` exactly as `test/lattice.explorer.uitests/**` is, so the
# core matrix never tries to run it; this workflow is its runner.
#
# FAIL CLOSED, NEVER INCONCLUSIVE. Every leg sets LATTICE_E2E_REQUIRED=1, so a
# journey that cannot reach Azurite FAILS rather than going inconclusive, which
# NUnit would count as neither passed nor failed - the false green the testing
# master warns about. The harness leg proves it on every run: it stops Azurite
# and requires the estate smoke fixture to fail.
#
# LEGS (#5363). `explorer-journeys-plan.py` decides them; its docstring is the
# contract and `explorer-journeys-plan-selftest.py` pins it:
#   harness            every EndToEnd fixture that is not a journey, a story or
#                      the coverage gate.
#   isolated-<jid>     one per folder under test/lattice.explorer.e2e/Journeys/,
#                      discovered from the directory, so adding a journey edits
#                      no shared file. A pull request touching only Journeys/<id>/
#                      runs that leg; a change to the Explorer, the harness, the
#                      hosts, a facade or this lane runs every leg.
#   story-contoso, story-fabrikam
#                      the storyline run in order on one estate. ADVISORY and
#                      NOT run on an ordinary pull request (user decision on
#                      #5401, 2026-11-01, extended to pull requests into main
#                      once phase 1 landed): they run on a landing pull request
#                      (an integration branch into main), nightly, on
#                      workflow_dispatch, and on a pull request labelled
#                      `journeys-full`.
#                      Planned once the tree holds a chapter contract (F6,
#                      #5364): without one a story fails at its first chapter
#                      by construction.
#   story-contoso-narrow  nightly only: the Contoso story at 390x844.
# A member pull request, or any other pull request that is not a landing pull
# request, runs the harness and the isolated legs of the chapters it touches
# (plus, for an Explorer area file, the chapters naming that area; a shared
# file runs every isolated leg). The planner's docstring has the rule.
# `contract-conformance` is a matrix over the planner's `conformance` output,
# so it follows the same gating as the story legs.
# After the legs, `coverage-gate` unions every leg's coverage hits. On a body
# edit of a member pull request, `provenance` checks the `## Journey
# screenshots` section against the run its markers name.
#
# BUCKET PUSHES. The coordinator cancels every run a push to the bucket
# triggers (epic D11): the cross-item gate is the bucket-to-main pull request.
# The push trigger stays because CiIntegrationBranchTriggerTests requires every
# lane that gates integration pull requests to run on the integration branch.
#
# Like ui-tests.yml it is advisory: a required check that never reports would
# leave a PR pending forever. The epic makes a green story run on the
# bucket-to-main pull request a merge condition by convention.
on:
  pull_request:
    # Branch list mirrors ci.yml and ui-tests.yml. `edited` re-runs the lane
    # when a pull request body changes, which is when the screenshot
    # provenance check has something new to check; the planner runs no leg on
    # it. `labeled` lets `journeys-full` start the full set on a member pull
    # request; any other label plans nothing.
    types: [opened, synchronize, reopened, edited, labeled]
    branches: [main, '*/epic/**', 'release/**']
    paths:
      - 'test/lattice.explorer.e2e/**'
      - 'src/lattice.explorer/**'
      # The feature catalogue's curated half cites these docs' anchors (#5361).
      - 'docs/lattice.explorer/**'
      - 'reference-architecture/hosts/**'
      - 'samples/Explorer/Apps/TaskBoard/**'
      # Every facade the Explorer calls, server and client side.
      - 'src/lattice.api.abstractions/**'
      - 'src/lattice.api.state*/**'
      - 'src/lattice.api.data*/**'
      - 'src/lattice.api.auth*/**'
      - 'src/lattice.api.schema*/**'
      - 'src/lattice.api.tenantadmin*/**'
      - 'src/lattice.api.backup*/**'
      - 'src/lattice.api.telemetry*/**'
      - 'src/lattice.api.treeadmin*/**'
      - 'src/lattice.api.replication*/**'
      - 'src/lattice.api.apps*/**'
      - '.github/workflows/explorer-journeys.yml'
      - '.github/workflows/explorer-journeys-plan*.py'
      - '.github/workflows/journey-screenshot-provenance*.py'
      - '.github/workflows/install-playwright-browsers.sh'
      - '.github/workflows/run-playwright-install.py'
      - '.github/workflows/playwright_apt_mirrors.py'
      - '.github/workflows/runner-overflow.py'
      - '!test/lattice.explorer.e2e/**/*.md'
      - '!src/lattice.explorer/**/*.md'
      - '!reference-architecture/hosts/**/*.md'
      - '!samples/Explorer/Apps/TaskBoard/**/*.md'
      - '!src/lattice.api.*/**/*.md'

  # Integration-branch lane, mirroring ui-tests.yml (and its disclosed limit:
  # on a push the paths filter sees only the member that just merged). Every
  # bucket-push run is cancelled by the coordinator (see BUCKET PUSHES above).
  push:
    branches: ['*/epic/**']
    paths:
      - 'test/lattice.explorer.e2e/**'
      - 'src/lattice.explorer/**'
      - 'docs/lattice.explorer/**'
      - 'reference-architecture/hosts/**'
      - 'samples/Explorer/Apps/TaskBoard/**'
      - 'src/lattice.api.abstractions/**'
      - 'src/lattice.api.state*/**'
      - 'src/lattice.api.data*/**'
      - 'src/lattice.api.auth*/**'
      - 'src/lattice.api.schema*/**'
      - 'src/lattice.api.tenantadmin*/**'
      - 'src/lattice.api.backup*/**'
      - 'src/lattice.api.telemetry*/**'
      - 'src/lattice.api.treeadmin*/**'
      - 'src/lattice.api.replication*/**'
      - 'src/lattice.api.apps*/**'
      - '.github/workflows/explorer-journeys.yml'
      - '.github/workflows/explorer-journeys-plan*.py'
      - '.github/workflows/journey-screenshot-provenance*.py'
      - '.github/workflows/install-playwright-browsers.sh'
      - '.github/workflows/run-playwright-install.py'
      - '.github/workflows/playwright_apt_mirrors.py'
      - '.github/workflows/runner-overflow.py'
      - '!test/lattice.explorer.e2e/**/*.md'
      - '!src/lattice.explorer/**/*.md'
      - '!reference-architecture/hosts/**/*.md'
      - '!samples/Explorer/Apps/TaskBoard/**/*.md'
      - '!src/lattice.api.*/**/*.md'

  # Nightly: every leg, plus the Contoso story at 390x844 (runs on the default
  # branch once the epic lands there).
  schedule:
    - cron: '17 2 * * *'

  # On demand: every leg and every conformance shard on the chosen ref.
  # `hosted_budget` overrides HOSTED_RUNNER_BUDGET for this run only: 0 sends
  # every leg to the self-hosted pool (when RUNNER_POOL is set), which is how
  # a change to the pool image or the pool path of a leg is proven.
  workflow_dispatch:
    inputs:
      hosted_budget:
        description: 'Hosted jobs in flight before legs overflow to the pool (empty: the HOSTED_RUNNER_BUDGET variable)'
        required: false
        default: ''

permissions:
  contents: read

# A body edit and a label each get a group of their own, so checking the
# screenshot section or adding a label never cancels the legs of the push it
# follows.
concurrency:
  group: explorer-journeys-${{ github.ref }}-${{ github.event.action == 'edited' && 'body' || github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'code' }}
  cancel-in-progress: true

env:
  E2E_PROJECT: test/lattice.explorer.e2e/Orleans.Lattice.Explorer.EndToEnd.Tests.csproj
  RESULTS: ${{ github.workspace }}/test-results

jobs:
  # Member-push classifier, as in ui-tests.yml. The script is ci.yml's
  # `pushref` step, which is the SOURCE OF TRUTH for the rule. Do not edit it
  # here alone: CiIntegrationBranchTriggerTests fails the build when this copy
  # and ci.yml's differ, and requires this job to stay a checkout and the
  # classifier step.
  plan:
    name: Classify pushed ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      push_is_member: ${{ steps.pushref.outputs.member }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          fetch-depth: 1
          sparse-checkout: .github

      - name: Classify the pushed integration ref
        id: pushref
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          member=false
          parent=""

          while read -r _sha ref; do
            branch="${ref#refs/heads/}"

            # A proper prefix, and the very next character is the `-` separator.
            case "$BRANCH" in
              "$branch"-*)
                if [ "$branch" != "$BRANCH" ]; then
                  member=true
                  parent="$branch"
                fi
                ;;
            esac
          done < <(git ls-remote --heads origin)

          echo "member=$member" >> "$GITHUB_OUTPUT"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"

          if [ "$member" = "true" ]; then
            echo "Pushed ref '$BRANCH' extends integration branch '$parent'; treating it as a member."
          else
            echo "Pushed ref '$BRANCH' extends no existing branch; treating it as an integration branch."
          fi

  # Decides the legs and the journeys whose screenshots need a provenance
  # check, then routes the legs between hosted runners and the self-hosted
  # pool. Runs the planner's, the provenance check's and the router's
  # self-tests first: all pure Python, seconds.
  planner:
    name: Plan legs
    needs: plan
    if: needs.plan.outputs.push_is_member != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read lets runner-overflow.py count the hosted jobs in flight.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      legs: ${{ steps.route.outputs.legs }}
      conformance: ${{ steps.plan.outputs.conformance }}
      provenance: ${{ steps.plan.outputs.provenance }}
    steps:
      - uses: actions/checkout@v5

      - name: Self-test the leg planner
        run: python3 .github/workflows/explorer-journeys-plan-selftest.py

      - name: Self-test the screenshot provenance check
        run: python3 .github/workflows/journey-screenshot-provenance-selftest.py

      - name: Self-test the runner router
        run: python3 .github/workflows/runner-overflow.py --self-test

      # From the API rather than a git diff, so no history is fetched. A listing
      # that fails leaves no file, and the planner then runs every leg.
      - name: List the pull request's changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if ! gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"; then
            echo "::warning::Could not list the pull request's changed files; every leg runs."
            rm -f "$RUNNER_TEMP/changed.txt"
          fi

      # Its own pull-request-only step, so the plan step (which a push runs too)
      # reads no pull-request context. No file: the planner sees no label and
      # no head branch.
      - name: Record the pull request's labels and head branch
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          LABEL: ${{ github.event.label.name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          printf '%s' "$LABELS" > "$RUNNER_TEMP/labels.json"
          printf '%s' "$LABEL" > "$RUNNER_TEMP/label.txt"
          printf '%s' "$HEAD_REF" > "$RUNNER_TEMP/head.txt"

      - name: Plan the legs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          labels=$(cat "$RUNNER_TEMP/labels.json" 2>/dev/null || true)
          label=$(cat "$RUNNER_TEMP/label.txt" 2>/dev/null || true)
          head=$(cat "$RUNNER_TEMP/head.txt" 2>/dev/null || true)
          python3 .github/workflows/explorer-journeys-plan.py plan \
            --event "$EVENT" --action "$ACTION" --base-ref "$BASE_REF" \
            --labels "$labels" --label "$label" --head-ref "$head" \
            --changed-files "$RUNNER_TEMP/changed.txt" --legs-file "$RUNNER_TEMP/legs.json"

      # Runner routing, as ci.yml's legs are routed (runner-overflow.py): hosted
      # while the repository's busy hosted jobs - CI's included, so the two lanes
      # share one headroom - stay under HOSTED_RUNNER_BUDGET, the self-hosted pool
      # (tools/ci-runners) beyond it, longest leg first. Hosted legs run on
      # ubuntu-24.04 (see the legs job). Unset RUNNER_POOL keeps every leg hosted.
      - name: Route the legs
        id: route
        env:
          RUNNER_POOL: ${{ vars.RUNNER_POOL }}
          HOSTED_RUNNER_BUDGET: ${{ inputs.hosted_budget || vars.HOSTED_RUNNER_BUDGET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/workflows/runner-overflow.py --matrix "$RUNNER_TEMP/legs.json" --hosted ubuntu-24.04
          echo "legs=$(jq -c . "$RUNNER_TEMP/legs.json")" >> "$GITHUB_OUTPUT"

  # A leg runs hosted or on the self-hosted pool, as the planner's routing step
  # decided. A pool leg's name starts with `[pool] `, and the job declares no
  # `services:` or `container:` (Container Apps runs no Docker daemon, and the
  # runner probes it for any services block; CiSelfHostedRunnerScopeTests).
  # On the pool the leg uses what tools/ci-runners/Dockerfile bakes in: npm
  # Azurite for the three accounts, a Prometheus binary of JourneyPrometheus's
  # pinned version, Playwright's Chromium with its system dependencies, and a
  # NuGet snapshot, so it skips the Actions caches.
  legs:
    name: ${{ matrix.pool && '[pool] ' || '' }}${{ matrix.name }}
    needs: planner
    if: needs.planner.outputs.legs != '[]'
    # Hosted legs are pinned: Playwright's install-deps carries the ubuntu-24.04
    # package list (libicu74, libvpx9, libx264-164, libxml2) and fails with exit
    # 100 on ubuntu-26.04, which ubuntu-latest became in November 2026. The pool
    # image is ubuntu-24.04 too (the actions-runner base).
    # TODO: return to ubuntu-latest once Microsoft.Playwright supports 26.04.
    runs-on: ${{ fromJSON(matrix.runsOn || '"ubuntu-24.04"') }}
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.planner.outputs.legs) }}

    env:
      # Three Azurite accounts, as reference-architecture/local/docker-compose.yml
      # runs them: the primary (Table, Blob, Queue), a separate backup sink, and
      # the east region's own account (#5362).
      LATTICE_E2E_STORAGE: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
      LATTICE_E2E_BACKUP_STORAGE: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:11000/devstoreaccount1;
      LATTICE_E2E_EAST_STORAGE: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:12000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:12001/devstoreaccount1;TableEndpoint=http://127.0.0.1:12002/devstoreaccount1;
      LATTICE_E2E_REQUIRED: '1'
      LATTICE_E2E_HOSTS_DIR: ${{ github.workspace }}/.journey-hosts
      # The pool has no Docker daemon: there the harness runs the Prometheus binary
      # the pool image bakes in, rather than JourneyPrometheus.Image.
      LATTICE_E2E_PROMETHEUS_BINARY: ${{ matrix.pool && '/opt/prometheus/prometheus' || '' }}
      # The commit each journey's screenshot manifest records (#5360): the PR's head, which
      # its screenshot section is checked against, not the merge commit GITHUB_SHA names.
      LATTICE_E2E_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # isolated or story (#5361); the harness and isolated legs run isolated.
      LATTICE_E2E_MODE: ${{ matrix.mode }}
      # 'narrow' runs every session at 390x844 (#5360); empty is desktop.
      LATTICE_E2E_VIEWPORT: ${{ matrix.viewport }}
      LEG: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      # Started from a step rather than `services:` so the backup and east
      # accounts' ports can differ from the primary's, and so a pool leg can run
      # them at all (see the job's comment). Hosted legs run the pinned image, as
      # in ci.yml's "Start Azurite" step; pool legs run the same version from npm.
      # On the pool each account is started by a script under RUNNER_TEMP, so the
      # fail-closed probe can stop the primary and start it again.
      - name: Start Azurite
        env:
          POOL: ${{ matrix.pool }}
        run: |
          set -euo pipefail
          if [ "$POOL" = "true" ]; then
            start() {
              local name="$1" blob="$2" queue="$3" table="$4"
              mkdir -p "$RUNNER_TEMP/$name"
              cat > "$RUNNER_TEMP/$name.sh" <<EOF
          #!/usr/bin/env bash
          nohup azurite --silent --location "$RUNNER_TEMP/$name" --skipApiVersionCheck --loose \\
            --blobHost 127.0.0.1 --blobPort $blob --queueHost 127.0.0.1 --queuePort $queue \\
            --tableHost 127.0.0.1 --tablePort $table >> "$RUNNER_TEMP/$name.log" 2>&1 &
          echo \$! > "$RUNNER_TEMP/$name.pid"
          EOF
              bash "$RUNNER_TEMP/$name.sh"
            }
            # The backup sink is Blob only; its unused queue and table ports keep
            # clear of the other accounts'.
            start azurite 10000 10001 10002
            start azurite-backup 11000 11001 11002
            start azurite-east 12000 12001 12002
          else
            start() {
              local name="$1"; shift
              docker run -d --name "$name" "$@" mcr.microsoft.com/azure-storage/azurite:3.36.0 \
                azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
            }
            start azurite -p 10000:10000 -p 10001:10001 -p 10002:10002
            start azurite-backup -p 11000:10000
            start azurite-east -p 12000:10000 -p 12001:10001 -p 12002:10002
          fi

      - name: Wait for Azurite
        env:
          POOL: ${{ matrix.pool }}
        run: |
          set -euo pipefail
          for port in 10000 10001 10002 11000 12000 12001 12002; do
            for attempt in $(seq 1 60); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then
                echo "Azurite answers on port $port."
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::Azurite did not open port $port within 60 seconds."
                if [ "$POOL" = "true" ]; then
                  tail -n 50 "$RUNNER_TEMP"/azurite*.log || true
                else
                  docker ps -a
                fi
                exit 1
              fi
              sleep 1
            done
          done

      # Each estate that runs Prometheus starts its own container from this image,
      # on the host network with a scrape-target file the harness writes as silos
      # start (their ports are allocated per run), so the lane only pulls it once.
      # The tag is JourneyPrometheus.Image; change the two together (and the
      # version tools/ci-runners/Dockerfile bakes in for pool legs).
      - name: Pull Prometheus
        if: ${{ !matrix.pool }}
        run: docker pull prom/prometheus:v3.1.0

      - name: Check the pool image's Prometheus
        if: ${{ matrix.pool }}
        run: |
          set -euo pipefail
          if [ ! -x "$LATTICE_E2E_PROMETHEUS_BINARY" ]; then
            echo "::error::$LATTICE_E2E_PROMETHEUS_BINARY is missing: the pool image predates journey legs. Redeploy tools/ci-runners (deploy.ps1)."
            exit 1
          fi
          "$LATTICE_E2E_PROMETHEUS_BINARY" --version

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Not on a pool leg: the pool image carries a NuGet package snapshot, and
      # skipping the cache keeps a burst of pool legs off the repository's Actions
      # cache egress limit (as ci.yml's test legs do).
      - name: Cache NuGet packages
        if: ${{ !matrix.pool }}
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-journeys-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'test/lattice.explorer.e2e/**/*.csproj') }}
          restore-keys: nuget-journeys-${{ runner.os }}-

      - name: Build the journey tests and hosts
        run: dotnet build "$E2E_PROJECT" --configuration Release

      # Published once per leg and launched by the harness with `dotnet <dll>`.
      - name: Publish the journey hosts
        run: |
          set -euo pipefail
          for host in JourneySilo JourneyExplorer JourneyGateway LineFeed; do
            project=$(ls test/lattice.explorer.e2e/Hosts/$host/*.csproj)
            dotnet publish "$project" --configuration Release --no-restore --output "$LATTICE_E2E_HOSTS_DIR/$host"
          done

      # Keyed on the project file, which pins Microsoft.Playwright. Not on a pool
      # leg: the pool image bakes in that version's Chromium and its system
      # dependencies (LATTICE_PLAYWRIGHT_SYSTEM_DEPS), so the install below finds
      # both present, and fetches only what a newer pin needs.
      - name: Cache Playwright browsers
        if: ${{ !matrix.pool }}
        id: pwcache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-e2e-chromium-${{ runner.os }}-${{ hashFiles('test/lattice.explorer.e2e/*.csproj') }}

      - name: Install Playwright Chromium
        timeout-minutes: 15
        env:
          CACHE_HIT: ${{ steps.pwcache.outputs.cache-hit }}
          PLAYWRIGHT_SEARCH_DIR: test/lattice.explorer.e2e/bin/Release
        run: bash .github/workflows/install-playwright-browsers.sh "$CACHE_HIT" chromium

      # tla-toolchain: not-required - every leg's filter selects fixtures inside
      # test/lattice.explorer.e2e, which contains no `Tlc`-category fixture. See
      # spec/README.md and CiTlaToolchainProvisioningTests.
      - name: Run the leg
        env:
          FILTER: ${{ matrix.filter }}
        run: |
          dotnet test "$E2E_PROJECT" --no-build --configuration Release \
            --filter "$FILTER" \
            --results-directory "$RESULTS" \
            --logger "trx;LogFileName=$LEG.trx" \
            --logger "console;verbosity=normal" \
            --blame-hang-timeout 20m --blame-hang-dump-type none

      # The leg's counts, every journey's ordered screenshot manifest and the
      # leg's coverage hits, in the job summary; the pending-wrapper list and
      # the story report are written there by the tests themselves. Fails a leg
      # whose filter selected none of the tests it exists for.
      - name: Summarise the leg
        if: always()
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          python3 .github/workflows/explorer-journeys-plan.py leg-summary --leg "$LEG" \
            --trx "$RESULTS/$LEG.trx" --artifacts test/lattice.explorer.e2e/artifacts --expect "$EXPECT"

      # Every process's log, trace and screenshot, kept on success too.
      - name: Upload the leg's artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: explorer-journeys-${{ matrix.name }}
          path: |
            test-results/**
            test/lattice.explorer.e2e/artifacts/**
          if-no-files-found: ignore

      # The artifact a member pull request's screenshot section names (#5363):
      # journey-screenshots-<jid>/manifest.json is what provenance checks.
      - name: Upload the journey's screenshots
        if: always() && matrix.kind == 'isolated'
        uses: actions/upload-artifact@v6
        with:
          name: journey-screenshots-${{ matrix.jid }}
          path: test/lattice.explorer.e2e/artifacts/screenshots/${{ matrix.jid }}/
          if-no-files-found: ignore

      - name: Upload the leg's screenshots
        if: always() && matrix.kind != 'isolated'
        uses: actions/upload-artifact@v6
        with:
          name: journey-screenshots-leg-${{ matrix.name }}
          path: test/lattice.explorer.e2e/artifacts/screenshots/
          if-no-files-found: ignore

      - name: Upload coverage hits
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-hits-${{ matrix.name }}
          path: test/lattice.explorer.e2e/artifacts/coverage-hits.json
          if-no-files-found: ignore

      # The fail-closed proof (#5363): with the primary Azurite stopped, the
      # estate smoke fixture must FAIL - not pass, not go inconclusive. On the
      # pool the primary is the npm process "Start Azurite" recorded.
      - name: Prove a stopped Azurite fails the leg
        if: success() && matrix.kind == 'harness'
        env:
          POOL: ${{ matrix.pool }}
        run: |
          set -uo pipefail
          if [ "$POOL" = "true" ]; then
            pid=$(cat "$RUNNER_TEMP/azurite.pid")
            kill "$pid"
            while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          else
            docker stop azurite
          fi
          # Actions runs `bash -e`; the expected failure must not end the step
          # before the verdict.
          set +e
          dotnet test "$E2E_PROJECT" --no-build --configuration Release \
            --filter "FullyQualifiedName~Orleans.Lattice.Explorer.EndToEnd.Tests.Smoke.EstateSmokeTests" \
            --results-directory "$RESULTS" \
            --logger "trx;LogFileName=fail-closed-probe.trx" \
            --blame-hang-timeout 10m --blame-hang-dump-type none
          code=$?
          set -e
          if [ "$POOL" = "true" ]; then
            bash "$RUNNER_TEMP/azurite.sh"
          else
            docker start azurite
          fi
          python3 .github/workflows/explorer-journeys-plan.py probe \
            --trx "$RESULTS/fail-closed-probe.trx" --exit-code "$code"

  # Unions every leg's coverage hits (#5361) and reports the catalogue features
  # none of them proved. Soft until I1 (#5400) makes CoverageGate.Hard true.
  coverage-gate:
    name: Coverage gate (all legs)
    needs: [plan, planner, legs]
    if: always() && needs.plan.outputs.push_is_member != 'true' && needs.planner.result == 'success' && needs.planner.outputs.legs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Download every leg's coverage hits
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-hits-*
          path: coverage-hits

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-journeys-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'test/lattice.explorer.e2e/**/*.csproj') }}
          restore-keys: nuget-journeys-${{ runner.os }}-

      - name: Run the coverage gate
        env:
          LATTICE_E2E_COVERAGE_HITS: ${{ github.workspace }}/coverage-hits
        run: |
          set -euo pipefail
          dotnet build "$E2E_PROJECT" --configuration Release
          dotnet test "$E2E_PROJECT" --no-build --configuration Release \
            --filter "TestCategory=CoverageGate" \
            --results-directory "$RESULTS" \
            --logger "trx;LogFileName=coverage-gate.trx" \
            --blame-hang-timeout 10m --blame-hang-dump-type none
          python3 .github/workflows/explorer-journeys-plan.py leg-summary --leg coverage-gate \
            --trx "$RESULTS/coverage-gate.trx" \
            --expect "Orleans.Lattice.Explorer.EndToEnd.Tests.FeatureCoverage.CoverageGateTests"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: explorer-journeys-coverage-gate
          path: |
            test-results/**
            test/lattice.explorer.e2e/artifacts/coverage-report.md
            test/lattice.explorer.e2e/artifacts/job-summary.md
          if-no-files-found: ignore

  # Checks a member pull request's `## Journey screenshots` section against
  # the run each marker names (#5363, epic D10). It runs when the body is
  # edited (or the pull request reopened): a push makes every marker stale by
  # construction, because the run its screenshots come from does not exist
  # until the push, so the author pastes the section after that run and the
  # edit runs this check against the head.
  provenance:
    name: Screenshot provenance
    needs: [plan, planner]
    if: github.event_name == 'pull_request' && needs.plan.outputs.push_is_member != 'true' && needs.planner.outputs.provenance != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Check the screenshot section
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOURNEYS: ${{ needs.planner.outputs.provenance }}
        run: python3 .github/workflows/journey-screenshot-provenance.py

  # The F6 contract conformance self-test (#5364): on one estate per storyline, every
  # chapter's contract establishes its produces through the facades and then verifies
  # them, in serial story order. Sharded by storyline, one leg each; the main harness
  # job excludes it. ADVISORY: the planner plans no shard on a member pull request or a
  # body edit (see the LEGS comment at the top).
  contract-conformance:
    name: Contract conformance (${{ matrix.storyline }})
    needs: [plan, planner]
    if: needs.plan.outputs.push_is_member != 'true' && needs.planner.outputs.conformance != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        storyline: ${{ fromJSON(needs.planner.outputs.conformance) }}

    env:
      # Two Azurite accounts, as reference-architecture/local/docker-compose.yml
      # runs them: the primary (Table, Blob, Queue) and a separate backup sink.
      LATTICE_E2E_STORAGE: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
      LATTICE_E2E_BACKUP_STORAGE: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:11000/devstoreaccount1;
      # The east region's own account (#5362): each region keeps its clustering,
      # grain state, WAL and console key ring on storage of its own.
      LATTICE_E2E_EAST_STORAGE: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:12000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:12001/devstoreaccount1;TableEndpoint=http://127.0.0.1:12002/devstoreaccount1;
      LATTICE_E2E_REQUIRED: '1'
      LATTICE_E2E_HOSTS_DIR: ${{ github.workspace }}/.journey-hosts
      # The commit each journey's screenshot manifest records (#5360): the PR's head, which
      # its screenshot section is checked against, not the merge commit GITHUB_SHA names.
      LATTICE_E2E_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v5

      # Started as containers rather than `services:` so the backup account's
      # port can differ from the primary's, as in ci.yml's "Start Azurite" step.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite:3.36.0 \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
          docker run -d --name azurite-backup -p 11000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.36.0 \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
          docker run -d --name azurite-east -p 12000:10000 -p 12001:10001 -p 12002:10002 \
            mcr.microsoft.com/azure-storage/azurite:3.36.0 \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose

      # Each estate that runs Prometheus starts its own container from this image,
      # on the host network with a scrape-target file the harness writes as silos
      # start (their ports are allocated per run), so the lane only pulls it once.
      # The tag is JourneyPrometheus.Image; change the two together.
      - name: Pull Prometheus
        run: docker pull prom/prometheus:v3.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-journeys-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'test/lattice.explorer.e2e/**/*.csproj') }}
          restore-keys: nuget-journeys-${{ runner.os }}-

      - name: Build the journey tests and hosts
        run: dotnet build "$E2E_PROJECT" --configuration Release

      # Published once per job and launched by the harness with `dotnet <dll>`.
      - name: Publish the journey hosts
        run: |
          set -euo pipefail
          for host in JourneySilo JourneyExplorer JourneyGateway LineFeed; do
            project=$(ls test/lattice.explorer.e2e/Hosts/$host/*.csproj)
            dotnet publish "$project" --configuration Release --no-restore --output "$LATTICE_E2E_HOSTS_DIR/$host"
          done

      # Keyed on the project file, which pins Microsoft.Playwright.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-e2e-chromium-${{ runner.os }}-${{ hashFiles('test/lattice.explorer.e2e/*.csproj') }}

      - name: Install Playwright Chromium
        timeout-minutes: 15
        env:
          CACHE_HIT: ${{ steps.pwcache.outputs.cache-hit }}
          PLAYWRIGHT_SEARCH_DIR: test/lattice.explorer.e2e/bin/Release
        run: bash .github/workflows/install-playwright-browsers.sh "$CACHE_HIT" chromium

      # tla-toolchain: not-required - the filter selects TestCategory=EndToEnd
      # inside test/lattice.explorer.e2e, which contains no `Tlc`-category
      # fixture. See spec/README.md and CiTlaToolchainProvisioningTests.
      - name: Run the ${{ matrix.storyline }} contract conformance self-test
        run: |
          dotnet test "$E2E_PROJECT" --no-build --configuration Release \
            --filter "TestCategory=ContractConformance&FullyQualifiedName~${{ matrix.storyline }}ContractConformanceTests" \
            --results-directory "$RESULTS" \
            --logger "trx;LogFileName=contract-conformance.trx" \
            --logger "console;verbosity=normal" \
            --blame-hang-timeout 30m --blame-hang-dump-type none

      # Every process's log and every screenshot and trace, kept on success too:
      # member PRs take their journey screenshots from this artifact.
      - name: Upload journey artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: contract-conformance-${{ matrix.storyline }}
          path: |
            test-results/**
            test/lattice.explorer.e2e/artifacts/**
          if-no-files-found: ignore
