name: UI Tests

# Advisory (non-required) lane that runs the browser-driven Playwright suite
# against the Explorer web head.
#
# Why this is a separate workflow rather than a step in `CI`:
#
#   * It needs browser binaries. Installing chromium costs wall-clock and disk
#     on every runner it touches, so it must not burden the core matrix.
#   * It only tells us anything when the Explorer UI actually changed. The
#     `paths` filter below keeps it off unrelated PRs entirely - a change to,
#     say, `src/lattice.replication/` never pays for a browser.
#   * `test/lattice.explorer.uitests/**` is deliberately excluded from the
#     `code` and `nonSample` filters in `ci.yml` (the same carve-out
#     `benchmark/**` and `apps/**` get), so the core matrix never tries to run
#     these tests without a browser present. This workflow is their only
#     per-PR runner; the scheduled coverage workflow (`coverage.yml`) also
#     runs them, sharded from the same `ui-test-shards.json`.
#
# Why it is NOT a required status check: it does not run on most PRs, and a
# required check that never reports leaves a PR pending forever. `Explorer CI`
# is non-required for the same reason. Treat a failure here as blocking by
# convention, not by branch protection.
#
# Markdown under the Explorer tree is excluded so a docs-only edit does not
# provision a browser. Note the '**/*.md' spelling: picomatch only treats '**'
# as a globstar when it stands alone as a path segment, so '**.md' would
# silently degrade to '*.md' and fail to match nested files.
on:
  pull_request:
    # Branch list mirrors ci.yml; the rationale for the '*/epic/**' pattern is
    # documented there and in .github/copilot-instructions.md, and is not
    # restated here. Without it an epic sub-PR that touches the Explorer UI
    # would get no browser-driven signal at all. The paths filter below is
    # unchanged, so unrelated sub-PRs still never provision a browser, and the
    # pending-forever concern noted above cannot arise on an epic branch
    # because epic branches deliberately carry no required checks.
    #
    # `release/**` is included for the same reason as in `ci.yml`: a patch wave
    # assembled on a release line otherwise gets no validation at all.
    branches: [main, '*/epic/**', 'release/**']
    paths:
      - 'src/lattice.explorer/**'
      - '!src/lattice.explorer/**/*.md'
      # The Explorer UI links the documentation site's tokens, fonts and favicon
      # at build time (epic #3807, E10), and the browser suite drives the
      # task-board sample app, so a change to either changes what it renders.
      - 'docs-site/template/public/tokens.css'
      - 'docs-site/template/public/favicon.svg'
      - 'docs-site/template/public/fonts/**'
      - 'samples/Explorer/Apps/TaskBoard/**'
      - '!samples/Explorer/Apps/TaskBoard/**/*.md'
      - 'test/lattice.explorer.uitests/**'
      - '!test/lattice.explorer.uitests/**/*.md'
      - '.github/workflows/ui-tests.yml'
      - '.github/workflows/ui-test-shards.json'

  # Integration-branch lane, mirroring ci.yml's push trigger (#2972). A pull
  # request INTO a bucket was gated; the bucket itself was not, so its combined
  # state went unevaluated until the epic's single pull request into `main`.
  #
  # ADVISORY, AND MUST NEVER BECOME BRANCH PROTECTION - the same constraint
  # ci.yml states at length. A bucket exists so members merge in any order
  # without invalidating each other.
  #
  # DISCLOSED LIMIT, because it is narrower than it looks: GitHub evaluates a
  # `paths:` filter on a push against the PUSH diff, which on a bucket is the
  # one member that just merged - not the bucket against `main`. So this lane
  # runs on a push only when THAT merge touched Explorer UI files, and a bucket
  # carrying such a change from an earlier member will not re-run it when a
  # later unrelated member lands. That is weaker than ci.yml's push lane, which
  # bypasses diff-scoping entirely. It is accepted rather than worked around:
  # the alternative is provisioning a browser on every bucket merge, and this
  # lane's value on the integration branch is the browser-driven signal that no
  # other lane provides, which is worth having on the merges that touch it.
  push:
    branches: ['*/epic/**']
    paths:
      - 'src/lattice.explorer/**'
      - '!src/lattice.explorer/**/*.md'
      # The Explorer UI links the documentation site's tokens, fonts and favicon
      # at build time (epic #3807, E10), and the browser suite drives the
      # task-board sample app, so a change to either changes what it renders.
      - 'docs-site/template/public/tokens.css'
      - 'docs-site/template/public/favicon.svg'
      - 'docs-site/template/public/fonts/**'
      - 'samples/Explorer/Apps/TaskBoard/**'
      - '!samples/Explorer/Apps/TaskBoard/**/*.md'
      - 'test/lattice.explorer.uitests/**'
      - '!test/lattice.explorer.uitests/**/*.md'
      - '.github/workflows/ui-tests.yml'
      - '.github/workflows/ui-test-shards.json'

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  UI_TEST_PROJECT: test/lattice.explorer.uitests/Orleans.Lattice.Explorer.UiTests.csproj

jobs:
  # The shard definitions live in ui-test-shards.json rather than inline, because
  # the coverage lane has to split this suite exactly the same way and for exactly
  # the same reason (see below). Two hand-maintained copies of these filters would
  # drift, and a drifted complement filter fails silently by leaving cases unrun -
  # the one outcome the complement spelling exists to prevent.
  shards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: load
        run: |
          set -euo pipefail
          echo "matrix=$(jq -c . .github/workflows/ui-test-shards.json)" >> "$GITHUB_OUTPUT"

  browser-ui:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Five shards, run in parallel, split by the suite's namespaces: accessibility
    # (the axe sweep in every appearance and the keyboard, landmark, motion and
    # forced-colour checks), journeys in two halves, apps (the pilot app, the frame
    # isolation suite and the AppKit boot fixture, each in Chromium, Firefox and
    # WebKit), and structure (reflow and the hygiene fixtures). Every shard starts
    # its own in-process test world, so no shard waits on another's head.
    #
    # The structure shard and the second journey shard are defined as COMPLEMENTS,
    # so the five filters cannot leave a case unrun however the fixtures are
    # renamed or added to.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-uitests-${{ runner.os }}-${{ hashFiles('src/lattice.explorer/**/*.csproj', 'test/lattice.explorer.uitests/**/*.csproj') }}
          restore-keys: nuget-uitests-${{ runner.os }}-

      # Build before installing browsers: the Playwright install script is
      # emitted into the build output, so it does not exist until this runs.
      - name: Build UI test project
        run: dotnet build "$UI_TEST_PROJECT" --configuration Release

      # Cache the browser binaries. Keying on the project file hash invalidates
      # the cache exactly when the pinned Microsoft.Playwright version changes,
      # since that version lives in the csproj (this repo does not use central
      # package management), and never otherwise.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('test/lattice.explorer.uitests/**/*.csproj') }}
      # Chromium, Firefox and WebKit. Layout, reflow and accessibility run in
      # Chromium only, but the app frame's isolation is enforced by each engine's
      # own sandbox and policy implementation, so the apps shard runs the pilot,
      # the isolation suite and the AppKit boot fixture in all three engines
      # (epic #3807, issue #3832). Every shard installs all three: the install is
      # cached, and one install step keeps the shards identical.
      #
      # --with-deps installs the OS packages the browsers need; it is skipped on
      # a cache hit because only the browser payload is cached, not apt state, so
      # we still run the deps-only install in that case.
      - name: Install Playwright browsers
        run: |
          set -euo pipefail
          script="$(find test/lattice.explorer.uitests/bin/Release -name playwright.ps1 -print -quit)"
          if [ -z "$script" ]; then
            echo "::error::playwright.ps1 not found under the build output - did the build succeed?"
            exit 1
          fi
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            pwsh "$script" install-deps chromium firefox webkit
          else
            pwsh "$script" install chromium firefox webkit --with-deps
          fi

      # tla-toolchain: not-required - every shard filter here selects
      # TestCategory=UI inside test/lattice.explorer.uitests, which contains no
      # `Tlc`-category fixture. See spec/README.md and
      # CiTlaToolchainProvisioningTests.
      - name: Run browser UI tests
        run: |
          dotnet test "$UI_TEST_PROJECT" --no-build --configuration Release \
            --filter "${{ matrix.filter }}" \
            --logger "trx;LogFileName=ui-tests-${{ matrix.shard }}.trx"

      # Playwright traces and failure screenshots are the only practical way to
      # diagnose a browser failure after the fact, so keep them even on success
      # cancellation paths.
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            **/*.trx
            test/lattice.explorer.uitests/**/playwright-traces/**
            test/lattice.explorer.uitests/**/screenshots/**
          if-no-files-found: ignore
