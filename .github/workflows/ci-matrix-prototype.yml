name: CI (matrix prototype)

# PROTOTYPE. This workflow exists to measure a change to how ci.yml schedules
# its tests, without touching ci.yml or interfering with any other run. It is
# deliberately inert unless you ask for it:
#
#   * `workflow_dispatch` runs it on demand against any ref.
#   * On a pull request it runs ONLY when the PR carries the
#     `ci-matrix-prototype` label. Every job is gated on that, so an unlabelled
#     pull request skips instantly and costs nothing.
#
# It publishes no check name that `main` requires, and its concurrency group is
# its own, so cancelling or re-running it cannot disturb `build-and-test`.
#
# WHAT IT CHANGES. ci.yml runs every selected package's tests serially inside
# one job on one two-core runner: deterministic, then Coyote, then chaos. When
# the dependency closure selects all 46 packages that is about 36 minutes of
# test time, of which roughly half is `test/lattice` alone and about 4 minutes
# is the other 37 packages combined. The problem is not the breadth of the
# selection, it is that none of it overlaps.
#
# Here the same selection is planned into balanced legs that run on separate
# runners, and `test/lattice` is additionally split into shards so it stops
# being the floor. The chaos tier then costs no wall-clock at all: it runs
# beside the deterministic tier rather than queueing behind it.
#
# The parallelism is deliberately ACROSS RUNNERS and never two `dotnet test`
# processes on one runner. These are Orleans TestCluster fixtures with real
# timing assumptions, and a standard runner has two cores; co-scheduling suites
# on one machine would contend for CPU and manufacture the flakiness this
# repository no longer has. `[NonParallelizable]` would not protect against
# that, because it only governs ordering within a single process.

on:
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Which change to plan for'
        type: choice
        default: core
        options:
          - diff
          - core
          - all
      base_ref:
        description: 'Base ref for simulate=diff (default: origin/main)'
        type: string
        default: ''
      max_legs:
        description: 'Maximum number of parallel legs'
        type: string
        default: '10'
  pull_request:
    branches: [main, '*/epic/**', 'release/**']
    # `labeled` is load-bearing: the jobs are gated on the label, so without it
    # applying the label to an open pull request would not start a run.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-matrix-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # The plan job itself is cheap (about 0.2 min: a checkout, a diff, and the
    # selector) and runs for every pull request, because the decision about
    # whether to fan out depends on WHICH files changed, and a job-level `if:`
    # cannot see the diff. The decision is therefore made inside, in the
    # "Decide whether to run" step, which sets `skip` and short-circuits every
    # expensive step after it. The three ways in are:
    #
    #  1. `workflow_dispatch`, for measuring a simulated change set by hand.
    #  2. The `ci-matrix-prototype` label, for opting a single pull request in.
    #  3. Any pull request whose BASE is an epic or bucket integration branch.
    #  4. Any pull request that touches `.github/workflows/**`.
    #
    # The third is the safest place in the repository to adopt this. Repository
    # policy forbids branch protection on an epic branch (that is the whole
    # reason the branch exists - `strict` protection on main is what serialises
    # pull requests and costs O(N^2) CI cycles). With no protection there is no
    # REQUIRED status check, so `build-and-test` on a member pull request is
    # already advisory. A second, faster advisory signal therefore cannot block
    # a merge, cannot break a required-check contract, and needs no
    # branch-protection change to try or to revert. It is also where the serial
    # cost hurts most, since an epic fans out by construction.
    #
    # The fourth exists to close #2351: a workflow-only pull request is the one
    # shape that ci.yml refuses to test, and it is the shape most able to break
    # the test infrastructure for every subsequent pull request. See the
    # "Decide whether to run" step for the argument and the measurement.
    #
    # `contains` rather than a glob because GitHub expressions have no pattern
    # matching. `/epic/` is a reserved segment in the branch convention
    # (`<type>/epic/<slug>`), and buckets reuse that same segment by policy, so
    # a substring test on it catches both and nothing else.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    outputs:
      # Defaulted so that a skipped plan yields a well-formed empty matrix
      # rather than an empty string, which `fromJson` would reject and turn a
      # deliberate no-op into a workflow-level error.
      legs: ${{ steps.plan.outputs.legs || '[]' }}
      leg_count: ${{ steps.plan.outputs.leg_count || '0' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Load-bearing, exactly as in ci.yml: the selector diffs against the
          # MERGE BASE using the three-dot form, which needs the common
          # ancestry of both commits present locally. A shallow clone makes
          # that diff fail outright.
          fetch-depth: 0

      - name: Resolve the change set
        id: changes
        env:
          SIMULATE: ${{ github.event.inputs.simulate || 'diff' }}
          BASE_REF: ${{ github.event.inputs.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          case "$SIMULATE" in
            core)
              # Seed the core library so the ProjectReference closure fans out
              # to every dependent package. This is the worst case the
              # prototype exists to measure, reproducible without needing a
              # real pull request.
              echo 'src/lattice/Primitives/GCounter.cs' > /tmp/changed-files.txt
              ;;
            all)
              # A root file seeds no package, which makes the selector fall
              # back to selecting all of them.
              echo 'Orleans.Lattice.slnx' > /tmp/changed-files.txt
              ;;
            *)
              if [ -z "${BASE_SHA:-}" ]; then
                base="${BASE_REF:-origin/main}"
                git fetch --no-tags --quiet origin main || true
                BASE_SHA="$(git rev-parse "$base")"
                HEAD_SHA="$(git rev-parse HEAD)"
              fi
              # THREE-dot: diff against the merge base, so this reports what
              # THIS branch changed and not the reverse of everything merged
              # into the base since it was cut. See ci.yml for the full
              # argument, and CiChangeDetectionDiffFormTests for the guard.
              git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-files.txt
              ;;
          esac

          echo "Changed files considered:"
          cat /tmp/changed-files.txt

      - name: Decide whether to run
        id: gate
        env:
          # True when this run was opted in explicitly: dispatched by hand,
          # labelled, or targeting an epic/bucket integration branch.
          OPTED_IN: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-matrix-prototype') || contains(github.base_ref, '/epic/') }}
        run: |
          set -euo pipefail

          # Which changed paths can possibly affect a test outcome. This
          # mirrors the `code` paths-filter that gates the discover step in
          # ci.yml, with ONE deliberate difference, called out below.
          #
          # The gate is load-bearing rather than an optimisation. The package
          # selector's documented behaviour when NO package matches the changed
          # paths is to select ALL of them, on the reasoning that a shared or
          # root change could affect anything. That is right for a root change
          # like Directory.Build.props, but a markdown-only diff also matches
          # no package, so without this gate a docs typo fans out to all 46.
          # ci.yml never reaches that fallback because paths-filter stops it
          # first; this workflow calls the selector directly, so it gates here.
          grep -E -v \
            -e '\.md$' \
            -e '\.txt$' \
            -e '^docs/' \
            -e '^docs-site/' \
            -e '^benchmark/' \
            -e '^test/azure-throughput-silo/' \
            -e '^test/lattice\.explorer\.uitests/' \
            -e '^apps/' \
            -e '^reference-architecture/' \
            -e '^\.gitignore$' \
            /tmp/changed-files.txt > /tmp/code-files.txt || true

          # THE DELIBERATE DIFFERENCE, and the fix for #2351.
          #
          # ci.yml's `code` and `nonSample` filters both carry
          # '!.github/workflows/**', so a diff confined to workflow files is
          # skipped outright and `build-and-test` reports a green that is
          # indistinguishable from a run over all 46 packages. That is the
          # unsafe direction: a workflow-only change is the shape most able to
          # break the test infrastructure for every SUBSEQUENT pull request,
          # and it is the one shape guaranteed not to be tested before it
          # merges.
          #
          # #2351 declined to prescribe a fix because the obvious one - let the
          # selector's fallback run - "would put a 46-package run on every
          # workflow edit", and it required the cost to be measured rather than
          # asserted before choosing. That measurement is what this workflow
          # provides, and it changes the answer: a 45-package fan-out costs
          # 8.9 min end-to-end here against 43.9 min serial on the identical
          # commit. A full run on every workflow edit is affordable now that it
          # is not serialised onto one runner.
          #
          # So `.github/workflows/**` is absent from the exclusion list above:
          # it counts as a code change, matches no package, and falls through
          # to the selector's select-all fallback exactly as #2351 describes.
          #
          # The predicate is "touches workflows AT ALL", not "touches only
          # workflows". The hazard #2351 describes is a workflow change
          # reaching main untested, and that hazard is present whether or not
          # the same pull request happens to also edit a README.
          if grep -q -E '^\.github/workflows/' /tmp/changed-files.txt; then
            touches_workflows=true
          else
            touches_workflows=false
          fi
          echo "touches_workflows=$touches_workflows"
          echo "opted_in=$OPTED_IN"

          if [ ! -s /tmp/code-files.txt ]; then
            # Nothing that can change a test outcome. An empty matrix is the
            # correct plan, and the `report` job is skipped rather than green,
            # so the run is not mistakable for one that executed tests.
            reason="no test-relevant files changed"
            skip=true
          elif [ "$OPTED_IN" = "true" ] || [ "$touches_workflows" = "true" ]; then
            reason="opted in (label, epic base, dispatch) or touches workflows"
            skip=false
          else
            # An ordinary pull request into main that did not opt in. While
            # this is a prototype it must not compete with `build-and-test`
            # for runners on unrelated work.
            reason="ordinary pull request, not opted in to the prototype"
            skip=true
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Decision: skip=$skip ($reason)"

      - name: Report a skipped run
        if: steps.gate.outputs.skip == 'true'
        run: |
          set -euo pipefail
          {
            echo "### Test selection: skipped"
            echo ""
            echo "No test legs ran: ${{ steps.gate.outputs.reason }}."
            echo ""
            echo "The \`Matrix result\` check is reported as **skipped** rather"
            echo "than green, so this run cannot be mistaken for one that"
            echo "executed tests."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select packages
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          .github/workflows/select-test-packages.sh \
            --changed-file /tmp/changed-files.txt \
            --report-file /tmp/selection.md \
            > /tmp/selected-packages.txt

          cat /tmp/selection.md >> "$GITHUB_STEP_SUMMARY"

          # The packages the diff touched DIRECTLY, as distinct from the ones
          # pulled in by the dependency closure. A failure in the first is this
          # pull request's doing; a failure in the second may be, or may have
          # been red on the base already. The aggregate report marks the two
          # differently, which is most of the attribution story on a fan-out.
          sed -n 's/^Seeded by changed paths:.*(`\([^`]*\)`).*/\1/p' /tmp/selection.md \
            | tr ' ' '\n' | sed '/^$/d' > /tmp/seeded-packages.txt || true

          echo "Selected $(wc -l < /tmp/selected-packages.txt) package(s), $(wc -l < /tmp/seeded-packages.txt) seeded."

      - name: Plan the matrix
        id: plan
        if: steps.gate.outputs.skip != 'true'
        env:
          MAX_LEGS: ${{ github.event.inputs.max_legs || '10' }}
        run: |
          set -euo pipefail
          python3 .github/workflows/plan-test-matrix.py \
            --packages /tmp/selected-packages.txt \
            --seeded /tmp/seeded-packages.txt \
            --shards .github/workflows/test-shards.json \
            --durations .github/workflows/test-durations.tsv \
            --max-legs "$MAX_LEGS" \
            --output-matrix /tmp/matrix.json \
            --report-file "$GITHUB_STEP_SUMMARY"

          {
            echo "legs<<MATRIX_EOF"
            cat /tmp/matrix.json
            echo ""
            echo "MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "leg_count=$(python3 -c 'import json,sys;print(len(json.load(open("/tmp/matrix.json"))))')" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.leg.name }}
    needs: plan
    # An empty matrix is a valid plan, not a failure: it is what a docs-only or
    # workflow-only change should produce. GitHub would treat `fromJson('[]')`
    # as a matrix with no combinations and skip the job anyway, but stating it
    # explicitly keeps the intent readable in the run graph.
    if: needs.plan.outputs.leg_count != '0'
    runs-on: ubuntu-latest
    strategy:
      # Never fail-fast. A cancelled sibling leg is an unreported leg, and an
      # unreported leg is indistinguishable from a passing one in the summary.
      # On a fan-out the whole point is to learn everything that broke in one
      # cycle rather than one failure at a time.
      fail-fast: false
      max-parallel: 12
      matrix:
        leg: ${{ fromJson(needs.plan.outputs.legs) }}

    # No Azurite service, deliberately. The `build-and-test` job in ci.yml has
    # none, so its emulator-backed fixtures report Inconclusive. Standing one up
    # here would make different tests execute and turn a scheduling comparison
    # into a comparison of two different test sets.

    steps:
      - uses: actions/checkout@v5
        with:
          # Every checkout in a workflow that diffs against the merge base must
          # be full-depth, even the ones that do not diff. The guard checks the
          # file, not the job, and the cost here is small next to the build.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # One whole-solution build per leg. Measured at about 1.2 minutes on a
      # warm NuGet cache, which is cheaper and far simpler than building each
      # leg's own project set, and much cheaper than uploading and downloading
      # a multi-hundred-megabyte Release output as an artifact. If the measured
      # per-leg overhead turns out to dominate, this is the first thing to
      # revisit.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run leg
        env:
          LEG: ${{ toJson(matrix.leg) }}
          LEG_ID: ${{ matrix.leg.id }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # ci.yml widens this on a loaded runner because the digest-settle
          # oracles poll a coalesced projection publish that can take longer
          # than the 20s default under parallel load. Legs are less loaded than
          # the serial job was, but the same budget is kept so a difference in
          # results cannot be attributed to a difference in timeouts.
          LATTICE_DIGEST_SETTLE_TIMEOUT_MS: '60000'
        run: |
          set -euo pipefail
          printf '%s' "$LEG" > /tmp/leg.json
          python3 .github/workflows/run-test-leg.py \
            --leg /tmp/leg.json \
            --results-dir leg-results \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload leg results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: leg-results-${{ matrix.leg.id }}
          path: leg-results/
          retention-days: 7

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-output-${{ matrix.leg.id }}
          path: |
            **/*.trx
            **/*.dmp
            **/Sequence_*.xml
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: Matrix result
    needs: [plan, test]
    if: >-
      always() && needs.plan.result == 'success'
      && needs.plan.outputs.leg_count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download leg results
        uses: actions/download-artifact@v6
        with:
          pattern: leg-results-*
          path: leg-results
          merge-multiple: true

      - name: Aggregate
        run: |
          set -euo pipefail
          python3 .github/workflows/summarise-test-legs.py \
            --results-dir leg-results \
            --expect-legs "${{ needs.plan.outputs.leg_count }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"
