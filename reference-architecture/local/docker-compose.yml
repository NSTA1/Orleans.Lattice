# ---------------------------------------------------------------------------
# Local smoke-test harness for the Orleans.Lattice reference architecture.
#
# Brings up a single-region cluster entirely on your machine, WITHOUT Azure:
#
#   azurite     - Azure Storage emulator (Table + Blob + Queue) backing the
#                 Orleans clustering table, the durable Table WAL, the grain
#                 state store, the reminders table, and the Blob backup sink.
#   silo        - the reference Silo head (hosts/Silo), the always-on cluster.
#   mcp         - the reference MCP head (hosts/Mcp), a stateless gRPC client.
#   explorer    - the reference Explorer web head (hosts/Explorer), a gRPC-web
#                 client to the silo's State + Auth API.
#   prometheus  - scrapes the silo's /metrics OpenTelemetry endpoint.
#   grafana     - grafana/grafana-oss, provisioned with the Prometheus data
#                 source and the bundled Orleans.Lattice dashboards.
#
# Goal: `docker compose up` yields a browsable Explorer (http://localhost:8080)
# and a reachable MCP endpoint (http://localhost:8090) against a live local
# cluster, plus Grafana (http://localhost:3000) with live dashboards.
#
# SECURITY / DEV BYPASS: this harness is a local dev convenience and is NOT a
# secure deployment template. It deliberately runs a fully-open cluster:
#   * Entra auth is DISABLED (Entra__Enabled=false) on every head.
#   * The State/Auth gRPC surface does NOT require authorization
#     (StateApi__RequireAuthorization=false, Mcp__RequireAuthorization=false).
#   * The authorization core runs allow-by-default (Auth__DefaultEffect=Allow).
#   * The MCP head authenticates every request as a fixed synthetic subject
#     (Mcp__DevAuthenticateAll=true) so its fail-closed tool discovery has a
#     credential to scope against and surfaces the full tool set.
#   * Cross-region replication endpoints permit plaintext h2c
#     (Replication__AllowPlaintext=true).
# Every value has a baked-in local dev default, so `docker compose up --build`
# runs with no .env file. The only "secret", the per-cluster replication key, is
# a documented dev placeholder; copy .env.example to .env only to override a
# default. No real secret is ever baked into an image, this file, or source. In
# Azure these toggles flip to their secure defaults (Deny, RequireAuthorization=
# true, Entra enabled, managed identity for storage); see
# reference-architecture/hosts/README.md.
# ---------------------------------------------------------------------------

name: lattice-reference-local

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10002"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  silo:
    build:
      context: ..
      dockerfile: hosts/Silo/Dockerfile
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      # Storage: point every Orleans + Lattice Azure provider at Azurite. The
      # default is the fixed, publicly-documented Azurite emulator connection
      # string (not a secret); override via .env / STORAGE_CONNECTION_STRING.
      Storage__ConnectionString: "${STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;}"
      # Cluster identity.
      Cluster__Id: "lattice-local"
      Cluster__ServiceId: "lattice-local"
      # Dev bypass: allow-by-default authorization + unauthenticated gRPC.
      Auth__DefaultEffect: "Allow"
      StateApi__RequireAuthorization: "false"
      Entra__Enabled: "false"
      # Dev bypass: seed a cluster-wide full-access grant for the synthetic subject
      # the MCP head authenticates every request as (Mcp__DevSubjectId below). MCP
      # tool DISCOVERY advertises a tool group only against an AUTHORED Allow rule,
      # so without this the open local head would surface zero tools. Must match the
      # MCP head's Mcp__DevSubjectId exactly.
      Auth__BootstrapAdministrators: "local-dev-admin"
      # Dev bypass: with Entra off the silo has no identity provider, so a forwarded
      # credential reads as anonymous and the control-plane-isolated authorization
      # tree denies the head's permission introspection. Trust a forwarded bearer
      # token as its named subject when that id is a configured bootstrap admin, so
      # the head is served as the administrator and discovery lights up every tool.
      Auth__DevAuthenticateForwardedSubject: "true"
      # Single-region: no replication peers; plaintext allowed for h2c.
      Replication__AllowPlaintext: "true"
      # Runtime per-tree replication config (8.0.6): enrol the sys-replication-config
      # CRDT tree and co-host the ILatticeReplicationControl facade + its gRPC
      # binding, so the MCP head's lattice_replication_* tools can enable/disable a
      # tree's replication at runtime. On here to smoke-test the plumbing end to end.
      # NOTE: like every plane in this harness it is UNAUTHORIZED - the harness has
      # no identity plane (Entra off), so every caller is anonymous and the open
      # gate admits it. That is fine for a local throwaway (single-region, so an
      # enabled tree has no peer to ship to); the AUTHORIZED replication path (an
      # explicit LatticeOperation.Replication grant) is a deployed-estate concern.
      Replication__EnableRuntimeConfig: "true"
      LATTICE_REPLICATION_SECRET: "${LATTICE_REPLICATION_SECRET:-local-dev-only-not-a-real-secret}"
      # This lone silo owns the backup schedule (primary).
      Backup__Primary: "true"
      Scaling__MinReplicas: "1"
    ports:
      # Silo HTTP (health / scaling signal / Prometheus /metrics).
      - "18080:8080"
      # Silo gRPC (state / auth / replication) - exposed for host-side tooling.
      - "18081:8081"

  mcp:
    build:
      context: ..
      dockerfile: hosts/Mcp/Dockerfile
    depends_on:
      - silo
    environment:
      # Front the silo's gRPC State + Auth facades over h2c by service name.
      Mcp__StateEndpoint: "http://silo:8081"
      Mcp__AuthEndpoint: "http://silo:8081"
      # The read-write Data API rides the same silo gRPC endpoint (enabled by
      # default). Point the head at it and advertise the write tools so the local
      # smoke test can exercise the write path.
      Mcp__DataEndpoint: "http://silo:8081"
      Mcp__EnableDataWrites: "true"
      # The replication control facade rides the same silo gRPC endpoint. Point the
      # head at it and advertise the mutating enable/disable tools so the local
      # smoke test can exercise the lattice_replication_* plumbing end to end. As
      # with every plane here it is UNAUTHORIZED (no identity plane in this harness);
      # the authorized path is demonstrated on a deployed Entra-enabled estate.
      Mcp__ReplicationEndpoint: "http://silo:8081"
      Mcp__EnableReplicationControl: "true"
      # Cluster telemetry tools proxy the local Prometheus.
      Mcp__Telemetry__BackendAddress: "http://prometheus:9090"
      # Dev bypass: open MCP endpoint, no Entra.
      Entra__Enabled: "false"
      Mcp__RequireAuthorization: "false"
      # Dev bypass: MCP tool discovery is fail-closed on the caller's resolved
      # credential, so an open head with no identity plane would advertise ZERO
      # tools. Authenticate every request as a single fixed synthetic subject that
      # the silo has seeded as a bootstrap administrator (Auth__BootstrapAdministrators
      # above), lighting up the full tool set. Only honoured because Entra is off;
      # forced inert in any Entra deployment.
      Mcp__DevAuthenticateAll: "true"
      Mcp__DevSubjectId: "local-dev-admin"
    ports:
      - "8090:8080"

  explorer:
    build:
      context: ..
      dockerfile: hosts/Explorer/Dockerfile
    depends_on:
      - silo
    environment:
      # Standalone Explorer head connects to the silo's State/Auth gRPC endpoint.
      LATTICE_EXPLORER_ENDPOINT: "http://silo:8081"
      # Dev bypass: plaintext h2c to the silo, no Entra sign-in.
      LATTICE_EXPLORER_INSECURE_DEV: "true"
      Entra__Enabled: "false"
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - silo
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      # Bundled provisioning + dashboards shipped by Orleans.Lattice.Dashboards.
      - ../../src/lattice.dashboards/Provisioning/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../../src/lattice.dashboards/Provisioning/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ../../src/lattice.dashboards/Grafana:/var/lib/grafana/dashboards/orleans-lattice:ro
    ports:
      - "3000:3000"
