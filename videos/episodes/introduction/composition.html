    <script>
      (function () {
        const { duration } = window.LatticeMotion;
        window.LatticeCode.highlightAll(document);

        // The overlay's window is stamped into its attributes; its motion is
        // read from them, so it cannot drift from the narration.
        const code = document.getElementById("same-code");
        const start = Number(code.dataset.start);
        const end = start + Number(code.dataset.duration);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(code, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: duration.slow, ease: "lattice-out" }, start + 0.9);
        tl.to(code, { opacity: 0, duration: duration.fast, ease: "power1.in" }, end - duration.fast);

        window.__timelines = window.__timelines || {};
        window.__timelines["introduction"] = tl;
      })();
