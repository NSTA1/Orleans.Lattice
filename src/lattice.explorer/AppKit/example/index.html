<main class="lt-app-stack" aria-labelledby="notes-title">
  <h1 id="notes-title">Notes</h1>
  <p class="lt-app-muted" id="notes-context">Connecting to the Explorer.</p>
  <div class="lt-app-scroll">
  <table class="lt-app-table">
    <caption>Notes in this app's tree</caption>
    <thead>
      <tr><th scope="col">Key</th><th scope="col">Text</th></tr>
    </thead>
    <tbody id="notes-rows"></tbody>
  </table>
  </div>
  <div class="lt-app-row">
    <button type="button" class="lt-app-button" id="notes-refresh">Refresh</button>
  </div>
</main>
