<!doctype html>
<!--
  Orleans.Lattice Explorer AppKit, protocol v1: the app frame bootstrap document.

  Every Lattice App frame loads this same static, app-agnostic document inside
  <iframe sandbox="allow-scripts">, so it runs with an opaque origin. It is
  served with "Content-Security-Policy: sandbox allow-scripts; default-src
  'none'; script-src 'self' blob:; style-src 'self' blob:; ..." (epic #3807,
  E4), so it carries no inline script, no inline style and no third-party
  reference: boot.js and lattice-app.css load from beside it, and everything
  the app ships arrives over the host's MessageChannel port and is
  materialised as blob: URLs. See NUGET_README.md for the protocol.
-->
<html lang="en" data-appkit-protocol="1" data-theme="paper" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lattice App</title>
  <link rel="stylesheet" href="lattice-app.css">
  <script src="boot.js" defer></script>
</head>
<body>
</body>
</html>
