# Grafana provisioning template - Prometheus datasource for Orleans.Lattice dashboards.
# Copy to /etc/grafana/provisioning/datasources/ and customise the URL for your environment.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
