# Orleans.Lattice - benchmark stack (base topology).
#
# Two build contexts in play:
#   * The benchmark silo (`silo`) builds from the lattice repo root (`..`) so it can pull in
#     src/lattice/, src/lattice.replication/, the simulator's Grains/Abstractions, and
#     benchmark/host/Bench.Sink + Bench.Silo. The simulator itself is untouched.
#   * The simulator API (`api`) builds from `samples/VehicleFleetSimulator/` using its own
#     unmodified Dockerfile. The benchmark stack treats it as a black-box load surface.
#
# This file stands the single-cluster topology used by simulator-baseline, current-state-no-replication, skewed-key-shard-splits, replication-key-filter, event-log-with-ttl, observer-no-peer.
# Replication scenarios (current-state-single-peer, replication-backpressure, receiver-crash, bidirectional-replication) overlay docker-compose.replication.yml on top
# to bring up a second silo cluster acting as the replica peer.

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: vfs-azurite
    command:
      - "azurite"
      - "--blobHost=0.0.0.0"
      - "--queueHost=0.0.0.0"
      - "--tableHost=0.0.0.0"
      - "--location=/data"
      - "--skipApiVersionCheck"
      - "--silent"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10002"]
      interval: 5s
      timeout: 3s
      retries: 20

  silo:
    build:
      context: ..
      dockerfile: benchmark/host/Bench.Silo/Dockerfile
    container_name: vfs-silo
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      Orleans__ClusterId: ${BENCH_CLUSTER_ID:-vfs-bench}
      Orleans__ServiceId: ${BENCH_SERVICE_ID:-VehicleFleetSimulator}
      Persistence__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      # Producer pipeline switch - fanout (default), null (simulator-baseline/observer-no-peer control), lattice.
      Telemetry__Sink: ${BENCH_TELEMETRY_SINK:-fanout}
      Telemetry__Prometheus__Endpoint: "http://0.0.0.0:9090/metrics/"
      # LatticeSink bindings (only consumed when Telemetry__Sink=lattice).
      LatticeSink__TreeId: ${BENCH_TREE_ID:-vehicle-fleet}
      LatticeSink__KeyShape: ${BENCH_KEY_SHAPE:-CurrentStateByVehicleId}
      LatticeSink__BatchSize: ${BENCH_BATCH_SIZE:-256}
      LatticeSink__FlushInterval: ${BENCH_FLUSH_INTERVAL:-00:00:00.050}
      LatticeSink__ChannelCapacity: ${BENCH_CHANNEL_CAPACITY:-100000}
      LatticeSink__EventLogTtl: ${BENCH_EVENT_LOG_TTL:-01:00:00}
      LatticeSink__Regions: ${BENCH_REGIONS:-eu-west,eu-east,us-west,us-east}
      LatticeSink__HotRegionShare: ${BENCH_HOT_SHARE:-0.7}
      LatticeSink__DropOnFull: ${BENCH_DROP_ON_FULL:-true}
      # WAL storage provider switch (only consumed when Telemetry__Sink=lattice or
      # Replication__Enabled=true). "memory" keeps the library default in-memory WAL;
      # "azuretable" routes every WAL append through Azure Tables (the same Azurite
      # instance the silo already uses for clustering/reminders). Used by the
      # current-state-no-replication-azuretable and bidirectional-replication-azuretable
      # scenarios to compare durable-WAL throughput against the in-memory baseline.
      Lattice__Wal__Provider: ${BENCH_WAL_PROVIDER:-memory}
      Lattice__Wal__TableName: ${BENCH_WAL_TABLE_NAME:-OrleansLatticeWal}
      # Replication switch (only consumed when Telemetry__Sink=lattice).
      Replication__Enabled: ${BENCH_REPLICATION_ENABLED:-false}
      Replication__OriginClusterId: ${BENCH_REPLICATION_CLUSTER_ID:-vfs-bench}
      Replication__KeyPrefixes: ${BENCH_REPLICATION_KEY_PREFIXES:-}
      # Replication gRPC wiring. The origin is a sender to the replica (vfs-bench-replica)
      # for every replication-enabled scenario; the replica also acts as a sender back to
      # the origin only in bidirectional-replication. The server side listens whenever
      # replication is enabled so the origin can ALSO be a receiver in the bidirectional
      # case. Port 5001 (HTTP/2) inside the container; origin→replica traffic stays on the
      # docker network so we don't host-publish it.
      Replication__GrpcServerEnabled: ${BENCH_REPLICATION_ENABLED:-false}
      Replication__GrpcPort: "5001"
      # The well-known target for the origin silo is the replica cluster id
      # vfs-bench-replica. The endpoint is empty/unset for non-replication scenarios; the
      # configuration binder + the .Where(...) filter in Bench.Silo's GrpcPeers reader
      # discard empty values, leaving the no-op transport in place.
      Replication__GrpcPeers__vfs-bench-replica: ${BENCH_ORIGIN_PEER_ENDPOINT:-}
      # Per-(tree, peer) shipper grain phase-timer period in ms. Unset/empty falls back to
      # the library default of 100 ms; lowering reduces the worst-case ship latency floor
      # when the doorbell signal is unavailable. Used by the ship-cadence sweep.
      Replication__ShipPhaseTimerMs: ${BENCH_SHIP_PHASE_TIMER_MS:-}
      # Read-driver bindings (only consumed when Telemetry__Sink=lattice). Drives the read-heavy-*
      # and read-write-mix-* scenarios.
      ReadDriver__Enabled: ${BENCH_READ_DRIVER_ENABLED:-false}
      ReadDriver__TreeId: ${BENCH_TREE_ID:-vehicle-fleet}
      ReadDriver__RatePerSecond: ${BENCH_READ_RATE_PER_SECOND:-0}
      ReadDriver__Pattern: ${BENCH_READ_PATTERN:-Random}
      ReadDriver__Concurrency: ${BENCH_READ_CONCURRENCY:-16}
      ReadDriver__WarmupDelay: ${BENCH_READ_WARMUP:-00:00:15}
      ReadDriver__KeyspaceRefreshInterval: ${BENCH_READ_KEYSPACE_REFRESH:-00:00:10}
      ReadDriver__KeyspaceSampleSize: ${BENCH_READ_KEYSPACE_SAMPLE:-4096}
      # Atomic-saga driver bindings (only consumed when Telemetry__Sink=lattice). Drives the
      # atomic-write and atomic-write-replication scenarios - generates a steady stream of
      # SetManyAtomicAsync sagas into the replicated tree to exercise the WAL-only prepare
      # path and the per-saga AtomicWriteGrain RPS ceiling. Defaults are off so non-atomic
      # scenarios stay unaffected.
      AtomicSagaDriver__Enabled: ${BENCH_ATOMIC_SAGA_DRIVER_ENABLED:-false}
      AtomicSagaDriver__TreeId: ${BENCH_TREE_ID:-vehicle-fleet}
      AtomicSagaDriver__RatePerSecond: ${BENCH_ATOMIC_SAGA_DRIVER_RATE:-0}
      AtomicSagaDriver__Concurrency: ${BENCH_ATOMIC_SAGA_DRIVER_CONCURRENCY:-16}
      AtomicSagaDriver__BatchSize: ${BENCH_ATOMIC_SAGA_DRIVER_BATCH_SIZE:-16}
      AtomicSagaDriver__KeyspaceSize: ${BENCH_ATOMIC_SAGA_DRIVER_KEYSPACE:-4000}
      AtomicSagaDriver__KeyPrefix: ${BENCH_ATOMIC SAGA_DRIVER_KEY_PREFIX:-atomic-}
      AtomicSagaDriver__ValueSizeBytes: ${BENCH_ATOMIC_SAGA_DRIVER_VALUE_BYTES:-256}
      AtomicSagaDriver__WarmupDelay: ${BENCH_ATOMIC_SAGA_DRIVER_WARMUP:-00:00:15}
    expose:
      - "11111"
      - "30000"
      - "9090"
      - "5001"

  api:
    # Simulator API used unmodified - its existing Dockerfile expects the simulator-local context.
    build:
      context: ../samples/VehicleFleetSimulator
      dockerfile: src/VehicleFleetSimulator.Api/Dockerfile
    container_name: vfs-api
    depends_on:
      azurite:
        condition: service_healthy
      silo:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Orleans__ClusterId: ${BENCH_CLUSTER_ID:-vfs-bench}
      Orleans__ServiceId: ${BENCH_SERVICE_ID:-VehicleFleetSimulator}
      Persistence__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: vfs-prometheus
    depends_on:
      silo:
        condition: service_started
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2h"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: vfs-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/orleans-lattice:ro
    ports:
      - "3000:3000"

volumes:
  azurite-data:
