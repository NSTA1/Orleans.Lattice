# Prometheus scrape config — single-cluster topology (B-01, B-03, B-05, B-09, B-10, B-11, B-12).
# The silo container exposes the OpenTelemetry Prometheus AspNetCore exporter on :9090
# under the /metrics path, binding meters orleans.lattice, orleans.lattice.replication,
# and vehicle_fleet_simulator.sink.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: vfs-bench

scrape_configs:
  - job_name: silo
    metrics_path: /metrics
    static_configs:
      - targets:
          - silo:9090
        labels:
          cluster: vfs-bench
          role: origin
