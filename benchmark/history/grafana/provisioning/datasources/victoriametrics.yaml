apiVersion: 1

# VictoriaMetrics speaks PromQL, so we register it as a Prometheus-type
# datasource. Same query language as the per-run dashboards - this keeps the
# history dashboard consistent with the live Lattice ones.
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 60s
