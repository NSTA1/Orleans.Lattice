\* Variant configuration for WalBulkSwitch.tla: the never-written shard (#5812, B2).
\* The shard has no root when the load begins, so the load opens no token, stores
\* no hint and seeds unstamped and reported; a batch write may seed a root O while
\* the load runs, and the publish then falls back to the switched path (review Q2).
\* No run and no narrow timeout (a load replaces a root rather than grafting onto
\* one); a crash and an abandoned attempt as in the base
\* (see "Variant configurations" in spec/README.md). Every invariant of the base.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalBulkSwitch.Skip.cfg WalBulkSwitch.tla

SPECIFICATION Spec

CONSTANTS
    WithRun = FALSE
    WithCrash = TRUE
    WithTimeout = FALSE
    NeverWritten = 1

INVARIANTS
    TypeOK
    BulkHintBound
    ContestedKeyAgrees
    HintOnlyWhileOpen
    SeedCovered
    ReplacedRootRelocated
