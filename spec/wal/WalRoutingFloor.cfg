\* TLC model configuration for WalRoutingFloor.tla
\* Bounded instance: L's shard root s and a second shard root s2, the purged
\* incarnation's generations in 1..2, a WAL partition of three offsets, both
\* purge kinds (the new build's and one that finished on 10.2.0, with the
\* re-seed catch-up and a duplicate shard-root activation), and a WAL shard
\* reactivation. Safety only: the three guarantees (two invariants and an action
\* property) and TypeOK.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalRoutingFloor.cfg WalRoutingFloor.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    WithSecondInitiator = TRUE
    WithLegacyPurge = TRUE
    WithRestart = TRUE

INVARIANTS
    TypeOK
    StraddlerBelowInit
    LiveGenerationAboveFloor

PROPERTIES
    InitHeadCoversPriorAllocations
