\* Variant configuration for WalLiveAdvanceCore.tla: the claimless live advance (#5837) with a
\* stale duplicate's forward chain (F2'): every forwarder on the chain, up to k, is
\* stamped and attributed under the empty token; past k the record goes unstamped.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeReforward.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 0
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = TRUE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = TRUE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = TRUE
    WithTransferRefresh = FALSE
    WithOtherLinkRaise = FALSE
    WithKeyFilter = FALSE
    WithSplitCap = FALSE
    WithEvictAlone = FALSE
    WithEpochOnly = FALSE
    WithForwardIn = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    PreArmCostWitness
    ReclaimCostBound
    SoleActivationNeverFallsOff
