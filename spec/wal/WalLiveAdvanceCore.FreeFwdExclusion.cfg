\* Variant configuration for WalLiveAdvanceCore.tla: the claimless live advance (#5837) with the
\* forward-exclusion relief: the live donor and a stale duplicate each split it, and
\* the live one forwards a moved key's write before or after its narrow persists or
\* loses. No hand-off window and no 10.2.0 silo. Safety only.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeFwdExclusion.cfg WalLiveAdvanceCore.tla

