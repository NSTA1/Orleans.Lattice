\* Variant configuration for WalHandOffFence.tla: the same specification as
\* WalHandOffFence.cfg with the stale duplicate donor of WalHandOffFence.StaleDonor.cfg under #5833's pre-arm,
\* where the splitting activation may never have claimed. Safety only: every invariant
\* and the action property.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalHandOffFence.StaleDonorPreArm.cfg WalHandOffFence.tla

SPECIFICATION Spec

CONSTANTS
    WithBatch = TRUE
    MaxWindows = 1
    WithRestart = FALSE
    WithTreeWalk = TRUE
    WithLegacyHandOff = TRUE
    WithPreArm = TRUE
    WithDeferredClose = FALSE
    WithRearmRace = FALSE
    WithStaleDonor = TRUE

INVARIANTS
    TypeOK
    HandOffBound
    AbsentMarkerHolds
    DeferredHeadAtRaisedGeneration
    LiveDonorProgress
    StaleDetectionHonoured

PROPERTIES
    CloseHeadMonotone
