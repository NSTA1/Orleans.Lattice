\* Variant configuration for WalDurability.tla: the environment may destroy a
\* leaf's durable snapshot (storage loss or an operator deletion, issue #4634),
\* at a budget of two faults so that a snapshot can vanish and its leaf then
\* stop. Destroyed data is outside the durability properties by construction,
\* so this variant checks the properties that say the loss is never silent:
\* no leaf ever serves a read position past an owned write it does not hold.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config WalDurability.SnapshotLoss.cfg WalDurability.tla

SPECIFICATION Spec

CONSTANTS
    l1 = l1
    l2 = l2
    MaxFaults = 2
    SnapshotLoss = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    ShippingNeverSkips
    OffsetContiguity
    RecoveryNeverFallsOffLog
    PersistedBeliefHonest
    LogPrefixApplied

PROPERTIES
    PublishedPinWithinPersistedBelief