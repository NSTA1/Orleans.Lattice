\* Variant configuration for WalLiveAdvanceCore.tla: the claimless live advance (#5837) for a split-born
\* receiver with a duplicate activation: the live donor's writes after the heads, its
\* narrow, drain and close at its moved-key high, the per-leaf transfer class and the
\* stale donor; no link, so the deferred close stays pending. Liveness included.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeSplitBirth.cfg WalLiveAdvanceCore.tla

SPECIFICATION LiveSpec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = TRUE
    WithSplitHint = FALSE
    WithSplitBirth = TRUE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    PreArmCostWitness
    ReclaimCostBound
    SoleActivationNeverFallsOff
    TransferCostWitness
    DeferredHeadCostWitness
    NarrowObligated

PROPERTIES
    NewbornPinEventuallyUsable
