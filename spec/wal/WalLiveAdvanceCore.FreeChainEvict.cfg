    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = TRUE
    WithTransferRefresh = FALSE
    WithOtherLinkRaise = FALSE
    WithKeyFilter = FALSE
    WithSplitCap = FALSE
    WithEvictAlone = TRUE
    WithEpochOnly = FALSE
    WithForwardIn = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

