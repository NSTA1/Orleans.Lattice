\* Variant configuration for WalLiveAdvanceCore.tla: the forward chain of FreeReforward (F2') with an
\* eviction and no WAL shard restart and without the orphan's own forward, so the eviction's fold
\* of the chain's records is checked (a5e2e2ef's S-a).
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeChainEvict.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

