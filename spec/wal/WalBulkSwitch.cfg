\* TLC model configuration for WalBulkSwitch.tla
\* Bounded instance: one WAL partition of four offsets, one key in the appended
\* range, the old rightmost leaf and the appended leaf, and every environment
\* step once: O's pre-switch write, a commit O admits and stores in two steps, a
\* foreign record of the range, a crash of the shard root before or during the
\* graft, a drain past its deadline, and the run's earlier completed switch.
\* N's seed is a WAL record under the switch's generation, and the operation may be
\* abandoned once and retried, its seed still in flight (#5812).
\* Safety only: the four guarantees, HintOnlyWhileOpen and TypeOK.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalBulkSwitch.cfg WalBulkSwitch.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    WithRun = TRUE
    WithCrash = TRUE
    WithTimeout = TRUE
    NeverWritten = 0

INVARIANTS
    TypeOK
    BulkHintBound
    ContestedKeyAgrees
    HintOnlyWhileOpen
    SeedCovered
    ReplacedRootRelocated
