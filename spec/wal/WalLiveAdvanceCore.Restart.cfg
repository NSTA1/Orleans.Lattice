\* Variant configuration for WalLiveAdvanceCore.tla: the same specification and
\* the same instance as WalLiveAdvanceCore.cfg, with one more environment step:
\* a WAL shard restart, which resets the in-memory unstamped watermark to the
\* recovered allocator head minus one
\* (see "Variant configurations" in spec/README.md). Safety only: every
\* invariant of the base.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.Restart.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = TRUE
    WithGateFlip = FALSE
    WithRestart = TRUE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = FALSE
    WithFreeAdvance = FALSE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = FALSE
    WithForwardIn = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
