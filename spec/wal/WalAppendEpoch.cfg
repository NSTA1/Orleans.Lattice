\* TLC model configuration for WalAppendEpoch.tla
\* Bounded instance: one leaf L at one WAL partition of three offsets, its born
\* activation and one duplicate (which also stands for the next activation after
\* a stop or a clear), epochs up to 3, and every environment step once: a WAL
\* shard restart, another leaf's retirement, L's three-step clear, and bumps
\* forced on a second partition. Safety only: the four guarantees and TypeOK.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalAppendEpoch.cfg WalAppendEpoch.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    WithRestart = TRUE
    WithRecreate = TRUE
    WithOtherRetire = TRUE
    WithSecondPartition = TRUE

INVARIANTS
    TypeOK
    StaleEpochNeverAppends
    ClaimHeadCoversPriorAppends
    RaisedEpochUnique
    OnlySupersededRefused
