\* Permanently resident foreground writer: no faults or deactivation, with
\* every safety invariant and the four liveness properties of the base model
\* checked under actual replay triggers. No leaf is born (BornAtInit = FALSE),
\* so a populated leaf relies on the timer-scheduled replay, whose fairness
\* holds for an unborn leaf (issue #5593); NewbornPinEventuallyUsable, which is
\* about born leaves, is checked by the base configuration.
SPECIFICATION Spec

CONSTANTS
    l1 = l1
    l2 = l2
    MaxFaults = 0
    BornAtInit = FALSE

INVARIANTS
    TypeOK
    AckedWriteDurable
    TrimCoveredBySnapshot
    ReadPositionHonest
    LogPrefixApplied
    ClearRecorded
    ShippingNeverSkips
    OffsetContiguity
    RecoveryNeverFallsOffLog
    PersistedBeliefHonest
    ReleaseBackedBySnapshot

PROPERTIES
    SnapshotCoverageMonotonic
    PublishedPinWithinPersistedBelief
    EveryAckedWriteMaterialised
    ReclamationEventuallyAdvances

ACTION_CONSTRAINT
    PurgeFreezesProtocol
