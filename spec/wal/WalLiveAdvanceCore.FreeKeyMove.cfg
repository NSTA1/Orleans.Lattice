\* Variant configuration for WalLiveAdvanceCore.tla: the claimless live advance (#5837) with a
\* key-moving close: its pending deferred close bounds the advance by the stale donor's
\* staleHigh. Every property, liveness included, with no claim fair.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeKeyMove.cfg WalLiveAdvanceCore.tla

SPECIFICATION LiveSpec

CONSTANTS
    MaxWindows = 0
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = TRUE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = FALSE
    WithTransferRefresh = FALSE
    WithSplitCap = FALSE
    WithEvictAlone = FALSE
    WithEpochOnly = FALSE
    WithForwardIn = FALSE
    WithKeyMove = TRUE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    PreArmCostWitness
    ReclaimCostBound
    SoleActivationNeverFallsOff

PROPERTIES
    NewbornPinEventuallyUsable
