\* Variant configuration for WalLiveAdvanceCore.tla: the split-born receiver of FreeSplitBirth with the
\* link, a donor restart before and after its close, and no duplicate: the resumed close
\* (rule R), the deferred bound written at the close (rule S), and the link re-driven from
\* the durable obligation. Liveness included: the link eventually happens.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeSplitLink.cfg WalLiveAdvanceCore.tla

