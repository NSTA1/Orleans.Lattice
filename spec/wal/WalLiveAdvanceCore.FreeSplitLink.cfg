    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = TRUE
    WithSplitHint = FALSE
    WithSplitBirth = TRUE
    WithDonorRestart = TRUE
    WithDuplicate = FALSE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = FALSE
    WithTransferRefresh = FALSE
    WithOtherLinkRaise = FALSE
    WithKeyFilter = FALSE
    WithReportFetch = FALSE
    WithSplitCap = FALSE
    WithEvictAlone = FALSE
    WithEpochOnly = FALSE
    WithForwardIn = FALSE
    WithKeyMove = TRUE
    WithClaimedPurge = TRUE

