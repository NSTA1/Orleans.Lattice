\* TLC model configuration for WalLiveAdvanceCore.tla
\* Bounded instance: one leaf L at one WAL partition of three offsets, its born
\* activation and one duplicate, one foreign hand-off window and a 10.2.0 silo's
\* unstamped append, with the epoch, hand-off and unstamped assumptions as
\* environment steps. The restart, gate-flip, purge and bulk-birth environments
\* are the variant configurations. Safety only: the four guarantees and TypeOK.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.cfg WalLiveAdvanceCore.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = TRUE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = FALSE
    WithBulk = FALSE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
