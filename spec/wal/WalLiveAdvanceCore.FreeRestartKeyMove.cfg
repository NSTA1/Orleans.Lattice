\* Variant configuration for WalLiveAdvanceCore.tla: the claimless live advance (#5837) with a deferred
\* close pending across a WAL shard restart: staleHigh falls back to the start head minus
\* one. No duplicate, to stay within the case budget.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeRestartKeyMove.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 0
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithRestart = TRUE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = TRUE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = FALSE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithKeyMove = TRUE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    ReclaimCostBound
    SoleActivationNeverFallsOff
