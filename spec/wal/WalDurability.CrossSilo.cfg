\* Variant configuration for WalDurability.tla: the base's instance and faults
\* with the WAL shard's lost activation allowed to move to another silo, whose
\* successor cannot see the predecessor's abandoned calls still in motion
\* (issue #5799; see "Variant configurations" in spec/README.md). The base
\* keeps such moves off because its liveness check would pass the TLC budget,
\* so this variant checks every invariant and the action properties.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalDurability.CrossSilo.cfg WalDurability.tla

SPECIFICATION Spec

CONSTANTS
    l1 = l1
    l2 = l2
    WithCrossSiloMove = TRUE

INVARIANTS
    TypeOK
    AckedWriteDurable
    TrimCoveredBySnapshot
    ReadPositionHonest
    LogPrefixApplied
    ClearRecorded
    ShippingNeverSkips
    OffsetContiguity
    AckedOccupies
    AllocatorAboveOrphans
    GuardCoversFence
    OffsetWrittenOnce
    RecoveryNeverFallsOffLog
    PersistedBeliefHonest
    ReleaseBackedBySnapshot

PROPERTIES
    SnapshotCoverageMonotonic
    TailMonotone
    RecoverNeverInsideCommitted
    PublishedPinWithinPersistedBelief

\* Once a purge has begun, explore only the purge's clears and re-creates.
ACTION_CONSTRAINT
    PurgeFreezesProtocol
