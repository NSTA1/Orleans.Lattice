\* Variant configuration for WalDurability.tla: the same specification with a
\* budget of TWO environment faults, checked against every invariant and both
\* action properties. The two liveness properties stay in WalDurability.cfg at
\* one fault: at two they take about ten minutes, past the TLC budget (see
\* "Variant configurations" in spec/README.md). Issue #4523 needed a second fault
\* to be reachable.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config WalDurability.TwoFaults.cfg WalDurability.tla

SPECIFICATION Spec

CONSTANTS
    l1 = l1
    l2 = l2
    MaxFaults = 2

INVARIANTS
    TypeOK
    AckedWriteDurable
    TrimCoveredBySnapshot
    ReadPositionHonest
    ShippingNeverSkips
    OffsetContiguity
    RecoveryNeverFallsOffLog
    PersistedBeliefHonest
    ReleaseBackedBySnapshot

PROPERTIES
    SnapshotCoverageMonotonic
    PublishedPinWithinPersistedBelief
