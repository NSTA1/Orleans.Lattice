\* Variant of WalLiveAdvance.cfg: the base instance plus superseded activations that keep the marker state they last saw.
\* Safety only. Counts are in the design note.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceFrozenView.cfg WalLiveAdvance.tla

CONSTANTS
    WithRecreate = FALSE
    WithRestart = FALSE
    FrozenView = TRUE
    Ghosts = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    StaleEpochNeverAppends
