\* Variant: the retirement of another leaf of the partition, which raises the shared retired floor above epochs L holds (#5635). Ghosts on, so the witness-gated StaleAppend runs and OnlySupersededRefused checks appends as well as claims. Reduced instance: point writes, one hand-off window.
\* Safety only. Counts are in the design note.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceOtherRetire.cfg WalLiveAdvance.tla

CONSTANTS
    WithBatch = FALSE
    MaxWindows = 1
    WithDuplicate = TRUE
    WithRecreate = FALSE
    WithRestart = FALSE
    FrozenView = FALSE
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithSecondPartition = FALSE
    WithSecondInitiator = FALSE
    WithLegacyPurge = FALSE
    WithOtherRetire = TRUE
    WithTreeWalk = FALSE
    WithLegacyHandOff = FALSE
    Ghosts = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    StaleEpochNeverAppends
    OldNeverRejected
    ContestedKeyAgrees
    OnlySupersededRefused
