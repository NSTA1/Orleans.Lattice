\* Design model for the fenced live checkpoint advance (LiveAdvanceDesign.md). Base instance: one WAL partition of three offsets; one owner leaf with a born activation and a duplicate; a foreign author with point and batch writes and two hand-off windows; a pre-existing writer whose rows the bulk graft relocates (#5610).
\* Safety only. Counts are in the design note.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvance.cfg WalLiveAdvance.tla

CONSTANTS
    WithBatch = TRUE
    MaxWindows = 2
    WithDuplicate = TRUE
    WithRecreate = FALSE
    WithRestart = FALSE
    FrozenView = FALSE
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithLegacyHandOff = FALSE
    Ghosts = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    StaleEpochNeverAppends
    OldNeverRejected
