\* Design model for the fenced live checkpoint advance (LiveAdvanceDesign.md).
\* Base instance: one WAL partition of three offsets; one owner leaf with a born
\* activation and a duplicate (which also stands for the next activation after a
\* stop); a foreign author with point and batch writes and two hand-off windows
\* (the bulk switch and one more); a pre-existing writer whose rows the bulk graft
\* relocates (#5610). The variant configurations switch on a purge and
\* re-creation (WalLiveAdvanceRecreate.cfg), a WAL shard restart
\* (WalLiveAdvanceRestart.cfg), frozen marker views (WalLiveAdvanceFrozenView.cfg)
\* and an unstamped 10.2.0-era author (WalLiveAdvanceMixed.cfg). Safety only.
\* Counts are in the design note.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvance.cfg WalLiveAdvance.tla

CONSTANTS
    WithDuplicate = TRUE
    WithRecreate = FALSE
    WithRestart = FALSE
    FrozenView = FALSE
    WithMixedVersion = FALSE
    Ghosts = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    StaleEpochNeverAppends
    OldNeverRejected
