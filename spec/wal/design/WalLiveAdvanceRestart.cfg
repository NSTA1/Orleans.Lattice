\* Variant of WalLiveAdvance.cfg: the base instance plus a WAL shard restart (a reactivation or a move's cutover) that loses the in-memory epoch entries.
\* Safety only. Counts are in the design note.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceRestart.cfg WalLiveAdvance.tla

CONSTANTS
    WithDuplicate = TRUE
    WithRecreate = FALSE
    WithRestart = TRUE
    FrozenView = FALSE
    WithMixedVersion = FALSE
    Ghosts = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    StaleEpochNeverAppends
    OldNeverRejected
