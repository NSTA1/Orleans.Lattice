\* Variant: the Recreate variant plus purges that finish on 10.2.0 (WithLegacyPurge), and the new build's catch-up of the predating marker (#5697 review, S2). Reduced instance: no duplicate (a 10.2.0 clear keeps the epoch row, so the running activation stays current), Ghosts off.
\* Safety only. Counts are in the design note.
