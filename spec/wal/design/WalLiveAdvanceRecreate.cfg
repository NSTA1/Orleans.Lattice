\* Variant of WalLiveAdvance.cfg: the base instance plus a purge and re-creation of the leaf, which retires its epoch entry and raises the partition's retired floor.
\* Safety only. Counts are in the design note.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceRecreate.cfg WalLiveAdvance.tla

CONSTANTS
    WithDuplicate = TRUE
    WithRecreate = TRUE
    WithRestart = FALSE
    FrozenView = FALSE
    WithMixedVersion = FALSE
    Ghosts = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    StaleEpochNeverAppends
    OldNeverRejected
