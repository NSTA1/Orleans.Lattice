\* Variant: a floor-only refusal on a second partition bumps an activation's one epoch after it was raised here, so it stamps this partition with an epoch never claimed here. Reduced instance: point writes, one hand-off window.
\* Safety only. Counts are in the design note.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceTwoPartition.cfg WalLiveAdvance.tla

