    WithRestart = FALSE
    FrozenView = FALSE
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithSecondPartition = TRUE
    WithOtherRetire = FALSE
    WithTreeWalk = FALSE
    WithLegacyHandOff = FALSE
    Ghosts = FALSE

SPECIFICATION Spec

