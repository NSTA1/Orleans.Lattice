\* Variant: another shard's range-delete walk, with two hand-off windows, so a walk rejected by one delete's close can re-stamp under a second, concurrent delete's intent. Point writes.
\* Safety only. Counts are in the design note.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceTreeWalkConcurrent.cfg WalLiveAdvance.tla

CONSTANTS
    WithBatch = FALSE
    MaxWindows = 2
    WithDuplicate = TRUE
    WithRecreate = FALSE
    WithRestart = FALSE
    FrozenView = FALSE
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithSecondPartition = FALSE
    WithOtherRetire = FALSE
    WithTreeWalk = TRUE
    WithLegacyHandOff = FALSE
    Ghosts = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    StaleEpochNeverAppends
    OldNeverRejected
    ContestedKeyAgrees
    CurrentNeverFenced
