\* Variant configuration for WalLiveAdvanceCore.tla: the claimless live advance (#5837) with the
\* donor forwarding into its split-born receiver before the link, and a stale D' forwarding
\* into another orphan: L's staleHigh excludes only its own split's tag.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeForwardIn.cfg WalLiveAdvanceCore.tla

SPECIFICATION LiveSpec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = TRUE
    WithSplitHint = FALSE
    WithSplitBirth = TRUE
    WithDonorRestart = TRUE
    WithDuplicate = FALSE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = FALSE
    WithEvictAlone = FALSE
    WithEpochOnly = FALSE
    WithForwardIn = TRUE
    WithKeyMove = TRUE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    PreArmCostWitness
    ReclaimCostBound
    SoleActivationNeverFallsOff
    TransferCostWitness
    DeferredHeadCostWitness
    NarrowObligated

PROPERTIES
    NewbornPinEventuallyUsable
    SplitEventuallyLinked
