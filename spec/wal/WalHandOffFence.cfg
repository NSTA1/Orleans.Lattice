\* TLC model configuration for WalHandOffFence.tla
\* Bounded instance: one owner leaf L's hand-off marker at one WAL partition of
\* three offsets, one foreign initiator with point and batch writes over two
\* hand-off windows, generations up to 3, and every environment step on: a WAL
\* shard restart, another shard's range-delete walk with another intent's close,
\* and a hand-off in flight across the fence gate's opening. Safety only: the three
\* guarantees (two invariants and an action property) and TypeOK.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalHandOffFence.cfg WalHandOffFence.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    WithBatch = TRUE
    MaxWindows = 2
    WithRestart = TRUE
    WithTreeWalk = TRUE
    WithLegacyHandOff = TRUE
    WithPreArm = FALSE
    WithDeferredClose = FALSE
    WithRearmRace = FALSE
    WithStaleDonor = FALSE

INVARIANTS
    TypeOK
    HandOffBound
    AbsentMarkerHolds
    DeferredHeadAtRaisedGeneration
    LiveDonorProgress
    StaleDetectionHonoured

PROPERTIES
    CloseHeadMonotone
