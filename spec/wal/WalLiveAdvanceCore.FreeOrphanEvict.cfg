\* Variant configuration for WalLiveAdvanceCore.tla: an orphan's forward (FreeOrphan) with an eviction
\* and no WAL shard restart, so the eviction's fold of the orphan's forward is checked
\* (a5e2e2ef's S-a).
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeOrphanEvict.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

