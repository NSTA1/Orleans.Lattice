    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = TRUE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = FALSE
    WithTransferRefresh = FALSE
    WithSplitCap = FALSE
    WithEvictAlone = TRUE
    WithEpochOnly = FALSE
    WithForwardIn = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

