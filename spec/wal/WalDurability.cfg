\* TLC model configuration for WalDurability.tla
\* Bounded instance: one WAL partition of three offsets shared by two leaves,
\* with a budget of one environment fault (a shard crash, a leaf stop, a failed
\* persist or a failed capture), checked with every safety and liveness property.
\* WalDurability.TwoFaults.cfg checks every safety invariant at two faults.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config WalDurability.cfg WalDurability.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    l1 = l1
    l2 = l2

INVARIANTS
    TypeOK
    AckedWriteDurable
    TrimCoveredBySnapshot
    ReadPositionHonest
    ShippingNeverSkips
    OffsetContiguity
    RecoveryNeverFallsOffLog
    PersistedBeliefHonest
    ReleaseBackedBySnapshot

PROPERTIES
    SnapshotCoverageMonotonic
    PublishedPinWithinPersistedBelief
    EveryAckedWriteMaterialised
    ReclamationEventuallyAdvances
