\* Variant configuration for WalRoutingFloor.tla: the same specification and the
\* same environment as WalRoutingFloor.cfg with the purged incarnation's
\* generations anywhere in 1..3 and every generation up to 5, so the two shard
\* roots' generations, floors and re-created seeds can differ by more than one
\* (see "Variant configurations" in spec/README.md). Safety only: every
\* invariant of the base.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalRoutingFloor.WideGenerations.cfg WalRoutingFloor.tla

SPECIFICATION Spec

CONSTANTS
    WithSecondInitiator = TRUE
    WithLegacyPurge = TRUE
    WithRestart = TRUE
    MaxInitGen = 3
    MaxGen = 5

INVARIANTS
    TypeOK
    StraddlerBelowInit
    LiveGenerationAboveFloor
