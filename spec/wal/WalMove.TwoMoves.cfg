\* TLC model configuration for WalMove.tla, variant TwoMoves.
\* Two moves of the same stream, each with its own coordinator, so a move can
\* take over another move's lapsed fence while the other is still copying.
\* Checked with every safety and liveness property.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config WalMove.TwoMoves.cfg WalMove.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    MoveIds = {"m1", "m2"}

INVARIANTS
    TypeOK
    MovedStreamKeepsAckedWrites
    CopyTakenQuiesced
    ReaderNeverPassesHole
    AllocatorNeverReissues

PROPERTIES
    StreamEventuallyComplete
    FenceEventuallyReleased