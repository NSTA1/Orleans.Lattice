\* TLC model configuration for WalLiveAdvanceComposite.tla
\* The five live-advance modules' interface at minimal constants: one partition
\* of two offsets, two of L's activations, a foreign author F and the purged
\* incarnation's shard root S, both purge kinds, one WAL shard restart and a
\* bulk birth. Every producer guarantee is a step constraint; each edge
\* invariant holds unless a kept step fails the assumption its consumer makes.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceComposite.cfg WalLiveAdvanceComposite.tla
\* See README.md for details.

