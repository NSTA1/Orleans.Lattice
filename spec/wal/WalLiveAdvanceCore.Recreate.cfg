\* Variant configuration for WalLiveAdvanceCore.tla: the same specification and
\* the same instance as WalLiveAdvanceCore.cfg, with one more environment step:
\* L's tree purged and re-created: the marker deleted, every running activation
\* retired, a straddler of the purged incarnation and the re-created
\* incarnation's first initialisation
\* (see "Variant configurations" in spec/README.md). Safety only: every
\* invariant of the base.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.Recreate.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = TRUE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = TRUE
    WithBulk = FALSE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
