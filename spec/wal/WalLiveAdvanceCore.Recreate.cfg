\* Variant configuration for WalLiveAdvanceCore.tla: the same specification and
\* the same instance as WalLiveAdvanceCore.cfg, with one more environment step:
\* L's tree purged and re-created: the marker deleted, every raised epoch
\* retired, a straddler of the purged incarnation and the re-created
\* incarnation's first initialisation. This slice takes the purges that find a1
\* claimed (WithUnclaimedSurvivor = FALSE); RecreateSurvivor and
\* RecreateSurvivorMixed take the rest (see "Variant configurations" in
\* spec/README.md and the refinement note's property classification). Safety
\* only: every invariant of the base.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.Recreate.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = TRUE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = TRUE
    WithBulk = FALSE
    WithUnclaimedSurvivor = FALSE
    WithPreArm = FALSE
    WithFreeAdvance = FALSE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = FALSE
    WithTransferRefresh = FALSE
    WithOtherLinkRaise = FALSE
    WithKeyFilter = FALSE
    WithReportFetch = FALSE
    WithSplitCap = FALSE
    WithEvictAlone = FALSE
    WithEpochOnly = FALSE
    WithForwardIn = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
