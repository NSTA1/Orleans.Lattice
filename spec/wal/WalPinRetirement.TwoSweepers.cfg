\* Variant configuration for WalPinRetirement.tla: the same specification with
\* TWO orphan sweepers - each silo's local loop and the tree's coordinator grain -
\* racing each other and the starvation drive's retirement, checked against every
\* invariant and both action properties. The liveness property stays in
\* WalPinRetirement.cfg with one sweeper: with two it takes about eight minutes,
\* past the TLC budget (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config WalPinRetirement.TwoSweepers.cfg WalPinRetirement.tla

SPECIFICATION Spec

CONSTANTS
    NSweepers = 2

INVARIANTS
    TypeOK
    NoTrimPastLiveNeed
    LivePublisherPinned

PROPERTIES
    RetireOnlyHusk
    UnreadableNeverRetired
