\* Variant configuration for WalLiveAdvanceCore.tla: the lazy arm (#5833) for a bulk-born
\* leaf, which no longer replays to a claim head: the records its range held before the
\* switch are covered by the switch's close head (B's SwitchCloseCoversPriorAllocations).

SPECIFICATION LiveSpec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = TRUE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = FALSE
    WithBulk = TRUE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = FALSE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    PreArmCostWitness
    ReclaimCostBound

PROPERTIES
    NewbornPinEventuallyUsable
