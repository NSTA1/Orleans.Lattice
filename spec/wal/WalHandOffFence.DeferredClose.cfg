\* Variant configuration for WalHandOffFence.tla: the same specification as
\* WalHandOffFence.cfg under #5833's pre-arm with the lazy key-moving close (#5839): the shard
\* root raises the routing generation and then defers L's close head, and L's arm resolves it
\* (C5 when a later window's close already re-claimed above it). Safety only: every invariant
\* and the action property.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalHandOffFence.DeferredClose.cfg WalHandOffFence.tla

SPECIFICATION Spec

CONSTANTS
    WithBatch = TRUE
    MaxWindows = 2
    WithRestart = TRUE
    WithTreeWalk = TRUE
    WithLegacyHandOff = TRUE
    WithPreArm = TRUE
    WithDonorFence = FALSE
    WithDeferredClose = TRUE
    WithRearmRace = FALSE
    WithStaleDonor = FALSE

INVARIANTS
    TypeOK
    HandOffBound
    AbsentMarkerHolds
    DeferredHeadAtRaisedGeneration
    LiveDonorProgress
    StaleDetectionHonoured

PROPERTIES
    CloseHeadMonotone
