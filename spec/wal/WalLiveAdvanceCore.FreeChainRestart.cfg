\* Variant configuration for WalLiveAdvanceCore.tla: the forward chain of FreeReforward (F2') with a
\* WAL shard restart and an eviction and without the orphan's own forward, so the eviction's fold
\* of the chain's records is checked (a5e2e2ef's S-a).
\* PreArmCostWitness is not checked here: a WAL shard restart's fallback sets the shared
\* watermark to the recovered head, which may be an activation's own PreArm record - a
\* cost, as for the receiver-tag exclusion's fallback (N-a), never a passed record (MF2).
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeChainRestart.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 0
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithRestart = TRUE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = TRUE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = TRUE
    WithEpochOnly = FALSE
    WithForwardIn = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    ReclaimCostBound
    SoleActivationNeverFallsOff
