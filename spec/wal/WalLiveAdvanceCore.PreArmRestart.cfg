\* Variant configuration for WalLiveAdvanceCore.tla: the lazy arm (#5833) with a WAL shard
\* restart and an eviction of the leaf's foreign-high entry, so foreignHigh falls back on
\* the shard's start head and the eviction floor. No hand-off window, which the base
\* checks. Safety only, and without the PreArm cost witness: a restart takes every offset
\* below the recovered head as possibly unstamped, an own PreArm one included, by design.

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 0
    WithMixedVersion = TRUE
    WithGateFlip = FALSE
    WithRestart = TRUE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = FALSE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    ReclaimCostBound

