\* Variant configuration for WalLiveAdvanceCore.tla: the base with a key-moving close
\* into L (#5833): the shard root raises its generation and leaves a deferred head on
\* L's marker, a stale donor appends one of L's keys routed or unrouted, and a later
\* close re-claims a higher generation first (C5). Every property, the liveness one
\* included. The stale donor is the foreign author here, so the variant opens no hand-off
\* window and has no 10.2.0 silo (both are the base's).

SPECIFICATION LiveSpec

CONSTANTS
    MaxWindows = 0
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithKeyMove = TRUE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    PreArmCostWitness
    ReclaimCostBound

PROPERTIES
    NewbornPinEventuallyUsable
