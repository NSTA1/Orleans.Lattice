\* Variant configuration for WalLiveAdvanceCore.tla: the same specification and
\* the same instance as WalLiveAdvanceCore.cfg, with one more environment step:
\* an activation's own unstamped appends, made by any running activation at any
\* time, each reporting itself
\* (see "Variant configurations" in spec/README.md). Safety only: every
\* invariant of the base.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.GateFlip.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = TRUE
    WithGateFlip = TRUE
    WithRestart = FALSE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
