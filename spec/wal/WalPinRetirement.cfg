\* TLC model configuration for WalPinRetirement.tla
\* Bounded instance: one leaf grain whose pins may sit under two pin-store keys,
\* two WAL offsets, one re-population of the leaf's grain id after its row was cleared, the
\* starvation drive's retirement and one orphan sweeper, with no environment
\* fault (an interrupted self-retirement is not one: it is what leaves an
\* orphan), checked with every safety and liveness property.
\* WalPinRetirement.OneFault.cfg adds one fault - a routing change, an unreadable
\* leaf read or an abandoned run - and WalPinRetirement.TwoSweepers.cfg races a
\* second sweeper, both checked against every safety property.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config WalPinRetirement.cfg WalPinRetirement.tla
\* See README.md for details.

