\* Variant configuration for WalLiveAdvanceCore.tla: the idle leaf's report fetch (#5851 R4): a
\* leaf with no own append in flight reads the append response's report and the head on the
\* tick and free-advances to the head, with a key-moving close and its stale donor.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeReportFetch.cfg WalLiveAdvanceCore.tla

