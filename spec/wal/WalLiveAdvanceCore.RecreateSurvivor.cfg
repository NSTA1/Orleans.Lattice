\* Variant configuration for WalLiveAdvanceCore.tla: the purge of
\* WalLiveAdvanceCore.Recreate.cfg, in the slice it leaves out: purges that find
\* a1 unclaimed, so a1 may claim afterwards as the re-created incarnation's
\* activation (WithClaimedPurge = FALSE). Without the 10.2.0 silo's append, which
\* RecreateSurvivorMixed adds in place of the hand-off window, to stay within the
\* case budget (see the refinement note's property classification). Safety only:
\* every invariant of the base.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.RecreateSurvivor.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = TRUE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = FALSE
    WithFreeAdvance = FALSE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = FALSE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
