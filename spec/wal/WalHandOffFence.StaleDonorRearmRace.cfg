\* Variant configuration for WalHandOffFence.tla: the stale duplicate donor under #5833's pre-arm
\* with one more epoch, so the live donor's re-arm race of #5840 S4 is reachable: it re-arms
\* between its counted close and the link fence, and its one probed re-claim restores it.
\* The batch, the tree walk, the legacy hand-off and the WAL restart are off to fit the budget;
\* StaleDonorPreArm checks them at three epochs.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalHandOffFence.StaleDonorRearmRace.cfg WalHandOffFence.tla

SPECIFICATION Spec

CONSTANTS
    WithBatch = FALSE
    MaxWindows = 1
    WithRestart = FALSE
    WithTreeWalk = FALSE
    WithLegacyHandOff = FALSE
    WithPreArm = TRUE
    WithRearmRace = TRUE
    WithStaleDonor = TRUE

INVARIANTS
    TypeOK
    HandOffBound
    AbsentMarkerHolds
    LiveDonorProgress
    StaleDetectionHonoured

PROPERTIES
    CloseHeadMonotone
