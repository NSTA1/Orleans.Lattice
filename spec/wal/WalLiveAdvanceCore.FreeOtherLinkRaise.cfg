\* Variant configuration for WalLiveAdvanceCore.tla: an intervening generation raise (#5866 B1).
\* After the donor's close and before L's link, another split's link raises the shard root's
\* routing generation, and the stale donor's routed write is admitted under the raised one;
\* staleHigh counts it whatever its generation. Under the latch, so an unlinked L never claims.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeOtherLinkRaise.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

