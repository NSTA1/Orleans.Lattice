\* Variant configuration for WalHandOffFence.tla: the stale duplicate donor under #5833's pre-arm
\* with #5837's rule S: the donor runs the split fence itself in its close and adopts the bumped
\* row, with no relinquish (the adopting FenceSplitAsync). The WAL restart is off, as in
\* StaleDonorPreArm. Safety only.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalHandOffFence.StaleDonorDonorFence.cfg WalHandOffFence.tla

SPECIFICATION Spec

CONSTANTS
    WithBatch = TRUE
    MaxWindows = 1
    WithRestart = FALSE
    WithTreeWalk = TRUE
    WithLegacyHandOff = TRUE
    WithPreArm = TRUE
    WithDonorFence = TRUE
    WithDeferredClose = FALSE
    WithRearmRace = FALSE
    WithStaleDonor = TRUE

INVARIANTS
    TypeOK
    HandOffBound
    AbsentMarkerHolds
    DeferredHeadAtRaisedGeneration
    LiveDonorProgress
    StaleDetectionHonoured

PROPERTIES
    CloseHeadMonotone
