\* Variant configuration for WalAppendEpoch.tla: the same specification and the
\* same environment as WalAppendEpoch.cfg with epochs up to 4 instead of 3, so a
\* claim has room for one more bump round after a WAL shard restart, another leaf's
\* retirement, L's clear and a bump forced on a second partition have all raised
\* the entry, the floor or the row (see "Variant configurations" in
\* spec/README.md). Safety only: every invariant of the base.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalAppendEpoch.WideEpochs.cfg WalAppendEpoch.tla

SPECIFICATION Spec

CONSTANTS
    WithRestart = TRUE
    WithRecreate = TRUE
    WithOtherRetire = TRUE
    WithSecondPartition = TRUE
    MaxEpoch = 4

INVARIANTS
    TypeOK
    StaleEpochNeverAppends
    ClaimHeadCoversPriorAppends
    RaisedEpochUnique
    OnlySupersededRefused
