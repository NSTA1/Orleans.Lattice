\* Variant configuration for WalLiveAdvanceCore.tla: an orphan's forward (FreeOrphan) with a WAL
\* shard restart and an eviction, so the eviction's fold of the orphan's forward is checked
\* (a5e2e2ef's S-a).
\* PreArmCostWitness is not checked here: a WAL shard restart's fallback sets the shared
\* watermark to the recovered head, which may be an activation's own PreArm record - a
\* cost, as for the receiver-tag exclusion's fallback (N-a), never a passed record (MF2).
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.FreeOrphanRestart.cfg WalLiveAdvanceCore.tla

SPECIFICATION Spec

CONSTANTS
    MaxWindows = 0
    WithMixedVersion = FALSE
    WithGateFlip = FALSE
    WithRestart = TRUE
    WithRecreate = FALSE
    WithBulk = FALSE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = TRUE
    WithFreeAdvance = TRUE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = TRUE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = FALSE
    WithEpochOnly = FALSE
    WithForwardIn = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected
    ReclaimCostBound
    SoleActivationNeverFallsOff
