\* Variant configuration for WalHandOffFence.tla: the same specification and the
\* same environment as WalHandOffFence.cfg with four offsets instead of three,
\* generations up to 4 and three hand-off windows instead of two, so a third window
\* opens and closes above two earlier closes and a walk can be rejected and
\* re-stamped across more than one bump (see "Variant configurations" in
\* spec/README.md). Safety only: every invariant and the action property of the base.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalHandOffFence.WideWindows.cfg WalHandOffFence.tla

SPECIFICATION Spec

CONSTANTS
    WithBatch = TRUE
    MaxWindows = 3
    WithRestart = TRUE
    WithTreeWalk = TRUE
    WithLegacyHandOff = TRUE
    WithPreArm = FALSE
    WithRearmRace = FALSE
    WithStaleDonor = FALSE
    MaxOff = 4
    MaxEpoch = 4

INVARIANTS
    TypeOK
    HandOffBound
    AbsentMarkerHolds
    LiveDonorProgress
    StaleDetectionHonoured

PROPERTIES
    CloseHeadMonotone
