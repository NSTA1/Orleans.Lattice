\* Variant configuration for WalPinRetirement.tla: the same specification with a
\* budget of ONE environment fault - a routing change that duplicates the leaf's
\* pin across pin-store keys, an unreadable leaf read, or an abandoned run - checked
\* against every invariant and both action properties. The liveness property
\* stays in WalPinRetirement.cfg at no fault, where a fault-free sweep must retire
\* every orphan (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config WalPinRetirement.OneFault.cfg WalPinRetirement.tla

SPECIFICATION Spec

CONSTANTS
    MaxFaults = 1

INVARIANTS
    TypeOK
    NoTrimPastLiveNeed
    LivePublisherPinned

PROPERTIES
    RetireOnlyHusk
    UnreadableNeverRetired
