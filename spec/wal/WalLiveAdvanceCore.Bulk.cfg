\* Variant configuration for WalLiveAdvanceCore.tla: the same specification and
\* the same instance as WalLiveAdvanceCore.cfg, with one more environment step:
\* L born by a bulk switch, holding the range's pre-existing record, at its
\* birth hint and under the switch's open marker
\* (see "Variant configurations" in spec/README.md). Every invariant and the
\* liveness property of the base, under LiveSpec's fairness.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalLiveAdvanceCore.Bulk.cfg WalLiveAdvanceCore.tla

SPECIFICATION LiveSpec

CONSTANTS
    MaxWindows = 1
    WithMixedVersion = TRUE
    WithGateFlip = FALSE
    WithRestart = FALSE
    WithRecreate = FALSE
    WithBulk = TRUE
    WithUnclaimedSurvivor = TRUE
    WithPreArm = FALSE
    WithFreeAdvance = FALSE
    WithSplitHint = FALSE
    WithSplitBirth = FALSE
    WithDonorRestart = FALSE
    WithDuplicate = TRUE
    WithEvict = TRUE
    WithOrphanForward = FALSE
    WithLatch = FALSE
    WithBirthProof = FALSE
    WithFwdExclusion = FALSE
    WithTagEvict = FALSE
    WithViewOverlap = FALSE
    WithReforward = FALSE
    WithTransferRefresh = FALSE
    WithSplitCap = FALSE
    WithEvictAlone = FALSE
    WithEpochOnly = FALSE
    WithForwardIn = FALSE
    WithKeyMove = FALSE
    WithClaimedPurge = TRUE

INVARIANTS
    TypeOK
    ReadPositionHonest
    SnapshotHonest
    NoTrimPastAcked
    OldNeverRejected

PROPERTIES
    NewbornPinEventuallyUsable
