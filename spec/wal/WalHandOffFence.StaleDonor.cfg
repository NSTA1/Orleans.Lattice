\* Variant configuration for WalHandOffFence.tla: the same specification as
\* WalHandOffFence.cfg with a stale duplicate of a split's donor (#5841), which claims D's epoch before,
\* between or after the split's bump and appends an epoch-only write of a moved key,
\* under today's eager arm, where the splitting activation has always claimed. One
\* hand-off window: the split's. Safety only: every invariant and the action property.
\* (see "Variant configurations" in spec/README.md).
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -workers 2 -config WalHandOffFence.StaleDonor.cfg WalHandOffFence.tla

SPECIFICATION Spec

CONSTANTS
    WithBatch = TRUE
    MaxWindows = 1
    WithRestart = TRUE
    WithTreeWalk = TRUE
    WithLegacyHandOff = TRUE
    WithPreArm = FALSE
    WithDeferredClose = FALSE
    WithRearmRace = FALSE
    WithStaleDonor = TRUE

INVARIANTS
    TypeOK
    HandOffBound
    AbsentMarkerHolds
    DeferredHeadAtRaisedGeneration
    LiveDonorProgress
    StaleDetectionHonoured

PROPERTIES
    CloseHeadMonotone
