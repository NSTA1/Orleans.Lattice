\* TLC model configuration for AtomicCommit.tla
\* Bounded instance: 2 concurrent sagas, 3 keys, 2 participants per saga
\* (overlapping on k2), plus a bounded reshard orphan step per key.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config AtomicCommit.cfg AtomicCommit.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    t1 = t1
    t2 = t2
    k1 = k1
    k2 = k2
    k3 = k3

INVARIANTS
    TypeOK
    AllOrNothing
    VisibilityMatchesDecision
    StrictIsolation
    CommitIntegrity
    LinearizedTerminals
    NoMixedTerminals

PROPERTIES
    DecisionDurability
    MonotonicVisibility
    RevisionMonotonic
    Termination
    EveryCommittedKeyReadable
