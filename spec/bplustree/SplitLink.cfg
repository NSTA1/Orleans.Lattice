\* TLC model configuration for SplitLink.tla
\* Bounded instance: three keys, one split key, one shard-root crash.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -deadlock -config SplitLink.cfg SplitLink.tla
\* See README.md for details.

SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2, 3}
    SplitKey = 2
    MaxCrashes = 1
INVARIANTS
    TypeOK
    NoKeyLostOrDuplicated
    LinkObligationDurable
    IntentOnlyForCompleteSplit
    LinkedClearsIntent
    ChainedImpliesBorn
    BornImpliesIntent
    SplitOnlyOfNonEmptyLeaf
PROPERTIES
    SplitEventuallyLinked
