\* Variant configuration for ReplicationLowWatermark.tla: one partition with
\* two dead-letters against a capacity of one, so the queue fills and backpressure engages.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ReplicationLowWatermark.DeadLetters.cfg ReplicationLowWatermark.tla

SPECIFICATION Spec

CONSTANTS
    NParts = 1
    MaxDeadLetters = 2

INVARIANTS
    TypeOK
    CausalOrder

PROPERTIES
    EventualConvergence
