\* TLC model configuration for Replication.tla
\* Bounded instance: clusters a, b (writers) and c (receive-only), keys k1
\* (last-writer-wins) and k2 (grow-only counter), at most two writes, one
\* environment fault, and one bootstrap of c from b. See README.md.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config Replication.cfg Replication.tla

SPECIFICATION Spec

CONSTANTS
    a = a
    b = b
    c = c
    k1 = k1
    k2 = k2

INVARIANTS
    TypeOK
    NoReflection
    CursorNeverSkipsUnshipped
    BootstrapHandoffLosesNothing
    CausalOrder

PROPERTIES
    NoRelay
    DedupNeverDropsNew
    EventualConvergence
