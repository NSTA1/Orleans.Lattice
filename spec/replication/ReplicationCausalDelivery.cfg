\* TLC model configuration for ReplicationCausalDelivery.tla
\* Bounded instance: writers a and b (two writes each), receiver c, HLCs up
\* to 2, one-entry shipping batches. See README.md.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ReplicationCausalDelivery.cfg ReplicationCausalDelivery.tla

SPECIFICATION Spec

CONSTANTS
    a = a
    b = b
    c = c

INVARIANTS
    TypeOK
    CausalOrder

PROPERTIES
    EventualConvergence
