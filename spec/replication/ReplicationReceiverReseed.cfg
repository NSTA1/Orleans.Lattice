\* TLC model configuration for ReplicationReceiverReseed.tla
\* Bounded instance: one sender log of two writes, three export epochs (one
\* kept back for a re-seed), one receiver-initiated bootstrap. See README.md.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ReplicationReceiverReseed.cfg ReplicationReceiverReseed.tla

SPECIFICATION Spec

CONSTANTS
    MaxWrites = 2
    MaxExports = 3

INVARIANTS
    TypeOK
    NoLostWrite
    NoRedundantReseed

PROPERTIES
    Converges
