\* TLC model configuration for ReplicationLowWatermark.tla
\* Bounded instance: origin a with two WAL partitions and two writes, a
\* dependent writer b with one write, receiver c; HLCs up to 2; one
\* dead-letter; no sagas, transport loss or bootstrap. The variant
\* configurations enable each of those on one partition. See README.md.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ReplicationLowWatermark.cfg ReplicationLowWatermark.tla

