\* Variant configuration for ReplicationReBootstrap.tla: concurrent mutual
\* re-seeds (#5689). s and r each re-seed from the other's export, staging on
\* a shadow copy that a cutover puts in the tree's place, and a drain whose
\* source cut over under it is aborted and re-driven into a fresh copy. Two
\* writes, no third cluster, and no disruption or detach (see Mutual in the
\* module) keep it inside the per-run budget.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ReplicationReBootstrap.Mutual.cfg ReplicationReBootstrap.tla

SPECIFICATION Spec

CONSTANTS
    s = s
    r = r
    q = q
    Mutual = TRUE

INVARIANTS
    TypeOK
    ReconcileDeletesOnlyDeleted

PROPERTIES
    EventualConvergence
    EventualKept
