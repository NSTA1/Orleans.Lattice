\* Variant configuration for ReplicationLowWatermark.tla: one partition with
\* one transport loss, so the drained cursor runs ahead of the acked one.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ReplicationLowWatermark.Loss.cfg ReplicationLowWatermark.tla

SPECIFICATION Spec

CONSTANTS
    NParts = 1
    MaxLoss = 1

INVARIANTS
    TypeOK
    CausalOrder

PROPERTIES
    EventualConvergence
