\* Variant configuration for ReplicationReBootstrap.tla: a third cluster q
\* whose writes reach s and r over their own edges, so the receiver's
\* bootstrap drop floor (#4549) has a write to drop. Two writes and one
\* detach keep it inside the per-run budget; see Reattach in the module.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ReplicationReBootstrap.Floor.cfg ReplicationReBootstrap.tla

SPECIFICATION Spec

CONSTANTS
    s = s
    r = r
    q = q
    Third = TRUE
    MaxWrites = 2
    Reattach = FALSE

INVARIANTS
    TypeOK
    ReconcileDeletesOnlyDeleted

PROPERTIES
    EventualConvergence