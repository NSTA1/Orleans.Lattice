\* Variant of BackupRetention.cfg: two retention passes running at once, as
\* an operator's PruneAsync and a scheduled cycle's prune can on one scheduler
\* activation. Invariants and action properties only; the liveness property
\* is checked at the base bound (bounded-out here for the TLC budget).

SPECIFICATION Spec

CONSTANTS
    NumPasses = 2

INVARIANTS
    TypeOK
    RetainedRestorable
    ListedRestorable
    SinkChainIntact

PROPERTIES
    InFlightBaseSurvives
    KeepPolicyHonoured