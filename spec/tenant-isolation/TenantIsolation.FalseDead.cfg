\* TenantIsolation.FalseDead.cfg - variant configuration for TenantIsolation.tla
\* Two silos, one registry write, one epoch grain re-activation and one false
\* death declaration, so a silo membership reports dead may still trust a lease
\* from the previous activation while the new activation's grace runs.
\* Safety only: see the refinement note's gap register for liveness under a
\* false declaration.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config TenantIsolation.FalseDead.cfg TenantIsolation.tla
\* See README.md for details.

SPECIFICATION Spec
CONSTANTS
    NumSilos = 2
    MaxWrites = 1
    MaxCrashes = 0
    MaxRestarts = 1
    MaxFailures = 0
    MaxFalseDeaths = 1
INVARIANTS
    TypeOK
    NoStaleAuthority
    WriterReadsOwnWrite
    PublicationWindowTracked
    UnconfirmableDenies
    NoEarlyGraceRelease
PROPERTIES
    EpochMonotonic