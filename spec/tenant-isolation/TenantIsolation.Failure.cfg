\* TenantIsolation.Failure.cfg - variant configuration for TenantIsolation.tla
\* Two silos, one registry write and one failed publication, so the write
\* returns ahead of its coverage and owes a background re-publish.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config TenantIsolation.Failure.cfg TenantIsolation.tla
\* See README.md for details.

SPECIFICATION Spec
CONSTANTS
    NumSilos = 2
    MaxWrites = 1
    MaxCrashes = 0
    MaxRestarts = 0
    MaxFailures = 1
INVARIANTS
    TypeOK
    NoStaleAuthority
    WriterReadsOwnWrite
    PublicationWindowTracked
    UnconfirmableDenies
PROPERTIES
    EpochMonotonic
    EveryCommitEventuallyCovered