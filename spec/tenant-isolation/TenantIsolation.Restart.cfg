\* TenantIsolation.Restart.cfg - variant configuration for TenantIsolation.tla
\* Two silos, one registry write and one epoch grain re-activation, so leases
\* granted by the previous activation are still trusted during the grace.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config TenantIsolation.Restart.cfg TenantIsolation.tla
\* See README.md for details.

SPECIFICATION Spec
CONSTANTS
    NumSilos = 2
    MaxWrites = 1
    MaxCrashes = 0
    MaxRestarts = 1
    MaxFailures = 0
INVARIANTS
    TypeOK
    NoStaleAuthority
    WriterReadsOwnWrite
    PublicationWindowTracked
    UnconfirmableDenies
PROPERTIES
    EpochMonotonic
    EveryCommitEventuallyCovered