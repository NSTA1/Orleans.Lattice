\* TenantIsolation.Crash.cfg - variant configuration for TenantIsolation.tla
\* Two silos, one registry write and one silo crash, so a peer can trust a
\* stale snapshot until membership declares the crashed writer dead.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config TenantIsolation.Crash.cfg TenantIsolation.tla
\* See README.md for details.

SPECIFICATION Spec
CONSTANTS
    NumSilos = 2
    MaxWrites = 1
    MaxCrashes = 1
    MaxRestarts = 0
    MaxFailures = 0
INVARIANTS
    TypeOK
    NoStaleAuthority
    WriterReadsOwnWrite
    PublicationWindowTracked
    UnconfirmableDenies
PROPERTIES
    EpochMonotonic
    EveryCommitEventuallyCovered