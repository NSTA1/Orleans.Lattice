\* TenantIsolation.cfg - TLC model configuration for TenantIsolation.tla
\* Base instance: two silos, one registry write, no environment faults. Each
\* fault class is checked with two silos in its own variant configuration, and
\* all three together on one silo in TenantIsolation.Faults.cfg.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config TenantIsolation.cfg TenantIsolation.tla
\* See README.md for details.

SPECIFICATION Spec
CONSTANTS
    NumSilos = 2
    MaxWrites = 1
    MaxCrashes = 0
    MaxRestarts = 0
    MaxFailures = 0
INVARIANTS
    TypeOK
    NoStaleAuthority
    WriterReadsOwnWrite
    PublicationWindowTracked
    UnconfirmableDenies
PROPERTIES
    EpochMonotonic
    EveryCommitEventuallyCovered