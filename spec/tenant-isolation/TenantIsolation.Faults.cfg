\* TenantIsolation.Faults.cfg - variant configuration for TenantIsolation.tla
\* One silo, one registry write and every fault class at once: a crash, an
\* epoch grain re-activation and a failed publication may interleave.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config TenantIsolation.Faults.cfg TenantIsolation.tla
\* See README.md for details.

SPECIFICATION Spec
CONSTANTS
    NumSilos = 1
    MaxWrites = 1
    MaxCrashes = 1
    MaxRestarts = 1
    MaxFailures = 1
INVARIANTS
    TypeOK
    NoStaleAuthority
    WriterReadsOwnWrite
    PublicationWindowTracked
    UnconfirmableDenies
PROPERTIES
    EpochMonotonic
    EveryCommitEventuallyCovered