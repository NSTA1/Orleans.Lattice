\* TLC model configuration for ShardOwnershipRetention.tla
\* Bounded instance: two physical copies (T, the original; R, a resize
\* destination), two shards per copy, two keys (k1 never moves; k2's slot is
\* the one an adaptive split moves from s1 to s2), one split, one resize with an
\* optional undo after its flip, one atomic-write saga over {k1, k2}, one later
\* plain write of k2, one delayed shadow-forwarded prepare, the registry's mask
\* and retirement of the saga's row, and one leaf reactivation.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ShardOwnershipRetention.cfg ShardOwnershipRetention.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    T = T
    R = R
    s1 = s1
    s2 = s2
    k1 = k1
    k2 = k2

INVARIANTS
    TypeOK
    NoKeyLost
    NoResurrection
    AtomicOnOwner
    OwnerMonotonic
    ReadableOnceComplete

PROPERTIES
    SplitCompletes
    ResizeCompletes
    SagaCompletes
    NoStrandedBucket