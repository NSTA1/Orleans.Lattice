\* TLC model configuration for ShardOwnership.tla
\* Bounded instance: two physical copies (T, the original; R, a resize
\* destination), two shards per copy, two keys (k1 never moves; k2's slot is
\* the one an adaptive split moves from s1 to s2), one split, one reshard, one
\* resize with an optional undo, one atomic-write saga over {k1, k2}, one later
\* plain write of k2, one delayed shadow-forwarded prepare, one reactivation.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ShardOwnership.cfg ShardOwnership.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    T = T
    R = R
    s1 = s1
    s2 = s2
    k1 = k1
    k2 = k2

INVARIANTS
    TypeOK
    UniqueOwner
    NoKeyLost
    NoResurrection
    SagaBatchOnOneCopy
    AtomicOnOwner
    OwnerMonotonic

PROPERTIES
    SplitCompletes
    ReshardCompletes
    ResizeCompletes
    SagaCompletes
    RoutingConverges
