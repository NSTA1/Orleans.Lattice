\* TLC model configuration for ShardOwnershipFold.tla
\* Bounded instance: one physical copy, two shards, two keys (k1 never moves;
\* k2's slot an adaptive split moves from s1 to s2 and a fold moves back), one
\* split, one fold with one cancel, one atomic-write saga over {k1, k2}, and one
\* later write or delete of k2 with tombstone compaction.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -lncheck final -config ShardOwnershipFold.cfg ShardOwnershipFold.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    s1 = s1
    s2 = s2
    k1 = k1
    k2 = k2

INVARIANTS
    TypeOK
    UniqueOwner
    NoKeyLost
    NoResurrection
    AtomicOnOwner
    OwnerMonotonic

PROPERTIES
    MigrationCompletes
    SagaCompletes
    RoutingConverges
