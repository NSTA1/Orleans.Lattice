\* TLC model configuration for ShardOwnershipCutover.tla
\* Bounded instance: two physical copies (P, the copy the alias names before
\* the restore; S, the restored shadow), two keys on two shards, one
\* shadow-cutover restore with an optional revert, one atomic-write saga over
\* {k1, k2}, and at most one straggling routed prepare on the wire at a time.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config ShardOwnershipCutover.cfg ShardOwnershipCutover.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    P = P
    S = S
    k1 = k1
    k2 = k2

INVARIANTS
    TypeOK
    AtomicAcrossCutover
    CommittedBatchOnBoundCopy

PROPERTIES
    SagaSettles
