\* TLC model configuration for the AtomicCommitDecisionExpiry MUTANT.
\*
\* This cfg names EXACTLY ONE property, and that is deliberate. During the
\* atomicity audit a mutation cfg was authored by PREPENDING a property to an
\* existing PROPERTIES block instead of replacing it. The result was six
\* conjuncts where one was intended, the same property named in two lists, and
\* two separate violations misattributed - a confidently wrong headline that
\* took four independent routes to overturn. The tell was in the log all along:
\* the satisfiability report showed 6 branches where the intended cfg shows 2.
\*
\* So: one property per mutant cfg, and each cfg is written WHOLE rather than
\* edited from another. The paired fixture asserts that TLC reports a violation
\* naming this property specifically, which is what makes a misattribution
\* fail rather than merely look odd.
\*
\* TypeOK is carried as a positive control: the mutant must remain a
\* well-formed model, so that the violation below is a real behaviour of the
\* protocol-with-mutation rather than an artefact of a malformed state space.
\*
\* Expected: MonotonicVisibility VIOLATED at depth 4, on the trace
\* Init -> PrepareTx -> DecideTx -> DecisionExpire.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config AtomicCommitDecisionExpiry.cfg \
\*            AtomicCommitDecisionExpiry.tla
\* See README.md in this directory.

SPECIFICATION Spec

CONSTANTS
    t1 = t1
    t2 = t2
    k1 = k1
    k2 = k2
    k3 = k3

INVARIANTS
    TypeOK

PROPERTIES
    MonotonicVisibility
