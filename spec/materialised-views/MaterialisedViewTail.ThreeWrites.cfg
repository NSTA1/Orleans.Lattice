\* TLC model configuration for MaterialisedViewTail.tla
\* Bounded instance: two keys, three source writes, two physical copies (P1,
\* the copy the logical tree names at creation; P2, the copy a resize,
\* reshard or restore swaps in), one identity swap, one retention-TTL trim,
\* one out-of-band drift, one maintainer crash, and a lag budget of one.
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config MaterialisedViewTail.ThreeWrites.cfg MaterialisedViewTail.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    MaxWrites = 3
    MaxTtl = 1
    MaxDrift = 1
    MaxCrashes = 1
    LagBudget = 1

INVARIANTS
    TypeOK
    ServedNeverAhead
    NoLostWrite
    CheckpointWithinApplied
    PinOnlyOnBinding
    DecommissionReleases
    ReplayConverges

PROPERTIES
    CursorTrimEntitled
    ServedMonotone
    ViewConverges
    PinConverges
    GenerationsReclaimed
