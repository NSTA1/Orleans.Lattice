\* TLC model configuration for AtomicCommitCrossCluster.tla
\* One origin saga (AtomicCommit's t1, over k1 and k2) replicated to one
\* receiver that follows the stream, in both shapes: a single-tree saga over
\* two source shards and a cross-tree saga over two trees. No loss path is
\* enabled here. A receiver that joins through a bootstrap snapshot, and each
\* loss path, are checked with every property by the variant configurations
\* AtomicCommitCrossCluster.<Variant>.cfg.
\*
\* Run from this directory (AtomicCommit.tla must sit beside the module):
\*   java -cp tla2tools.jar tlc2.TLC -config AtomicCommitCrossCluster.cfg AtomicCommitCrossCluster.tla
\* See README.md for details.

SPECIFICATION Spec

CONSTANTS
    t1 = t1
    t2 = t2
    k1 = k1
    k2 = k2
    k3 = k3

INVARIANTS
    TypeOK
    RAllOrNothing
    RStrictIsolation
    RLinearizedTerminals
    DelegationsDisjoint

PROPERTIES
    RMonotonicVisibility
    RCommittedEventuallyVisible
    RNoStrandedPrepare
    RImportFenceLifts
